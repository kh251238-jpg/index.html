a button is clicked is called:","o":["An event handler","A compiler","A loop counter","A data type"],"a":0,"e":"Event handlers (listeners) respond to events such as clicks and key presses.","s":"draft","k":11},{"id":"d9","u":1,"q":"Which programming paradigm organises code around objects that combine data and behaviour?","o":["Object-oriented","Procedural","Machine code","Assembly"],"a":0,"e":"OOP bundles data (attributes) and behaviour (methods) into objects.","s":"draft","k":1},{"id":"d10","u":1,"q":"Which of these is a low-level language?","o":["Assembly language","Java","Python","C#"],"a":0,"e":"Assembly is close to machine code; Java, Python and C# are high-level.","s":"draft","k":1},{"id":"d11","u":1,"q":"What does the Agile approach emphasise?","o":["Short iterations with frequent customer feedback","One long phase with no feedback","Writing all documentation before any code","Avoiding testing until the end"],"a":0,"e":"Agile delivers working software in short sprints and adapts to feedback.","s":"draft","k":5},{"id":"d12","u":1,"q":"The binary number 1010 equals which decimal number?","o":["10","8","12","5"],"a":0,"e":"1×8 + 0×4 + 1×2 + 0×1 = 10.","s":"draft","k":1},{"id":"d13","u":2,"q":"Which is an example of a functional requirement?","o":["The system must let users reset their password by email","The system must load pages in under 2 seconds","The system must be available 99.9% of the time","The system must use the company colour scheme"],"a":0,"e":"Functional = what the system does. Speed, availability and appearance are non-functional.","s":"draft"},{"id":"d14","u":2,"q":"Which is an example of a non-functional requirement?","o":["The system must support 500 simultaneous users","The system must print invoices","The system must calculate tax","The system must store customer names"],"a":0,"e":"Performance/capacity is a non-functional (quality) requirement.","s":"draft"},{"id":"d15","u":2,"q":"Which technique gathers requirements by watching users do their normal work?","o":["Observation","Questionnaire","Prototyping","Code review"],"a":0,"e":"Observation shows how users really work, including steps they forget to mention.","s":"draft"},{"id":"d16","u":2,"q":"Which document records agreed requirements for a software project?","o":["Software Requirements Specification (SRS)","User manual","Test log","Release notes"],"a":0,"e":"The SRS is the formal record of agreed requirements.","s":"draft"},{"id":"d17","u":2,"q":"What should happen FIRST when a client asks for a new feature mid-project?","o":["Submit a formal change request so its impact can be assessed","Start coding it immediately","Ignore it until the project ends","Remove another feature without asking"],"a":0,"e":"Change management: request → impact analysis → approval → implement.","s":"draft","k":16},{"id":"d18","u":2,"q":"What is impact analysis in change management?","o":["Assessing how a change affects cost, schedule, scope and other components","Testing the user interface","Writing the user manual","Installing software updates"],"a":0,"e":"Impact analysis estimates the effect of a change before it is approved.","s":"draft","k":16},{"id":"d19","u":2,"q":"Who normally approves or rejects change requests on a project?","o":["A change control board or project sponsor","Any developer","The end user alone","The tester"],"a":0,"e":"A change control board (or sponsor) authorises changes.","s":"draft","k":16},{"id":"d20","u":2,"q":"A use case diagram mainly shows:","o":["Actors and the goals they achieve with the system","Database tables and keys","Network cables","Class inheritance"],"a":0,"e":"Use case diagrams show who (actors) does what (use cases) with the system.","s":"draft","k":12},{"id":"d21","u":2,"q":"Which UML diagram shows the order of messages between objects over time?","o":["Sequence diagram","Class diagram","Use case diagram","Deployment diagram"],"a":0,"e":"Sequence diagrams show interactions in time order.","s":"draft","k":12},{"id":"d22","u":2,"q":"What is 'scope creep'?","o":["Uncontrolled growth in project requirements","A type of software bug","A database error","A testing technique"],"a":0,"e":"Scope creep is adding requirements without controlling time, cost and approval.","s":"draft"},{"id":"d23","u":2,"q":"Requirement traceability means:","o":["Each requirement can be linked to its design, code and tests","Requirements are kept secret","Requirements are written in code","Only the manager can read requirements"],"a":0,"e":"A traceability matrix links requirements to design elements and test cases.","s":"draft"},{"id":"d24","u":2,"q":"What is a Data Flow Diagram (DFD) used for?","o":["Showing how data moves between processes, stores and external entities","Showing class inheritance","Showing project costs","Showing screen layouts"],"a":0,"e":"DFDs model the flow of data through a system.","s":"draft"},{"id":"d25","u":3,"q":"What is the purpose of a software review?","o":["To find defects and improve quality early by examining work products","To market the software","To install the software","To delete old code"],"a":0,"e":"Reviews (walkthroughs, inspections) catch defects before testing.","s":"draft"},{"id":"d26","u":3,"q":"Which review type is the most formal, with defined roles and checklists?","o":["Inspection","Walkthrough","Informal chat","Pair programming"],"a":0,"e":"Inspections are formal: moderator, reader, recorder, checklists and metrics.","s":"draft"},{"id":"d27","u":3,"q":"Lines of Code (LOC) is an example of:","o":["A software size metric","A testing tool","A programming language","A UML diagram"],"a":0,"e":"LOC measures size; function points measure functionality.","s":"draft","k":20},{"id":"d28","u":3,"q":"Cyclomatic complexity measures:","o":["The number of independent paths through code","The speed of a network","The number of users","Screen resolution"],"a":0,"e":"Higher cyclomatic complexity = more paths = harder to test and maintain.","s":"draft","k":20},{"id":"d29","u":3,"q":"Which tool is an IDE (Integrated Development Environment)?","o":["Eclipse","Microsoft Paint","Windows Explorer","Adobe Reader"],"a":0,"e":"IDEs like Eclipse, NetBeans, IntelliJ combine editor, compiler and debugger.","s":"draft","k":23},{"id":"d30","u":3,"q":"What does a version control system such as Git do?","o":["Tracks changes to code and lets teams merge and roll back","Compiles Java code","Designs databases","Encrypts emails"],"a":0,"e":"Version control records history, supports branching/merging and rollback.","s":"draft","k":22},{"id":"d31","u":3,"q":"Which criterion matters MOST when choosing a software tool for a team?","o":["It meets the project's requirements and fits existing systems","It has the most colourful interface","It is the newest on the market","It is the most expensive"],"a":0,"e":"Choose tools by fitness for purpose, compatibility, support and cost.","s":"draft"},{"id":"d32","u":3,"q":"Defect density is calculated as:","o":["Number of defects ÷ size of software (e.g. per KLOC)","Number of users ÷ servers","Lines of code × testers","Cost ÷ time"],"a":0,"e":"Defect density = defects per unit size, e.g. per 1000 lines.","s":"draft","k":20},{"id":"d33","u":3,"q":"Static analysis tools examine code:","o":["Without running it","Only while it runs","Only after release","Only on paper"],"a":0,"e":"Static analysis checks source code for problems without executing it.","s":"draft"},{"id":"d34","u":3,"q":"A peer code review is mainly used to:","o":["Find errors and improve code quality before release","Increase file size","Replace testing completely","Write the user manual"],"a":0,"e":"Another developer reads the code to catch defects and suggest improvements.","s":"draft"},{"id":"d35","u":4,"q":"What type of error stops a program from compiling?","o":["Syntax error","Logic error","Runtime error","User error"],"a":0,"e":"Syntax errors break language rules, so the compiler rejects the code.","s":"draft"},{"id":"d36","u":4,"q":"A program runs without crashing but gives the wrong total. This is a:","o":["Logic error","Syntax error","Compilation error","Hardware fault"],"a":0,"e":"Logic errors give wrong results without crashing.","s":"draft"},{"id":"d37","u":4,"q":"Dividing by zero while a program is running causes a:","o":["Runtime error","Syntax error","Design error","Typing error"],"a":0,"e":"Runtime errors happen during execution (e.g. divide by zero, null reference).","s":"draft"},{"id":"d38","u":4,"q":"What is a breakpoint in a debugger?","o":["A marker where execution pauses so you can inspect variables","A line that deletes code","A fatal error","The end of the program"],"a":0,"e":"Breakpoints pause execution for inspection.","s":"draft","k":29},{"id":"d39","u":4,"q":"Which testing method tests the internal code paths and logic?","o":["White-box testing","Black-box testing","Acceptance testing","Usability testing"],"a":0,"e":"White-box = internal structure known; black-box = only inputs/outputs.","s":"draft","k":31},{"id":"d40","u":4,"q":"Black-box testing is based on:","o":["Requirements and expected outputs, without looking at the code","The source code structure","The database design only","The developer's opinion"],"a":0,"e":"Black-box testers test behaviour against specifications.","s":"draft","k":31},{"id":"d41","u":4,"q":"Which testing level checks individual functions or classes in isolation?","o":["Unit testing","System testing","Acceptance testing","Integration testing"],"a":0,"e":"Unit tests check the smallest testable parts.","s":"draft"},{"id":"d42","u":4,"q":"Which testing checks that modules work correctly together?","o":["Integration testing","Unit testing","Alpha testing","Static testing"],"a":0,"e":"Integration testing checks interfaces between modules.","s":"draft","k":30},{"id":"d43","u":4,"q":"Re-running earlier tests after a change to make sure nothing else broke is:","o":["Regression testing","Smoke testing","Stress testing","Beta testing"],"a":0,"e":"Regression testing catches side-effects of changes.","s":"draft","k":30},{"id":"d44","u":4,"q":"Testing by real users at their own sites before final release is:","o":["Beta testing","Alpha testing","Unit testing","White-box testing"],"a":0,"e":"Alpha = in-house users; beta = real users in the real environment.","s":"draft","k":30},{"id":"d45","u":4,"q":"A test case should include:","o":["Input data, steps and the expected result","Only the programmer's name","Only the source code","Only the screen colour"],"a":0,"e":"Test cases specify inputs, steps, expected and actual results.","s":"draft"},{"id":"d46","u":4,"q":"Testing with values at the edges of valid ranges (e.g. 0, 1, 100, 101) is:","o":["Boundary value analysis","Equivalence partitioning","Smoke testing","Load testing"],"a":0,"e":"Errors cluster at boundaries, so test at and just beyond them.","s":"draft","k":32},{"id":"d47","u":5,"q":"Who is the main audience for a user manual?","o":["End users of the system","Database administrators only","Compiler designers","Hardware engineers"],"a":0,"e":"User manuals explain how to use the system to end users.","s":"draft","k":35},{"id":"d48","u":5,"q":"Which document helps developers maintain and update a system later?","o":["Technical (system) documentation","Marketing brochure","Sales invoice","Social media post"],"a":0,"e":"Technical documentation explains design, code and configuration for maintainers.","s":"draft","k":35},{"id":"d49","u":5,"q":"What is the purpose of a style guide in technical writing?","o":["To keep terminology, formatting and tone consistent","To store the source code","To test the program","To design the database"],"a":0,"e":"Style guides ensure consistency across documents and writers.","s":"draft","k":34},{"id":"d50","u":5,"q":"Why should screenshots be included in user documentation?","o":["They show users exactly what they will see, aiding understanding","They make the file larger","They replace the need for any text","They hide errors"],"a":0,"e":"Visuals reduce ambiguity in step-by-step instructions.","s":"draft"},{"id":"d51","u":5,"q":"Which writing style suits procedures in user guides?","o":["Numbered steps using short, active instructions","Long paragraphs with no structure","Passive, technical jargon","Random order of steps"],"a":0,"e":"Numbered, imperative steps (e.g. 'Click Save') are easiest to follow.","s":"draft","k":34},{"id":"d52","u":5,"q":"Why is version control important for documentation?","o":["Readers can see which version of the document matches the software","It makes the text longer","It removes the need for reviews","It translates the document"],"a":0,"e":"Version numbers and change history keep docs in step with releases.","s":"draft"},{"id":"d53","u":5,"q":"What is a glossary in technical documentation?","o":["A list of terms with their definitions","A list of bugs","A list of customers","A table of test results"],"a":0,"e":"A glossary defines technical terms for readers.","s":"draft"},{"id":"d54","u":5,"q":"Before publishing documentation, the BEST check is to:","o":["Have a target user follow the instructions to see if they work","Count the pages","Change the font","Remove all images"],"a":0,"e":"Usability-testing documents with real users catches gaps and errors.","s":"draft","k":34},{"id":"d55","u":5,"q":"Online help that appears next to the field a user is working on is called:","o":["Context-sensitive help","A printed manual","Release notes","A licence agreement"],"a":0,"e":"Context-sensitive help shows information relevant to the current screen or field.","s":"draft","k":35},{"id":"d56","u":5,"q":"Release notes mainly describe:","o":["New features, fixes and known issues in a software version","How to install hardware","The company's history","Marketing prices"],"a":0,"e":"Release notes summarise what changed in a release.","s":"draft"},{"id":"d57","u":7,"q":"Which keyword creates a new object in Java?","o":["new","class","static","void"],"a":0,"e":"new allocates an object and calls its constructor, e.g. new Student().","s":"draft","k":49},{"id":"d58","u":7,"q":"What is a constructor in Java?","o":["A special method that initialises a new object","A loop","A type of variable","A comment"],"a":0,"e":"Constructors have the class name and no return type.","s":"draft","k":49},{"id":"d59","u":7,"q":"Which Java concept hides data by making fields private and providing getters/setters?","o":["Encapsulation","Inheritance","Polymorphism","Compilation"],"a":0,"e":"Encapsulation protects internal state.","s":"draft","k":49},{"id":"d60","u":7,"q":"Which keyword lets a class inherit from another class in Java?","o":["extends","implements","import","inherits"],"a":0,"e":"class Car extends Vehicle. 'implements' is for interfaces.","s":"draft","k":49},{"id":"d61","u":7,"q":"Java source code is compiled into:","o":["Bytecode run by the Java Virtual Machine (JVM)","HTML","Machine code for one specific CPU only","SQL"],"a":0,"e":"javac produces .class bytecode; the JVM runs it on any platform.","s":"draft","k":51},{"id":"d62","u":7,"q":"Which is the correct Java main method signature?","o":["public static void main(String[] args)","public void main()","static int main(String args)","void Main(String[] args)"],"a":0,"e":"The JVM looks for public static void main(String[] args).","s":"draft","k":54},{"id":"d63","u":7,"q":"Which Java data type stores whole numbers?","o":["int","double","boolean","String"],"a":0,"e":"int = whole numbers; double = decimals; boolean = true/false.","s":"draft","k":54},{"id":"d64","u":7,"q":"Which loop is best when you know exactly how many times to repeat?","o":["for loop","while loop","do-while loop","if statement"],"a":0,"e":"for loops suit a known number of iterations.","s":"draft","k":53},{"id":"d65","u":7,"q":"Polymorphism in Java means:","o":["The same method call can behave differently depending on the object","A class can have only one method","Variables cannot change","Code runs only on Windows"],"a":0,"e":"Overriding/overloading let one interface have many forms.","s":"draft","k":49},{"id":"d66","u":7,"q":"What does the 'static' keyword mean on a Java method?","o":["It belongs to the class, not to an individual object","It cannot be called","It runs only once","It is private"],"a":0,"e":"Static members are shared by the class and called without creating an object.","s":"draft","k":49},{"id":"d67","u":7,"q":"Which statement handles exceptions in Java?","o":["try ... catch","if ... else","for ... each","switch ... case"],"a":0,"e":"try/catch catches and handles exceptions.","s":"draft"},{"id":"d68","u":7,"q":"What will System.out.println(7 / 2); print in Java?","o":["3","3.5","4","3.0"],"a":0,"e":"Both operands are int, so integer division gives 3.","s":"draft","k":54},{"id":"d69","u":8,"q":"What is a software component?","o":["A reusable, self-contained unit of software with a defined interface","A hardware cable","A user manual","A database row"],"a":0,"e":"Components are reusable building blocks with clear interfaces.","s":"draft","k":59},{"id":"d70","u":8,"q":"What is the main benefit of reusing existing software components?","o":["Faster development and fewer defects because the code is already tested","The program becomes slower","More code must be written","Testing is no longer needed at all"],"a":0,"e":"Reuse saves time and relies on proven code, but still needs integration testing.","s":"draft","k":59},{"id":"d71","u":8,"q":"In Java, which statement makes classes from a library available in your code?","o":["import","include","require","using"],"a":0,"e":"import java.util.ArrayList; brings in library classes.","s":"draft","k":57},{"id":"d72","u":8,"q":"An API (Application Programming Interface) is:","o":["A defined set of methods a component exposes for other code to use","A type of computer virus","A database table","A screen layout"],"a":0,"e":"APIs define how software components communicate.","s":"draft","k":59},{"id":"d73","u":8,"q":"Which Java package contains collection classes like ArrayList and HashMap?","o":["java.util","java.io","java.net","java.awt"],"a":0,"e":"java.util holds the Collections Framework.","s":"draft","k":57},{"id":"d74","u":8,"q":"Before using a third-party component, you should check:","o":["Its licence, compatibility, documentation and support","Only its colour scheme","Only its file name","Nothing, it can always be trusted"],"a":0,"e":"Licensing and compatibility problems are common risks of reuse.","s":"draft","k":59},{"id":"d75","u":8,"q":"A JAR file in Java is:","o":["A package of compiled classes and resources that can be reused","A text document","An image format","A database"],"a":0,"e":"JAR (Java ARchive) bundles .class files for distribution and reuse.","s":"draft","k":57},{"id":"d76","u":8,"q":"Which document explains how to use a library's classes and methods?","o":["API documentation (e.g. Javadoc)","A sales invoice","A test log","A network diagram"],"a":0,"e":"Javadoc/API docs describe each class, method and parameter.","s":"draft","k":59},{"id":"d77","u":8,"q":"What is an interface in Java?","o":["A contract of method signatures that classes must implement","A graphical window","A database connection","A loop"],"a":0,"e":"Interfaces define what methods a class must provide.","s":"draft","k":57},{"id":"d78","u":8,"q":"Open-source components:","o":["Have source code available under a licence that permits use and modification","Can never be used commercially","Have no licence at all","Are always unsafe"],"a":0,"e":"Open-source licences (MIT, GPL, Apache) set the rules for use.","s":"draft","k":59},{"id":"k0","u":1,"q":"What is the purpose of design in a systems development cycle?","o":["To formulate a logical approach to system implementation","To formulate a physical solution to system requirements","To formulate code in order to implement a website template","To formulate a solution to realize system requirements"],"a":3,"e":"Design turns the agreed requirements into a solution that can be built.","s":"booklet","f":"Booklet key not supplied; this answer is our best judgement. Instructor to confirm."},{"id":"k1","u":1,"q":"What best describes a Flowchart in software development?","o":["A sequence of events to be carried out","A rapid application design model","A use case diagram","A waterfall method"],"a":0,"e":"A flowchart shows the sequence of steps (events) to be carried out.","s":"booklet","k":6},{"id":"k2","u":1,"q":"Which type of programming has extensive use of subroutines?","o":["Spaghetti","Modular","Unit","Structured"],"a":1,"e":"Modular programming breaks a program into many subroutines (modules).","s":"booklet","k":7},{"id":"k4","u":1,"q":"Which of these describes an event driven program?","o":["It stores event data in a tree structure","It uses classes and methods to define events","It is coded in a procedural programming language","It responds to events triggered by the user"],"a":3,"e":"Event-driven programs respond to events such as clicks and key presses.","s":"booklet","k":11},{"id":"k5","u":1,"q":"Which is a programming tool?","o":["Compiler","Computator","Coder","Comparator"],"a":0,"e":"A compiler is a programming tool; the other words are not real tools.","s":"booklet","k":2},{"id":"k7","u":1,"q":"What is a type of Structured Programming?","o":["Unit Programming","Formal Programming","Modular Programming","Spaghetti Programming"],"a":2,"e":"Modular programming is a type of structured programming.","s":"booklet","k":7},{"id":"k8","u":1,"q":"What allows users to work with a system?","o":["A layer","A structure","A program","An interface"],"a":3,"e":"An interface lets users work with a system.","s":"booklet"},{"id":"k9","u":1,"q":"What feature is unique to event driven programs?","o":["Operational code","Trigger functions","Documentation","Trigger loops"],"a":1,"e":"Event-driven programs rely on trigger functions (handlers) that run when an event fires.","s":"booklet","k":11},{"id":"k10","u":1,"q":"What is a unique feature of an event driven program?","o":["Loop functions","Trigger functions","Event testers","Event forms"],"a":1,"e":"Trigger functions (event handlers) are the unique feature of event-driven programs.","s":"booklet","k":11},{"id":"k11","u":1,"q":"What is the purpose of Pseudocode in software development?","o":["To express the life cycle","To understand charts","To understand trees","To express algorithms"],"a":3,"e":"Pseudocode expresses an algorithm in plain, structured language.","s":"booklet","k":6},{"id":"k12","u":1,"q":"What tool is used to write Java programs?","o":["Editor","Interpreter","Compiler","Java VM"],"a":0,"e":"Java source code is written in an editor (or IDE); the compiler then translates it.","s":"booklet","k":2},{"id":"k13","u":1,"q":"What best describes the form of a programming language?","o":["Elements","Sections","Semantics","Syntax"],"a":3,"e":"Syntax is the form (grammar) of a language; semantics is its meaning.","s":"booklet"},{"id":"k14","u":1,"q":"What statement describes Java source code files?","o":["Each source file must begin with an import statement","Each source file can hold many public classes","Each source file ends in the extension class","Each source file can have only one public class"],"a":3,"e":"A Java source file may contain many classes but only one public class, named after the file.","s":"booklet"},{"id":"k16","u":1,"q":"What is byte code?","o":["XML code","Machine independent code","Machine specific code","Java code"],"a":1,"e":"Bytecode is machine-independent; the JVM runs it on any platform.","s":"booklet"},{"id":"k17","u":1,"q":"What are user tasks used for?","o":["To show privileges","To show executable code","To test algorithms","To determine objects"],"a":3,"e":"User tasks (use cases) are analysed to identify the objects a system needs.","s":"booklet","f":"Booklet key not supplied; this answer is our best judgement. Instructor to confirm.","k":6},{"id":"k18","u":1,"q":"What is pseudocode in software development?","o":["An informal way of describing a proce hod of locating errors","A method for prototyping","A method to execute code","A method to re-run code"],"a":0,"e":"Trace tables are a dry-run method for locating errors.","s":"booklet","k":28},{"id":"k53","u":4,"q":"Which type of test is used first in a linear development project?","o":["Alpha","Scenario","Beta","Acceptance"],"a":0,"e":"Alpha testing comes first: in-house testing as soon as the software can run.","s":"booklet","k":30},{"id":"k54","u":4,"q":"What is a static testing technique?","o":["Performance monitoring","Walkthrough","Partitioning","Boundary analysis"],"a":1,"e":"A walkthrough is a static technique: the code is reviewed, not executed.","s":"booklet","k":31},{"id":"k55","u":4,"q":"What is a quality assurance practice when creating user interfaces?","o":["Navigation mapping","Project management","Usability testing","Architecture design"],"a":2,"e":"Usability testing is a QA practice for user interfaces.","s":"booklet"},{"id":"k56","u":4,"q":"What method is used to locate program errors?","o":["Prototyping","Execution","Trace tables","Code segment"],"a":2,"e":"Trace tables track variable values step by step to locate program errors.","s":"booklet","k":28},{"id":"k57","u":4,"q":"In a linear software development cycle, what test type is used when the software is first able to run?","o":["White box","Alpha","Beta","Black box"],"a":1,"e":"Alpha testing is used when the software is first able to run.","s":"booklet","k":30},{"id":"k58","u":4,"q":"When should test plans be drawn up?","o":["At the design stage","At the feasibility stage","Just before implementation","When requirements are stable"],"a":0,"e":"Test plans are drawn up at the design stage, alongside the design (V-model).","s":"booklet","f":"Booklet key not supplied; this answer is our best judgement. Instructor to confirm.","k":32},{"id":"k59","u":4,"q":"What is another name for System Testing?","o":["Acceptance testing","White box testing","Black box testing","Module testing"],"a":2,"e":"Syst ,"a":0,"e":"A snapshot is the state of the data at a given moment.","s":"booklet"},{"id":"k219","u":15,"q":"What happens during the backup process for a database?","o":["Old data records are deleted from the primary site","New data is sent from the primary site to the backup site","Data from the primary site is replicated on the backup site","Data records are encrypted on the backup site"],"a":2,"e":"A backup replicates data from the primary site onto the backup site.","s":"booklet","k":105},{"id":"k220","u":15,"q":"Which command is used in SQL to return ALL rows when there is a match in ONE of the tables?","o":["Full Join","Right Join","Left Join","Join"],"a":0,"e":"A FULL JOIN returns all rows when there is a match in either table.","s":"booklet","k":106},{"id":"k222","u":16,"q":"Which three layers make up a multi-layer database architecture?","o":["Presentation; Business/Logic; Data","Business/Logic; Data Access; Storage","Data Access; Presentation; Storage","Presentation; Business/Logic; User interface"],"a":0,"e":"Multi-layer architecture: Presentation, Business/Logic and Data.","s":"booklet","k":107},{"id":"k223","u":15,"q":"What term is used to describe the reference set of tables and views of a database?","o":["Database dictionary","Data dictionary","Dictionary table","Dictionary"],"a":1,"e":"The data dictionary is the reference set of tables and views describing the database.","s":"booklet"},{"id":"k224","u":15,"q":"Which of these lists the attributes of a database source?","o":["String; User ID; Password","User ID; Password; Platform","Location; Driver; String","Name; Location; Driver"],"a":3,"e":"A data source is defined by its name, location and driver.","s":"booklet"},{"id":"k225","u":15,"q":"What term is used to identify each row in a flat-file database?","o":["Field","Attribute","Key","Tuple"],"a":2,"e":"A key identifies each row (record).","s":"booklet","f":"Booklet key not supplied; this answer is our best judgement. Instructor to confirm.","k":103},{"id":"k226","u":15,"q":"Which command is used to remove the data from an SQL database table?","o":["Purge","Remove","Delete","Drop table"],"a":2,"e":"DELETE removes data (rows) from a table; DROP removes the table itself.","s":"booklet","k":106},{"id":"k227","u":15,"q":"A college uses a relational database to store student and course records. They now want to include the name of the Tutor for each of the Courses. Each Tutor is responsible for a single course. Which is the simplest way to do this?","o":["Add a field Tutor to the STUDENT table","Add a field Tutor to the CLASS table","Create a table TUTORS related to CourseID","Add a field Tutor to the COURSE table"],"a":3,"e":"Each tutor teaches one course, so add a Tutor field to the COURSE table.","s":"booklet","k":103},{"id":"k228","u":15,"q":"Which type of database is illustrated in the example of a structure resembling an interconnected web with many-to-many relationships?","o":["Flat file","Relational","Hierarchical","Network"],"a":3,"e":"A web of many-to-many links is the network model.","s":"booklet","k":103},{"id":"k229","u":15,"q":"A flowchart is used in which type of modeling?","o":["SQL","UML","SDLC","RAD"],"a":1,"e":"UML activity diagrams are flowchart-style models.","s":"booklet","f":"Booklet key not supplied; this answer is our best judgement. Instructor to confirm.","k":104},{"id":"k230","u":15,"q":"What is a data structure?","o":["A way to edit and manipulate data","A way to store and organize data","A way to combine and insert data","A way to record and view data"],"a":1,"e":"A data structure is a way to store and organise data.","s":"booklet"},{"id":"k233","u":16,"q":"Which layer will hold the SQL code for a database?","o":["Business logic layer","Presentation layer","Data access layer","User interface layer"],"a":2,"e":"SQL code belongs in the data access layer.","s":"booklet","k":107},{"id":"k235","u":16,"q":"What is the term gender an example of in the XML shown below?\n\u003cperson gender=\"male\">\n  \u003cfirstname>Faisal\u003c/firstname>\n  \u003clastname>Ahmed\u003c/lastname>\n\u003c/person>","o":["Attribute","Sub-child element","Child element","Namespace"],"a":0,"e":"gender=\"male\" sits inside the start tag, so it is an attribute.","s":"booklet","k":110},{"id":"k236","u":16,"q":"What do the letters XSD stand for?","o":["eXtensible Schema Definition","eXtensible Stylesheet Descriptor","XML Schema Definition","XML Stylesheet Descriptor"],"a":2,"e":"XSD = XML Schema Definition.","s":"booklet","k":112},{"id":"k237","u":16,"q":"What is the reason to use Open Database Connectivity (ODBC) technology?","o":["To import data from an SQL database into an Excel spreadsheet","To interpret data relationships in a wide range of data sources","To link to a dynamic SQL command processor","To provide the same driver for all database management systems"],"a":0,"e":"ODBC lets applications such as Excel import data from SQL databases.","s":"booklet","k":109},{"id":"k238","u":16,"q":"Which is a correct expression in XML?","o":["\u003cmessage>if age &lt 30 then\u003c/message>","\u003cmessage>if age “\u003c30” then\u003c/message>","\u003cmessage>if age \u003c30 then\u003c/message>","\u003cmessage>if age &lt; 30 then\u003c/message>"],"a":3,"e":"\u003c must be escaped as &lt; (with the semicolon) inside XML text.","s":"booklet","k":111},{"id":"k242","u":16,"q":"An XML schema provides the definition of an XML document. Which is included in the schema?","o":["Default values for elements","The attributes of data types","The size of child elements","The properties of elements"],"a":0,"e":"An XML Schema can set default (and fixed) values for elements.","s":"booklet","f":"Booklet key not supplied; this answer is our best judgement. Instructor to confirm.","k":112},{"id":"k243","u":16,"q":"Which is an example of a self-closing element in XML?","o":["\u003cbook>","\u003cbook/>","\u003c/book />","\u003cbook>\u003c/book>"],"a":1,"e":"\u003cbook/> is a self-closing (empty) element.","s":"booklet","k":111},{"id":"k244","u":16,"q":"What describes the use of XML for data storage?","o":["XML uses HTML tags for markup","Internet browsers can read XML files","Data style sheets are unique to each XML document","XHTML is used to convert XML to HTML"],"a":1,"e":"Browsers can open and read XML files.","s":"booklet"},{"id":"k245","u":16,"q":"Which layer is responsible for the delivery and formatting of information to the application layer?","o":["Business logic layer","Session layer","Data access layer","Presentation layer"],"a":3,"e":"In the OSI model, the presentation layer formats data for the application layer.","s":"booklet","k":107},{"id":"k253","u":16,"q":"Which of the following strings is a correct XML name?","o":["xmlExtension","xslNewElement","XMLElement#123","XMLName"],"a":1,"e":"XML names cannot start with 'xml' (any case) or contain #; xslNewElement is valid.","s":"booklet","k":111},{"id":"k254","u":17,"q":"When using a system, where is the first place to go to find the cause of a print failure?","o":["Help file","On-screen information icon","Call to helpdesk","Printer manual"],"a":1,"e":"Check the on-screen error/information message first; it usually states the cause.","s":"booklet","f":"Booklet key not supplied; this answer is our best judgement. Instructor to confirm.","k":117},{"id":"k255","u":17,"q":"When is it best to use on-site instruction?","o":["When learners don't need to ask detailed questions","When practical hands-on instruction is needed","When large numbers of learners are involved","When the learning material is straightforward"],"a":1,"e":"On-site instruction suits practical, hands-on training.","s":"booklet","k":121},{"id":"k256","u":17,"q":"What is the best source of technical information to restore lost network services?","o":["Help file","On-screen information icon","Call to helpdesk","Printer manual"],"a":2,"e":"Restoring lost network services needs the helpdesk.","s":"booklet","k":117},{"id":"k257","u":17,"q":"Which term describes how training can be tailored for each learner's needs?","o":["Refinement","Revision","Personalization","Presentation"],"a":2,"e":"Personalisation tailors training to each learner.","s":"booklet","k":120},{"id":"k258","u":17,"q":"What is a benefit of a webinar presentation for technical training?","o":["To give each learner a different view","To send assignments to the tutor","To enroll learners for the lesson","To record a lesson for viewing later"],"a":3,"e":"Webinars can be recorded for viewing later.","s":"booklet","k":118},{"id":"k259","u":17,"q":"What is a benefit of personalizing technical instruction?","o":["Individuals can be tested annually","Individuals can learn at their own pace","Individuals have direct access to writers","Individuals need no human support"],"a":1,"e":"Personalised instruction lets learners go at their own pace.","s":"booklet","k":120},{"id":"k260","u":17,"q":"What term is used to describe the hardware that connects peripheral devices to a computer motherboard?","o":["Slot","Disk","Card","Port"],"a":3,"e":"A port connects peripheral devices to the motherboard.","s":"booklet","k":114},{"id":"g1","u":16,"q":"Which layer of the OSI model manages flow control, the rate at which data is sent between two nodes?","o":["Transport layer","Session layer","Network layer","Data link layer"],"a":0,"e":"The transport layer (layer 4) handles end-to-end delivery, flow control and error recovery.","s":"draft","k":107},{"id":"g2","u":16,"q":"Which OSI layer formats, translates or encrypts data before it reaches the application layer?","o":["Presentation layer","Transport layer","Network layer","Physical layer"],"a":0,"e":"The presentation layer (layer 6) handles data format, translation and encryption.","s":"draft","k":107},{"id":"g3","u":16,"q":"In XML, elements that share the same parent element are called:","o":["Siblings","Children","Roots","Attributes"],"a":0,"e":"Elements with the same parent are siblings.","s":"draft","k":110},{"id":"g4","u":17,"q":"Which network device regenerates a weak signal so it can travel further?","o":["Repeater","Router","Switch","Bridge"],"a":0,"e":"A repeater amplifies/regenerates signals. Routers join networks; switches join devices in one network.","s":"draft","k":114},{"id":"g5","u":17,"q":"Which device forwards packets between different networks using IP addresses?","o":["Router","Repeater","Hub","Bridge"],"a":0,"e":"Routers route traffic between networks by IP address.","s":"draft","k":114},{"id":"g6","u":17,"q":"Which device connects devices in one network and sends each frame only to the port it is meant for?","o":["Switch","Hub","Repeater","Modem"],"a":0,"e":"A switch learns MAC addresses and forwards frames only to the right port; a hub sends to all ports.","s":"draft","k":114},{"id":"g7","u":6,"q":"Experts checking an interface against a list of recognised usability principles is called:","o":["Heuristic evaluation","Beta testing","Load testing","Regression testing"],"a":0,"e":"Heuristic evaluation is an expert review against usability heuristics.","s":"draft","k":42},{"id":"g8","u":5,"q":"Which document is mainly used by support staff to keep a system running and improve the service over time?","o":["System maintenance manual","Marketing brochure","Quick-start guide","Release poster"],"a":0,"e":"The system maintenance manual supports ongoing maintenance and continuous service improvement.","s":"draft","k":35},{"id":"g9","u":3,"q":"A requirement stating that the system must run on Windows Server and support 500 users is a:","o":["Technical requirement","Marketing requirement","Social requirement","Training requirement"],"a":0,"e":"Platform and capacity conditions are technical requirements.","s":"draft","k":24},{"id":"g10","u":4,"q":"Which testing method, which examines internal code paths, is commonly used on prototypes?","o":["White-box testing","Beta testing","Acceptance testing","Usability survey"],"a":0,"e":"The sample paper links prototyping with white-box testing, which looks at the internal logic.","s":"draft","k":31},{"id":"p1","u":1,"q":"Which was one of the first high-level programming languages, designed for scientific calculation?","o":["FORTRAN","HTML","Java","SQL"],"a":0,"e":"FORTRAN (1957) was one of the first high-level languages. Earlier programs were written in machine code or assembly.","s":"draft","p":1,"k":0},{"id":"p2","u":1,"q":"Early computers were programmed mainly in:","o":["Machine code","Java","Python","HTML"],"a":0,"e":"The first computers were programmed directly in binary machine code.","s":"draft","p":1,"k":0},{"id":"p3","u":1,"q":"Which language generation uses mnemonics such as ADD and MOV?","o":["Second generation (assembly)","First generation (machine code)","Third generation (high-level)","Fourth generation (query languages)"],"a":0,"e":"Assembly language, the second generation, replaced binary with short mnemonics.","s":"draft","p":1,"k":0},{"id":"p4","u":1,"q":"What is the main difference between a compiler and an interpreter?","o":["A compiler translates the whole program before running; an interpreter translates line by line","A compiler runs code line by line; an interpreter translates it all first","A compiler edits code; an interpreter stores it","There is no difference"],"a":0,"e":"Compiler: whole program first. Interpreter: one line at a time as it runs.","s":"draft","p":1,"k":2},{"id":"p5","u":1,"q":"Which programming tool is used to type and change source code?","o":["Editor","Compiler","Interpreter","Loader"],"a":0,"e":"An editor is used to write and edit source code.","s":"draft","p":1,"k":2},{"id":"p6","u":1,"q":"In object-oriented programming, what is an object?","o":["An instance of a class","A type of loop","A database table","A compiler error"],"a":0,"e":"A class is the blueprint; an object is an instance created from it.","s":"draft","p":1,"k":3},{"id":"p7","u":1,"q":"Which feature of OOP hides an object's data and allows access only through methods?","o":["Encapsulation","Inheritance","Iteration","Compilation"],"a":0,"e":"Encapsulation keeps data private and exposes methods.","s":"draft","p":1,"k":3},{"id":"p8","u":1,"q":"Which OOP feature allows one method name to behave differently for different objects?","o":["Polymorphism","Encapsulation","Abstraction","Sequencing"],"a":0,"e":"Polymorphism = many forms of the same method.","s":"draft","p":1,"k":3},{"id":"p9","u":1,"q":"What does database programming involve?","o":["Writing programs that store, retrieve and manage data in a database","Designing printed brochures","Drawing network cables","Creating slide animations"],"a":0,"e":"Database programming uses languages such as SQL to work with stored data.","s":"draft","p":1,"k":4},{"id":"p10","u":1,"q":"Which language is most associated with database programming?","o":["SQL","HTML","CSS","Assembly"],"a":0,"e":"SQL (Structured Query Language) is used to query and manage relational databases.","s":"draft","p":1,"k":4},{"id":"p11","u":1,"q":"A program that saves customer orders and retrieves them later is an example of:","o":["Database programming","Spaghetti programming","Event tree analysis","Slideshow design"],"a":0,"e":"Storing and retrieving records is database programming.","s":"draft","p":1,"k":4},{"id":"p12","u":1,"q":"What is the main problem with spaghetti code?","o":["Its tangled flow (e.g. many GOTOs) makes it hard to read and maintain","It runs too fast","It cannot be compiled","It uses too many comments"],"a":0,"e":"Spaghetti code has no clear structure, so it is hard to follow and maintain.","s":"draft","p":1,"k":7},{"id":"p13","u":1,"q":"Structured programming replaced GOTO jumps with:","o":["Sequence, selection and iteration","Random jumps","Global variables only","Machine code"],"a":0,"e":"Structured programming builds programs from sequence, selection and iteration.","s":"draft","p":1,"k":7},{"id":"p14","u":1,"q":"An IF...ELSE statement is an example of which control structure?","o":["Branch (selection)","Loop (iteration)","Sequence","Variable"],"a":0,"e":"IF/ELSE chooses between paths: a branch.","s":"draft","p":1,"k":8},{"id":"p15","u":1,"q":"Which structure repeats a block of code while a condition is true?","o":["Loop","Branch","Sequence","Expression"],"a":0,"e":"Loops repeat instructions.","s":"draft","p":1,"k":8},{"id":"p16","u":1,"q":"Which data type stores true or false?","o":["Boolean","Integer","String","Char"],"a":0,"e":"Boolean values are true or false.","s":"draft","p":1,"k":9},{"id":"p17","u":1,"q":"What is an array?","o":["A collection of elements of the same type accessed by an index","A single true/false value","A type of loop","A comment in code"],"a":0,"e":"Arrays hold many values of one type under one name, indexed by position.","s":"draft","p":1,"k":9},{"id":"p18","u":1,"q":"In the statement total = price * 2; what is price * 2?","o":["An expression","A data type","A loop","A class"],"a":0,"e":"An expression combines values and operators to produce a result.","s":"draft","p":1,"k":9},{"id":"p19","u":1,"q":"What does sorting do to data?","o":["Arranges it in a specific order, such as ascending or descending","Deletes duplicate files","Encrypts it","Compresses it"],"a":0,"e":"Sorting arranges data in order.","s":"draft","p":1,"k":10},{"id":"p20","u":1,"q":"Which is a well-known sorting algorithm?","o":["Bubble sort","Fault tree","Use case","Waterfall"],"a":0,"e":"Bubble sort repeatedly swaps adjacent items that are in the wrong order.","s":"draft","p":1,"k":10},{"id":"p21","u":1,"q":"Sorting the list 9, 2, 7 in ascending order gives:","o":["2, 7, 9","9, 7, 2","7, 2, 9","2, 9, 7"],"a":0,"e":"Ascending = smallest to largest.","s":"draft","p":1,"k":10},{"id":"p22","u":2,"q":"Which flowchart symbol represents a decision?","o":["Diamond","Rectangle","Oval","Parallelogram"],"a":0,"e":"Diamond = decision; rectangle = process; oval = start/end; parallelogram = input/output.","s":"draft","p":1,"k":13},{"id":"p23","u":2,"q":"In a requirements flowchart, which symbol marks the start or end?","o":["Oval (terminator)","Diamond","Rectangle","Arrow"],"a":0,"e":"The terminator (oval) shows start and end.","s":"draft","p":1,"k":13},{"id":"p24","u":2,"q":"Why are flowcharts useful when modelling requirements?","o":["They show the steps and decisions of a process visually","They store the database","They compile the program","They encrypt the requirements"],"a":0,"e":"Flowcharts make a process easy to see and discuss.","s":"draft","p":1,"k":13},{"id":"p25","u":2,"q":"Which feature improves the usability of a requirements document?","o":["Clear headings, consistent layout and plain language","Long paragraphs without headings","Many different fonts","Removing the table of contents"],"a":0,"e":"Good document design makes requirements easy to read and find.","s":"draft","p":1,"k":15},{"id":"p26","u":2,"q":"Why should requirements documents follow a standard template?","o":["So all documents are consistent and easy to review","To make them longer","To hide information","To avoid sign-off"],"a":0,"e":"A template keeps structure and style consistent.","s":"draft","p":1,"k":15},{"id":"p27","u":2,"q":"Which element helps readers find sections quickly in a long specification?","o":["A table of contents","Background images","Coloured text everywhere","A cover photo"],"a":0,"e":"A table of contents improves navigation in long documents.","s":"draft","p":1,"k":15},{"id":"p28","u":2,"q":"In risk analysis, 'magnitude' refers to:","o":["How severe the impact of the risk would be","How likely the risk is to happen","Who reported the risk","When the project ends"],"a":0,"e":"Magnitude = impact or severity. Likelihood = probability.","s":"draft","p":1,"k":17},{"id":"p29","u":2,"q":"How is a risk commonly quantified?","o":["Likelihood × magnitude (impact)","Cost + time","Number of users ÷ servers","Lines of code × testers"],"a":0,"e":"Risk exposure = probability × impact.","s":"draft","p":1,"k":17},{"id":"p30","u":2,"q":"A risk that is very likely but has very small impact should be rated:","o":["Low to medium, because the impact is small","Critical, because it is likely","Ignored completely","High, because all risks are high"],"a":0,"e":"Both likelihood and magnitude decide the risk level.","s":"draft","p":1,"k":17},{"id":"p31","u":2,"q":"What is the difference between a fault tree and an event tree?","o":["A fault tree works back from a failure to its causes; an event tree works forward from an event to its outcomes","They are the same diagram","A fault tree shows outcomes; an event tree shows causes","Neither is used in risk analysis"],"a":0,"e":"Fault tree: top-down causes. Event tree: forward outcomes.","s":"draft","p":1,"k":18},{"id":"p32","u":2,"q":"Fault tree analysis starts from:","o":["An undesired top event (failure)","A list of users","The project budget","The user interface"],"a":0,"e":"FTA begins with the failure and traces causes downward.","s":"draft","p":1,"k":18},{"id":"p33","u":3,"q":"Which model estimates development effort from lines of code or function points?","o":["COCOMO","CMMI","ISO 9001","Six Sigma"],"a":0,"e":"COCOMO (Constructive Cost Model) is an algorithmic estimation model.","s":"draft","p":1,"k":21},{"id":"p34","u":3,"q":"Estimating a new project by comparing it with similar past projects is called:","o":["Analogy estimation","Black-box testing","Static analysis","Regression testing"],"a":0,"e":"Analogy estimation uses data from similar completed projects.","s":"draft","p":1,"k":21},{"id":"p35","u":3,"q":"Why do software teams estimate effort before development?","o":["To plan time, cost and resources","To test the code","To write the user manual","To design the logo"],"a":0,"e":"Estimates support planning and budgeting.","s":"draft","p":1,"k":21},{"id":"p36","u":3,"q":"Which activity is the core of software configuration management?","o":["Version control","Graphic design","Marketing","User training"],"a":0,"e":"SCM tracks and controls versions and changes.","s":"draft","p":1,"k":22},{"id":"p37","u":3,"q":"Which group reviews and approves changes in configuration management?","o":["Change control board (CCB)","The end users only","The marketing team","The help desk"],"a":0,"e":"A change (configuration) control board approves changes.","s":"draft","p":1,"k":22},{"id":"p38","u":3,"q":"Industry-accepted software is chosen mainly because it is:","o":["Reliable, well supported and meets standards","The newest product","The cheapest product","Free of documentation"],"a":0,"e":"Organisations trust products with proven reliability and support.","s":"draft","p":1,"k":23},{"id":"p39","u":3,"q":"Which is an example of an industry-standard relational DBMS?","o":["Oracle Database","Microsoft Paint","Notepad","WinZip"],"a":0,"e":"Oracle, SQL Server and MySQL are industry-standard DBMSs.","s":"draft","p":1,"k":23},{"id":"p40","u":3,"q":"Which statement is a business requirement?","o":["The system must reduce order processing time by 20%","The button must be blue","The code must use tabs","The server must have 3 fans"],"a":0,"e":"Business requirements state what the business needs to achieve.","s":"draft","p":1,"k":24},{"id":"p41","u":3,"q":"What does an input/output driver do?","o":["Lets the operating system communicate with a hardware device","Writes the user manual","Designs the database","Tests the website"],"a":0,"e":"Drivers translate between the OS and hardware such as printers and keyboards.","s":"draft","p":1,"k":25},{"id":"p42","u":3,"q":"A new printer does not work until software is installed. What is missing?","o":["The printer driver","The compiler","The firewall","The database"],"a":0,"e":"The printer (output) driver lets the OS send data to the printer.","s":"draft","p":1,"k":25},{"id":"p43","u":3,"q":"Which is an input device whose driver must be installed?","o":["Scanner","Monitor","Speaker","Printer"],"a":0,"e":"Scanners send data into the computer: input. Monitors, speakers and printers are output.","s":"draft","p":1,"k":25},{"id":"p44"  kept patched?","o":["Unpatched vulnerabilities can be exploited by attackers","Patches make pages colourful","Patches remove the firewall","Patches delete the website"],"a":0,"e":"Updates close known security holes.","s":"draft","p":1,"k":93},{"id":"p75","u":14,"q":"Which is an example of HTTP server software?","o":["Apache","Excel","Photoshop","Outlook"],"a":0,"e":"Apache and Microsoft IIS are HTTP servers.","s":"draft","p":1,"k":93},{"id":"p76","u":14,"q":"What is a distributed denial-of-service (DDoS) attack?","o":["Many compromised computers flood a target so legitimate users cannot reach it","One user guessing a password","A virus in a spreadsheet","An email with a fake sender"],"a":0,"e":"DDoS uses many machines (a botnet) to overwhelm a service.","s":"draft","p":1,"k":97},{"id":"p77","u":14,"q":"Which security principle does a denial-of-service attack mainly affect?","o":["Availability","Confidentiality","Integrity","Authentication"],"a":0,"e":"DoS stops the service being available.","s":"draft","p":1,"k":97},{"id":"p78","u":14,"q":"DOCSIS is a standard used for:","o":["Internet access over cable television networks","Encrypting email","Wireless networks","Secure card payments"],"a":0,"e":"DOCSIS = Data Over Cable Service Interface Specification.","s":"draft","p":1,"k":98},{"id":"p79","u":14,"q":"Which device uses DOCSIS to connect a home to the internet?","o":["A cable modem","A Wi-Fi printer","A USB drive","A projector"],"a":0,"e":"Cable modems use DOCSIS.","s":"draft","p":1,"k":98},{"id":"p80","u":14,"q":"What does DNSSEC protect against?","o":["Forged or altered DNS lookup data (DNS spoofing)","Weak passwords","Paper jams","Slow hard drives"],"a":0,"e":"DNSSEC uses digital signatures so DNS answers can be trusted.","s":"draft","p":1,"k":99},{"id":"p81","u":14,"q":"DNSSEC adds which feature to DNS responses?","o":["Digital signatures","Video streaming","Compression","Spell checking"],"a":0,"e":"Signed records let resolvers verify authenticity.","s":"draft s the newest","Users can install anything","It needs no training"],"a":0,"e":"Supported products are approved, licensed and maintained by IT.","s":"draft","p":1,"k":115},{"id":"p90","u":17,"q":"Where should a trainer check which software versions the organisation supports?","o":["The IT department's approved software list","A social media post","An online advert","A colleague's personal laptop"],"a":0,"e":"Organisations keep an approved (standard) software list.","s":"draft","p":1,"k":115},{"id":"sb1","u":1,"q":"What is used to translate assembly language instructions into machine language instructions?","o":["Compiler","Interpreter","Translator","Assembler"],"a":3,"e":"An assembler converts assembly mnemonics into machine code.","s":"book","k":1},{"id":"sb2","u":1,"q":"What is one of the main advantages of using a compiler over an interpreter?","o":["Compiled programs run faster","Compilers can run code immediately","Compilers support interactive programming","Compilers are easier for beginners"],"a":0,"e":"The whole program is translated in advance, so the compiled program executes faster.","s":"book","k":2},{"id":"sb3","u":1,"q":"What is the primary concept of Object Oriented Programming (OOP)?","o":["A programming style based on protocols","A programming paradigm based on the concept of objects","A method of writing procedural code","A framework for low-level programming"],"a":1,"e":"OOP is built around objects that combine data and behaviour.","s":"book","k":3},{"id":"sb4","u":1,"q":"What software is used to manage databases?","o":["Text editor","Database Management System (DBMS)","Spreadsheet software","Content Management System (CMS)"],"a":1,"e":"A DBMS creates, manages and secures databases.","s":"book"},{"id":"sb5","u":1,"q":"What is one of the key features of databases?","o":["Limited data access","Efficient data retrieval through advanced search capabilities","Simplistic formats of data storage","Non-systematic data arrangement"],"a":1,"e":"Databases organise data so it can be searched and retrieved efficiently.","s":"book"},{"id":"sb6","u":1,"q":"What does SDLC stand for?","o":["Systematic Development Life Cycle","Software Deployment Life Cycle","System Development Lifecycle Process","Software Development Life Cycle"],"a":3,"e":"SDLC = Software Development Life Cycle.","s":"book","k":5},{"id":"sb7","u":1,"q":"In which SDLC stage is the actual programming code produced?","o":["Testing the product","Defining requirements","Building or developing the product","Deployment in the market"],"a":2,"e":"Code is written in the build (implementation) stage.","s":"book","k":5},{"id":"sb8","u":1,"q":"Which of the following is NOT a feature of a Java editor?","o":["Integrated debugging features","Syntax highlighting","Graphic design tools","Content/code assist"],"a":2,"e":"Java editors/IDEs offer highlighting, code assist and debugging, not graphic design.","s":"book","k":2},{"id":"sb9","u":1,"q":"Which flowchart symbol is used for input/output of data?","o":["Parallelogram","Rectangle","Oval","Diamond"],"a":0,"e":"Parallelogram = input/output; rectangle = process; oval = start/end; diamond = decision.","s":"book","k":6},{"id":"sb10","u":1,"q":"What is the main advantage of using structured programming?","o":["It allows faster execution","It makes programs easier to test, debug and maintain","It removes the need for a runtime environment","It needs less memory"],"a":1,"e":"Clear structures make code easier to test, debug and maintain.","s":"book","k":7},{"id":"sb11","u":1,"q":"Which term is related to machine language?","o":["Mnemonics","Binary digits","English-style statements","Keywords"],"a":1,"e":"Machine language is binary (0s and 1s). Mnemonics belong to assembly language.","s":"book","k":1},{"id":"sb12","u":1,"q":"Which of these is performed in the analysis phase of the SDLC?","o":["Approve all project requests","Build a prototype","Perform a detailed analysis of the old system","Review and allocate resources to the project"],"a":2,"e":"Analysis studies the existing system and gathers requirements.","s":"book","k":5},{"id":"sb13","u":1,"q":"What does scalability in databases refer to?","o":["The speed of data retrieval","The number of users accessing the database","The complexity of data structures","The ability to increase data storage capacity"],"a":3,"e":"A scalable database can grow to hold more data and load.","s":"book"},{"id":"sb14","u":1,"q":"When incorporating a user interface into code, which is an important consideration?","o":["UI elements must be part of the program's algorithm","The UI should be intuitive and responsive to user actions","The UI should not include any interactivity","The UI must be coded manually without libraries"],"a":1,"e":"A good UI is intuitive and responds to user actions.","s":"book"},{"id":"sb15","u":1,"q":"Which construct would you most likely use to handle user inputs like button clicks in an event-driven program?","o":["Loops","Functions","Event handlers","Conditional statements"],"a":2,"e":"Event handlers respond to events such as clicks.","s":"book","k":11},{"id":"sb16","u":1,"q":"What is the role of an event handler in an event-driven program?","o":["To calculate data from user input","To define the UI layout","To wait for and respond to events like clicks or key presses","To define global variables"],"a":2,"e":"Handlers run when their event happens.","s":"book","k":11},{"id":"sb17","u":1,"q":"In third-generation languages, what does 'interpretation' refer to?","o":["Creating machine code directly from binary","Translating source code and executing it statement by statement","Compiling code for faster execution","Examining code for errors"],"a":1,"e":"An interpreter translates and runs source code one statement at a time.","s":"book","k":0},{"id":"sb18","u":1,"q":"What is the purpose of control structures in structured programming?","o":["To reduce code complexity","To improve program flow and clarity","To decrease development time","To increase runtime"],"a":1,"e":"Sequence, selection and iteration give clear program flow.","s":"book","k":7},{"id":"sb19","u":1,"q":"Which control structure allows statements to be repeated multiple times?","o":["Sequence","Selection","Control","Loop"],"a":3,"e":"Loops (iteration) repeat statements.","s":"book","k":8},{"id":"sb20","u":1,"q":"What is a graphical way to represent an algorithm?","o":["Flowchart","Pseudocode","UML","Data model"],"a":0,"e":"A flowchart draws an algorithm with symbols and arrows.","s":"book","k":6},{"id":"sb21","u":3,"q":"What is the main goal of Quality Assurance (QA)?","o":["To produce more products","To improve software speed","To ensure products meet specified requirements","To reduce marketing costs"],"a":2,"e":"QA ensures products meet specified requirements.","s":"book","k":19},{"id":"sb22","u":3,"q":"What does ISO stand for?","o":["International Standards Organization","Internal Software Operations","Institute of Safety Operations","International Organization for Standardization"],"a":3,"e":"ISO = International Organization for Standardization.","s":"book","k":19},{"id":"sb23","u":3,"q":"Which standard is most commonly used for quality management systems?","o":["ISO 9001","ISO 14000","ISO 27001","ISO 50001"],"a":0,"e":"ISO 9001 = quality management; 14000 = environment; 27001 = information security.","s":"book","k":19},{"id":"sb24","u":3,"q":"What does a QA process typically involve?","o":["Coding and testing only","Planning, assurance and improvement","Advertising and branding","Only final product evaluation"],"a":1,"e":"QA covers planning, assurance and continuous improvement.","s":"book"},{"id":"sb25","u":3,"q":"In quality assurance, what is a 'standard'?","o":["A company policy","A coding method","A documented agreement containing technical specifications","A marketing strategy"],"a":2,"e":"A standard is a documented agreement of technical specifications.","s":"book","k":19},{"id":"sb26","u":3,"q":"Which activity is part of quali are.","u":3},{"t":"Class coupling","ar":"الاقتران بين الفئات","d":"Class coupling refers to the degree of interdependence between different classes in an object-oriented system, indicating how much one class relies on another. High coupling can lead to more complex and less maintainable code, while low coupling promotes modularity and easier maintenance.","u":3},{"t":"traceability","ar":"قابلية التتبع","d":"Traceability in software refers to the ability to track and document the relationships between different artifacts (such as requirements, design, implementation, and testing) throughout the software development lifecycle, ensuring that all requirements are properly addressed and verified.","u":3},{"t":"Integration","ar":"التكامل","d":"Integration in software development is the process of combining different components or systems to work together as a unified whole.","u":3},{"t":"Performance degradation","ar":"تدهور الأداء","d":"Performance degradation refers to the decline in a system's efficiency, speed, or responsiveness over time, often due to factors like increased load, resource limitations, or software bugs.","u":3},{"t":"Multitasking","ar":"تعدد المهام","d":"Multitasking is the ability of a system or processor to execute multiple tasks or processes simultaneously or by quickly switching between them, optimizing the use of system resources.","u":3},{"t":"Multiprocessor","ar":"متعدد المعالجات","d":"A multiprocessor is a system that uses two or more processors (CPUs) to perform tasks simultaneously, enabling increased processing power and improved performance for handling complex or resource-intensive applications.","u":3},{"t":"Logging Framework","ar":"إطار التسجيل (السجلات)","d":"A system or tool used to record application events, errors, and other information to help monitor and debug the application.","u":4},{"t":"Custom Event Log","ar":"سجل أحداث مخصص","d":"A user-defined log that records specific application events, usually for debugging or monitoring purposes.","u":4},{"t":"Testing Requirements","ar":"متطلبات الاختبار","d":"The specific conditions or features that need to be tested in a software project during the development process.","u":4},{"t":"Testing Types","ar":"أنواع الاختبار","d":"The different methods of testing, such as functional, performance, security, and others, applied during various stages of development.","u":4},{"t":"Testing Tools","ar":"أدوات الاختبار","d":"Software tools used to perform testing, such as graphical user interface (GUI) testing tools, load testing tools, and others.","u":4},{"t":"Debugging Techniques","ar":"تقنيات تصحيح الأخطاء","d":"Methods used to identify, trace, and fix issues in a program’s code, such as using breakpoints, stepping through code, or using specific debugging tools.","u":4},{"t":"Breakpoints","ar":"نقاط التوقف","d":"A debugging tool that pauses the execution of a program at a specific point, allowing the developer to examine variables and control flow.","u":4},{"t":"Stepping Through Code","ar":"التنفيذ خطوة بخطوة","d":"A debugging technique where the developer runs the code line by line to observe its execution and locate errors.","u":4},{"t":"Unit Test Framework","ar":"إطار اختبار الوحدات","d":"A framework used to define and run unit tests, which are tests that check individual parts or units of the application for correctness.","u":4},{"t":"Test Progress Reports","ar":"تقارير تقدم الاختبار","d":"Documentation summarizes the progress of testing activities, including details on tests completed, results, and any issues encountered.","u":4},{"t":"Debugging Tools","ar":"أدوات تصحيح الأخطاء","d":"Software tools designed to help developers locate and fix bugs in the code, such as debuggers and profilers.","u":4},{"t":"Alpha Testing","ar":"اختبار ألفا","d":"A type of testing where a software product is tested internally by developers before it is released to a limited external audience.","u":4},{"t":"Beta Testing","ar":"اختبار بيتا","d":"A type of testing where a software product is released to a limited external audience to identify issues before the final public release","u":4},{"t":"Test Methods","ar":"طرق الاختبار","d":"Various approaches to testing software, such as Static and Dynamic testing, White-box testing, and Black-box testing.","u":4},{"t":"Static Testing","ar":"الاختبار الساكن (الثابت)","d":"A method of testing where the code is reviewed for errors without executing it, typically done through manual or automated code reviews.","u":4},{"t":"Dynamic Testing","ar":"الاختبار الديناميكي","d":"A testing method that involves executing the program and checking its behavior under different conditions.","u":4},{"t":"White-box Testing","ar":"اختبار الصندوق الأبيض","d":"A type of testing where the internal logic and structure of the application are tested, typically by developers or testers with knowledge of the code.","u":4},{"t":"Black-box Testing","ar":"اختبار الصندوق الأسود","d":"A testing approach where the functionality of the software is tested without knowledge of the internal code or logic, focusing only on inputs and outputs.","u":4},{"t":"Testing GUI","ar":"اختبار واجهة المستخدم الرسومية","d":"Testing the graphical user interface of an application to ensure that all visual elements and interactions function as expected.","u":4},{"t":"Load Testing","ar":"اختبار الحمل","d":"Testing the performance of an application under expected and heavy user loads to identify potential bottlenecks or failures.","u":4},{"t":"Performance Testing","ar":"اختبار الأداء","d":"A type of testing focused on ensuring that the application performs well under normal and extreme conditions, including speed and scalability.","u":4},{"t":"Static Analysis","ar":"التحليل الساكن","d":"A method of reviewing the source code without executing the program, typically to identify potential bugs, vulnerabilities, or areas for improvement.","u":4},{"t":"Test Coverage","ar":"تغطية الاختبار","d":"A measure of how much of the application’s code is tested dur
