{"id":"b14-44","u":14,"q":"What is the goal of reviewing a security policy?","o":["Remove rules","Update and improve security","Reduce users","Delete files"],"a":1,"e":"Reviews keep the policy current and stronger.","s":"bank"},{"id":"b14-45","u":14,"q":"Why update antivirus regularly?","o":["Reduce speed","Detect new threats","Delete files","Improve graphics"],"a":1,"e":"New threats appear daily; updates add their signatures.","s":"bank","k":96},{"id":"b14-46","u":14,"q":"What is the risk of weak desktop security?","o":["Better speed","Data loss","More storage","Better design"],"a":1,"e":"Weak desktop security risks data loss.","s":"bank"},{"id":"b14-47","u":14,"q":"What is the most effective way to secure both desktop and server systems?","o":["Disable all security","Use layered security (firewall + antivirus + policies)","Use only antivirus","Use only passwords"],"a":1,"e":"Layered security (defence in depth) combines several controls.","s":"bank","k":92},{"id":"b14-48","u":14,"q":"What is the best way to reduce insider threats?","o":["Give full access","Monitor and restrict permissions","Remove all users","Disable accounts"],"a":1,"e":"Least privilege plus monitoring limits insider threats.","s":"bank"},{"id":"b14-49","u":14,"q":"What is the role of encryption in security?","o":["Increase speed","Protect data confidentiality","Reduce storage","Improve UI"],"a":1,"e":"Encryption keeps data confidential.","s":"bank"},{"id":"b14-50","u":14,"q":"What is an example of a secure protocol?","o":["HTTP","FTP","HTTPS","Telnet"],"a":2,"e":"HTTPS encrypts web traffic; HTTP, FTP and Telnet send plain text.","s":"bank","k":94},{"id":"b15-1","u":15,"q":"Which statement best distinguishes the logical data model from the physical data model?","o":["Logical model defines the actual table storage and indexes.","Logical model focuses on DBMS-specific data types.","Logical model defines data structures and relationships without DBMS-specific details.","Logical model includes backup and recovery mechanisms."],"a":2,"e":"Logical = entities, attributes, relationships with no DBMS-specific detail. Physical = actual tables, data types, indexes, storage.","s":"bank","k":102},{"id":"b15-2","u":15,"q":"In a hierarchical database model, which of the following is not true?","o":["Each child has only one parent.","Many-to-many relationships are easily supported","Data is organized in a tree-like structure.","Pointers are used to define relationships."],"a":1,"e":"Hierarchical (tree) models give each child one parent, so many-to-many is NOT easily supported.","s":"bank","k":103},{"id":"b15-3","u":15,"q":"Which SQL command combination would permanently delete all rows from a table and reset auto-increment values?","o":["DELETE FROM table;","DROP TABLE table;","TRUNCATE TABLE table;","ALTER TABLE table;"],"a":2,"e":"TRUNCATE removes all rows quickly and resets auto-increment; DELETE does not reset it; DROP removes the table itself.","s":"bank","k":106},{"id":"b15-4","u":15,"q":"Which of the following components ensures ACID compliance within a DBMS?","o":["Query Processor","Transaction Manager","Storage Manager","Authorization Manager"],"a":1,"e":"The transaction manager enforces Atomicity, Consistency, Isolation, Durability.","s":"bank","k":102},{"id":"b15-5","u":15,"q":"Which scenario would most likely benefit from using a NoSQL database rather than a relational DBMS?","o":["Dynamic web application storing unstructured user activity logs","Banking system with complex joins","Fixed-schema student management system","Inventory system using foreign keys"],"a":0,"e":"NoSQL suits unstructured, fast-changing data like activity logs.","s":"bank","k":106},{"id":"b15-6","u":15,"q":"What is the main disadvantage of a flat-file database?","o":["Requires a DBMS installation","Supports complex queries","Causes redundancy and inconsistency","Uses relational joins"],"a":2,"e":"Flat files repeat data, which leads to redundancy and inconsistency.","s":"bank","k":103},{"id":"b15-7","u":15,"q":"In SQL, which clause is evaluated first in a SELECT query execution order?","o":["WHERE","SELECT","ORDER BY","FROM"],"a":3,"e":"Logical order: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY.","s":"bank","k":106},{"id":"b15-8","u":15,"q":"Which statement about database security is most accurate?","o":["Encryption replaces the need for authentication.","Role-Based Access Control assigns permissions to data, not users.","Auditing tracks and records user activities in the database.","Triggers prevent unauthorized logins automatically."],"a":2,"e":"Auditing records who did what in the database.","s":"bank","k":105},{"id":"b15-9","u":15,"q":"Which of the following best explains the purpose of a schema in a database?","o":["It defines user access roles and privileges.","It specifies how data is stored physically on the disk.","It is the logical blueprint describing tables, columns, and relationships.","It stores the actual data and records used by applications."],"a":2,"e":"A schema is the logical blueprint: tables, columns, relationships.","s":"bank","k":105},{"id":"b15-10","u":15,"q":"Which of the following best describes a Primary Key in a relational database?","o":["A field that allows duplicate values but not NULLs.","A unique identifier for each record in a table that cannot be NULL.","A field that is automatically indexed but can contain NULL values.","A key that defines relationships between multiple tables."],"a":1,"e":"A primary key is unique and never NULL.","s":"bank","k":103},{"id":"b15-11","u":15,"q":"What happens if you try to insert a duplicate Primary Key value into a table?","o":["The DBMS automatically overwrites the previous record.","The new record is inserted, but the old one is marked inactive.","The DBMS rejects the insertion and throws a constraint violation error.","The duplicate value is allowed if auto-increment is used."],"a":2,"e":"The DBMS rejects the duplicate with a constraint-violation error.","s":"bank","k":102},{"id":"b15-12","u":15,"q":"Which of the following statements about Primary Key vs. Foreign Key is true?","o":["A Foreign Key uniquely identifies each record in its own table.","A Primary Key can contain NULL values; a Foreign Key cannot.","A Foreign Key links to a Primary Key in another table to maintain referential integrity.","Both keys are used only for indexing, not relationships."],"a":2,"e":"A foreign key references a primary key in another table, enforcing referential integrity.","s":"bank","k":106},{"id":"b15-13","u":15,"q":"A college library database allows students to search for and borrow books through a web interface. A student tries to borrow a 6th book but receives an error message.\nWhich UI feature is most responsible for preventing this action?","o":["Data visualization panel","Role-based access control","Data validation constraint","Query optimization function"],"a":2,"e":"A validation rule (max 5 books) blocks the 6th loan.","s":"bank","k":105},{"id":"b15-14","u":15,"q":"A developer modifies the “Students” table in the college database by adding a new column for “Email.”\nWhich DBMS component processes this structural change?","o":["Query Processor","Authorization Manager","Transaction Manager","Storage Manager"],"a":0,"e":"The query processor parses and executes the ALTER TABLE (DDL) command.","s":"bank","k":102},{"id":"b15-15","u":15,"q":"A company keeps employee details in a .csv file that can be opened in Excel, but relationships between employees and departments cannot be linked.\nWhich type of database structure is being used?","o":["Relational","Flat-file","Hierarchical","Network"],"a":1,"e":"A single CSV with no links between data is a flat file.","s":"bank","k":103},{"id":"b15-16","u":15,"q":"A hospital database stores patient records under departments, and each patient can be linked to multiple doctors across departments.\nWhich database structure best fits this requirement?","o":["Hierarchical","Relational","Network","Flat-file"],"a":2,"e":"Patients linked to many doctors = many-to-many, the network model.","s":"bank","f":"In practice a relational model also fits; the question targets the network model.","k":103},{"id":"b15-17","u":15,"q":"During planning, a team draws a diagram showing “Students,” “Courses,” and “Enrollments” with relationships but no data types or keys yet.\n\nWhich data model level are they working on?","o":["Physical Data Model","Logical Data Model","Conceptual Data Model","Relational Schema Model"],"a":2,"e":"Entities and relationships only, no keys or types = conceptual model.","s":"bank","k":103},{"id":"b15-18","u":15,"q":"A database administrator ensures that even after a system crash, all completed transactions remain saved.\n\nWhich DBMS feature ensures this property?","o":["Concurrency Control","Normalization","Durability (ACID)","Data Independence"],"a":2,"e":"Durability keeps committed transactions after a crash.","s":"bank","k":102},{"id":"b15-19","u":15,"q":"An HR manager accidentally deletes employee records and wants to undo the last transaction.\nWhich SQL command should be used?","o":["ROLLBACK","COMMIT","TRUNCATE","ALTER"],"a":0,"e":"ROLLBACK undoes uncommitted changes.","s":"bank","k":106},{"id":"b15-20","u":15,"q":"A librarian wants to find all books written by authors whose names start with \"A\".\nWhich SQL operator is appropriate for this query?","o":["BETWEEN","IN","LIKE","DISTINCT"],"a":2,"e":"LIKE 'A%' matches names starting with A.","s":"bank","k":106},{"id":"b15-21","u":15,"q":"After adding a new member to the system, the librarian updates their email address.\nWhich SQL command is used for this action?","o":["INSERT","UPDATE","ALTER","GRANT"],"a":1,"e":"UPDATE changes existing rows.","s":"bank","k":105},{"id":"b15-22","u":15,"q":"A database admin wants teachers to view student grades but not modify them.\n\nWhich DBMS feature should be used to enforce this restriction?","o":["Stored Procedure","View","Role-Based Access Control (RBAC)","Encryption"],"a":2,"e":"RBAC gives teachers a read-only role.","s":"bank","k":102},{"id":"b15-23","u":15,"q":"A college library app allows students to borrow and return books through forms and buttons without typing SQL. Which part of the database system is this?","o":["Database engine","Query processor","User interface (UI)","Backup system"],"a":2,"e":"Forms and buttons are the user interface.","s":"bank","k":102},{"id":"b15-24","u":15,"q":"An IT department uses MySQL Workbench to create, edit, and manage tables. What component are they using?","o":["DBMS","Data dictionary","Log analyzer","User interface"],"a":0,"e":"MySQL Workbench is the management tool used to work with the MySQL DBMS.","s":"bank","f":"Ambiguous: Workbench is technically a user interface to the DBMS (option D).","k":102},{"id":"b15-25","u":15,"q":"A database designer creates diagrams showing entities like STUDENT and CLASS with their relationships. What tool is this?","o":["UML diagram","Storyboard","Data dictionary","Flowchart"],"a":0,"e":"UML/ER-style diagrams model entities and relationships.","s":"bank","k":104},{"id":"b15-26","u":15,"q":"A company stores customer data in one CSV file without relationships between records. Which structure is used?","o":["Hierarchical","Relational","Network","Flat-file"],"a":3,"e":"One CSV, no relationships = flat file.","s":"bank","k":103},{"id":"b15-27","u":15,"q":"An airline stores routes where each city connects to many other cities using links. Which structure suits best?","o":["Flat-file","Hierarchical","Network","Relational"],"a":2,"e":"Cities linked to many cities = many-to-many = network model.","s":"bank","k":103},{"id":"b15-28","u":15,"q":"A government system arranges records where each employee has exactly one manager. Which model describes it?","o":["Object-oriented","Relational","Network","Hierarchical"],"a":3,"e":"Exactly one manager (one parent) = hierarchical.","s":"bank","k":103},{"id":"b15-29","u":15,"q":"A university system connects teachers, classes, and students using primary and foreign keys. Which structure is used?","o":["Relational","Hierarchical","Tree","Flat-file"],"a":0,"e":"Primary and foreign keys linking tables = relational.","s":"bank","k":103},{"id":"b15-30","u":15,"q":"A DBA ensures only registered users can access the system and maintains backups. Which database function is this?","o":["Data querying","Security and recovery","Data redundancy","Normalization"],"a":1,"e":"Controlling access and keeping backups = security and recovery.","s":"bank","k":105},{"id":"b15-31","u":15,"q":"A bank stores customer data in documents and JSON format to allow flexible schema changes. Which DBMS type fits best?","o":["Hierarchical","Flat-file","NoSQL","Relational"],"a":2,"e":"JSON documents with flexible schema = NoSQL (document store).","s":"bank","k":103},{"id":"b15-32","u":15,"q":"A student executes `CREATE TABLE Students (...)`. What SQL category does this belong to?","o":["TCL","DQL","DML","DDL"],"a":3,"e":"CREATE is Data Definition Language (DDL).","s":"bank","k":106},{"id":"b15-33","u":15,"q":"A librarian retrieves a list of borrowed books using `SELECT * FROM BorrowedBooks;`. What SQL type is used?","o":["DDL","DQL","DCL","DML"],"a":1,"e":"SELECT is Data Query Language (DQL).","s":"bank","k":106},{"id":"b15-34","u":15,"q":"A user mistakenly deletes data and uses `ROLLBACK;` to undo the changes. What SQL feature is applied?","o":["Transaction control","Indexing","Data integrity","Normalization"],"a":0,"e":"ROLLBACK is Transaction Control Language.","s":"bank","k":106},{"id":"b15-35","u":15,"q":"An organization assigns roles like Admin, Editor, and Viewer with specific permissions. What security method is applied?","o":["Normalization","Backup","Encryption","Role-Based Access Control"],"a":3,"e":"Roles with set permissions = RBAC.","s":"bank","k":105},{"id":"b15-36","u":15,"q":"A developer grants read-only access using `GRANT SELECT ON table_name TO user;`. What SQL command type is used?","o":["DCL","DML","DDL","DQL"],"a":0,"e":"GRANT/REVOKE are Data Control Language (DCL).","s":"bank","k":106},{"id":"b15-37","u":15,"q":"A company ensures all user input is validated before database submission to prevent SQL injection. What practice is this?","o":["Input sanitization","Rollback handling","Query optimization","Backup management"],"a":0,"e":"Validating/sanitising input prevents SQL injection.","s":"bank","k":105},{"id":"b15-38","u":15,"q":"What is the primary purpose of a database?","o":["Encrypt messages","Store and organize data","Create user interfaces","Write software code"],"a":1,"e":"Databases store and organise data.","s":"bank","k":102},{"id":"b15-39","u":15,"q":"Which component manages the operations of a database system?","o":["Compiler","Operating System","DBMS","Protocol Manager"],"a":2,"e":"The DBMS manages the database's operations.","s":"bank","k":102},{"id":"b15-40","u":15,"q":"What does a table in a relational database represent?","o":["A single value","A field","An entity","A process"],"a":2,"e":"A table represents one entity (e.g. Student).","s":"bank","k":103},{"id":"b15-41","u":15,"q":"In a table, columns are also referred to as:","o":["Rows","Fields","Records","Pages"],"a":1,"e":"Columns = fields; rows = records.","s":"bank"},{"id":"b15-42","u":15,"q":"Which type of database organizes data in a tree structure?","o":["Flat-file","Relational","Hierarchical","Object-oriented"],"a":2,"e":"Hierarchical = tree structure.","s":"bank","k":103},{"id":"b15-43","u":15,"q":"Flat-file databases are most suitable for:","o":["Managing multimedia","Small, simple datasets","Web development","Cloud storage"],"a":1,"e":"Flat files suit small, simple datasets.","s":"bank","k":103},{"id":"b15-44","u":15,"q":"What is a primary key used for?","o":["Encrypting data","Linking two databases","Uniquely identifying records","Sorting values alphabetically"],"a":2,"e":"A primary key uniquely identifies each record.","s":"bank","k":106},{"id":"b15-45","u":15,"q":"Which key is used to establish relationships between tables?","o":["Foreign key","Composite key","Static key","Magic key"],"a":0,"e":"Foreign keys link tables.","s":"bank","k":106},{"id":"b15-46","u":15,"q":"What is the function of UML in database design?","o":["Encrypting schemas","Visualizing data relationships","Writing queries","Formatting tables"],"a":1,"e":"UML diagrams visualise data and relationships for design.","s":"bank","k":104},{"id":"b15-47","u":15,"q":"What does an ERD represent?","o":["A web page","A SQL script","Entity relationships","Data backups"],"a":2,"e":"An ERD shows entities and their relationships.","s":"bank","k":104},{"id":"b15-48","u":15,"q":"What is the primary purpose of a database user interface?","o":["To define the logical structure of data","To allow users to interact with the database easily","To manage database security settings","To perform data backup operations"],"a":1,"e":"A UI lets users work with the database easily.","s":"bank","k":102},{"id":"b15-49","u":15,"q":"Which of the following best describes a Database Management System (DBMS)?","o":["A collection of unorganized data files","A software tool that stores, retrieves, and manages data","A graphical tool for creating animations","A software for managing operating systems"],"a":1,"e":"A DBMS is software that stores, retrieves and manages data.","s":"bank","k":102},{"id":"b15-50","u":15,"q":"In a database, “information” refers to:","o":["Raw facts and figures","Data that has been processed into a meaningful form","A list of file names","Unrelated pieces of data"],"a":1,"e":"Information = processed data with meaning; raw facts are data.","s":"bank","k":102},{"id":"b15-51","u":15,"q":"Which statement best describes a flat-file database?","o":["It stores data in multiple linked tables","It stores all data in a single table or file","It organizes data in a tree-like structure","It stores objects as records"],"a":1,"e":"Flat file = one table/file.","s":"bank","k":103},{"id":"b15-52","u":15,"q":"What is the structure used by a hierarchical database model?","o":["A flat list","A tree structure with parent-child relationships","A network of interconnected nodes","A table with keys and attributes"],"a":1,"e":"Hierarchical = tree of parent-child records.","s":"bank","k":103},{"id":"b15-53","u":15,"q":"In a relational database, data is organized into:","o":["Arrays","Tables consisting of rows and columns","Linked lists","Hierarchical nodes"],"a":1,"e":"Relational = tables of rows and columns.","s":"bank","k":103},{"id":"b15-54","u":15,"q":"An object-oriented database stores data as:","o":["Tables","Files","Objects that include both data and methods","Flat records"],"a":2,"e":"OO databases store objects: data plus methods.","s":"bank","k":103},{"id":"b15-55","u":15,"q":"What is a key feature of a network database model?","o":["Each child can have only one parent","Records are linked through pointers allowing many-to-many relationships","It uses SQL to manage data","Data is stored in one flat file"],"a":1,"e":"Network models use pointers and allow many-to-many.","s":"bank","k":103},{"id":"b15-56","u":15,"q":"Which SQL command is used to retrieve data from a database?","o":["INSERT","DELETE","SELECT","UPDATE"],"a":2,"e":"SELECT retrieves data.","s":"bank","k":106},{"id":"b15-57","u":15,"q":"Which of the following best improves usability in a database user interface?","o":["Using technical table names only","Providing consistent layouts and data validation controls","Removing all form labels to simplify appearance","Allowing direct access to raw tables"],"a":1,"e":"Consistent layouts and validation controls improve usability.","s":"bank","k":102},{"id":"b15-58","u":15,"q":"Which component of a DBMS ensures that multiple users can access the database simultaneously without conflict?","o":["Data Definition Language","Concurrency control","Schema mapping","Data redundancy"],"a":1,"e":"Concurrency control lets many users work without conflicts.","s":"bank","k":102},{"id":"b15-59","u":15,"q":"In a database, which process ensures that stored information is accurate, complete, and consistent?","o":["Data migration","Data normalization","Data validation","Data encryption"],"a":2,"e":"Validation checks data is accurate, complete and consistent.","s":"bank","k":102},{"id":"b15-60","u":15,"q":"What is a major disadvantage of using a flat-file database?","o":["It is too complex to design","It supports only object storage","It causes data redundancy and inconsistency","It supports multi-table relationships"],"a":2,"e":"Flat files cause redundancy and inconsistency.","s":"bank","k":103},{"id":"b15-61","u":15,"q":"In a hierarchical database, how can a child record be accessed?","o":["Only through its parent record","Independently of any parent","Through SQL queries","Through relational joins"],"a":0,"e":"In a tree you reach a child only through its parent.","s":"bank","k":103},{"id":"b15-62","u":15,"q":"In object-oriented databases, inheritance allows:","o":["Tables to be linked through foreign keys","Objects to acquire properties and methods from other objects","Data to be stored in hierarchical form","The database to remove redundant indexes"],"a":1,"e":"Inheritance lets objects reuse properties and methods of others.","s":"bank","k":103},{"id":"b16-1","u":16,"q":"Which layer in a multi-layer application contains the rules and calculations that define how data can be created, stored, and changed?","o":["User Interface Layer","Business Logic Layer","Data-Access Layer","Database Layer"],"a":1,"e":"The business logic layer holds the rules and calculations.","s":"bank","k":107},{"id":"b16-2","u":16,"q":"What is the main function of the Data-Access Layer in a multi-layer application?","o":["Displaying data to the user","Managing user input","Interacting with the database to retrieve and store data","Applying business rules"],"a":2,"e":"The data-access layer reads from and writes to the database.","s":"bank","k":107},{"id":"b16-3","u":16,"q":"In a three-tier architecture, which layer is responsible for presenting information and collecting user input?","o":["Business Logic Layer","Data-Access Layer","User Interface Layer","Network Layer"],"a":2,"e":"The UI (presentation) layer shows information and collects input.","s":"bank","k":107},{"id":"b16-4","u":16,"q":"A company updates its discount calculation rules in the system. Which layer should the developer modify?","o":["User Interface Layer","Data-Access Layer","Business Logic Layer","Database Layer"],"a":2,"e":"Discount rules are business rules, so the business logic layer changes.","s":"bank","k":107},{"id":"b16-5","u":16,"q":"If two users enter the same product code but get different price results due to location-based tax rules, which layer ensures this rule is applied correctly?","o":["User Interface Layer","Business Logic Layer","Database Layer","Network Layer"],"a":1,"e":"Location-based tax rules live in the business logic layer.","s":"bank","k":107},{"id":"b16-6","u":16,"q":"A developer wants to reduce direct SQL queries in the application code. Which layer should handle the database read and write operations?","o":["User Interface Layer","Business Logic Layer","Data-Access Layer","Application Layer"],"a":2,"e":"SQL reads/writes belong in the data-access layer.","s":"bank","k":107},{"id":"b16-7","u":16,"q":"If the database structure changes (e.g., column renamed), which layer’s code is most likely to require modification?","o":["Business Logic Layer","Data-Access Layer","User Interface Layer","Web Server Layer"],"a":1,"e":"A renamed column affects the code that queries the database: the data-access layer.","s":"bank","k":107},{"id":"b16-8","u":16,"q":"A new dashboard screen is added to display student attendance. Which layer of the multi-layer application is primarily affected?","o":["Business Logic Layer","Data-Access Layer","User Interface Layer","Server Layer"],"a":2,"e":"A new screen is a presentation change, so the user interface layer is affected.","s":"bank","c":1,"k":107},{"id":"b16-9","u":16,"q":"Which of the following best describes a database?","o":["A software used to create web pages","A structured collection of related data stored electronically","A document that lists all business transactions","A file used to design application interfaces"],"a":1,"e":"A database is a structured, electronically stored collection of related data.","s":"bank","k":108},{"id":"b16-10","u":16,"q":"A school management system stores student details, courses, and attendance records. Which database concept ensures relationships among these entities?","o":["File structure","Relational model","Object hierarchy","Flat-file storage"],"a":1,"e":"The relational model links entities through keys.","s":"bank","k":108},{"id":"b16-11","u":16,"q":"What makes an XML database different from a traditional relational database?","o":["It stores data in tables and rows only","It stores data as hierarchical elements and attributes in XML format","It uses only SQL for querying data","It cannot be used for web applications"],"a":1,"e":"XML databases store hierarchical elements and attributes.","s":"bank","k":108},{"id":"b16-12","u":16,"q":"You are exporting student records in XML format for web use. Which feature of XML databases ensures that data can be easily shared between different systems?","o":["Binary format","Platform independence","SQL-only compatibility","Visual table design"],"a":1,"e":"XML is plain text and platform-independent, so any system can read it.","s":"bank","k":108},{"id":"b16-13","u":16,"q":"An XML database is ideal for:","o":["Data with fixed columns and numeric values only","Storing large images and videos","Storing hierarchical or nested data such as organization structures","Managing only transaction logs"],"a":2,"e":"XML's tree structure suits nested data such as org charts.","s":"bank","c":1,"k":108},{"id":"b16-14","u":16,"q":"What is the main purpose of ODBC in application development?","o":["To define the visual layout of a web page","To provide a standard interface for connecting applications to different database systems","To design XML schema files","To encrypt database passwords"],"a":1,"e":"ODBC is a standard interface for connecting apps to many DBMSs.","s":"bank","k":108},{"id":"b16-15","u":16,"q":"A developer connects a Java application to both MySQL and SQL Server without rewriting database logic. This is possible because of:","o":["XML Schema","JDBC","ODBC","SQL Syntax"],"a":1,"e":"Java applications use JDBC (Java Database Connectivity) to switch between databases through drivers.","s":"bank","c":1,"k":109},{"id":"b16-16","u":16,"q":"Which scenario best demonstrates the advantage of ODBC?","o":["The application works only with one type of database.","The same application connects to multiple database systems through a common driver","The database connection is limited to local networks only.","The application bypasses the database and stores data in memory."],"a":1,"e":"ODBC: one app, many databases, through a common driver.","s":"bank","k":109},{"id":"b16-17","u":16,"q":"In a multi-layer application, which layer handles business rules, validations, and decision-making processes?","o":["User Interface Layer","Data Access Layer","Business Logic Layer","Presentation Layer"],"a":2,"e":"Business rules, validation and decisions = business logic layer.","s":"bank","k":107},{"id":"b16-18","u":16,"q":"You are developing an online bookstore app. Which layer would include forms and buttons for customer interaction?","o":["Data Access Layer","Business Logic Layer","User Interface Layer","Middleware Layer"],"a":2,"e":"Forms and buttons are in the UI layer.","s":"bank","k":107},{"id":"b16-19","u":16,"q":"An XML Database is most useful when:","o":["Data is highly structured and tabular","You need to store hierarchical, flexible, or document-based data","You only need numerical data","You need a flat file format"],"a":1,"e":"XML databases suit hierarchical, flexible, document-style data.","s":"bank","k":108},{"id":"b16-20","u":16,"q":"Which query language is commonly used to retrieve data from XML databases?","o":["SQL","XQuery","C#","HTML"],"a":1,"e":"XQuery queries XML databases.","s":"bank","k":108},{"id":"b16-21","u":16,"q":"Identify the child element in the XML snippet: \u003cstudent>\u003cname>Ali\u003c/name>\u003cid>1001\u003c/id>\u003c/student>","o":["\u003cstudent>","\u003cname> and \u003cid>","\u003cid> only","The entire document"],"a":1,"e":"\u003cname> and \u003cid> are children of \u003cstudent>.","s":"bank","k":110},{"id":"b16-22","u":16,"q":"Which rule below is required for well-formed XML syntax?","o":["All tags must be uppercase","Tags must have matching open and close","Attributes don’t need quotes","Multiple root elements are allowed"],"a":1,"e":"Every opening tag needs a matching closing tag.","s":"bank","k":111},{"id":"b16-23","u":16,"q":"Which XML validation method supports data types and namespaces?","o":["DTD","JSON","XSD (XML Schema)","TXT"],"a":2,"e":"XSD supports data types and namespaces; DTD does not.","s":"bank","k":112},{"id":"b16-24","u":16,"q":"In XSLT, which tag is used to loop through XML elements during transformation?","o":["\u003cxsl:value-of>","\u003cxsl:for-each>","\u003cxsl:apply-templates>","\u003cxsl:select>"],"a":1,"e":"\u003cxsl:for-each> loops over selected nodes.","s":"bank","k":113},{"id":"b16-25","u":16,"q":"A company uses an XML-based product catalog and wants to display it on their website. Which technology should they use to transform XML data into an HTML page?","o":["XSD Schema","ODBC","XSLT","PHP"],"a":2,"e":"XSLT transforms XML into HTML.","s":"bank","k":113},{"id":"b16-26","u":16,"q":"You are building an XSLT stylesheet that converts XML data into an HTML table. What is the first step?","o":["Write the SQL schema","Create an XML document and link it with an XSLT file","Run the CSS in the XML","Save it as a PDF file"],"a":1,"e":"Create the XML document and link it to the XSLT stylesheet.","s":"bank","k":113},{"id":"b16-27","u":16,"q":"A trainee is developing a hospital management app. The system must check that a patient cannot be registered twice using the same ID. Which layer should enforce this rule?","o":["User Interface Layer","Data-Access Layer","Business Logic Layer","Network Layer"],"a":2,"e":"Checking for duplicate patient IDs is a business rule.","s":"bank","k":107},{"id":"b16-28","u":16,"q":"What is a key advantage of using multi-layer architecture in application design?","o":["It merges logic and data access into one layer.","It reduces modularity.","It separates concerns for easier maintenance.","It hides user input from the database."],"a":2,"e":"Layers separate concerns, making maintenance easier.","s":"bank","k":107},{"id":"b16-29","u":16,"q":"In a multi-layer system, which layer communicates directly with the database to perform CRUD operations?","o":["User Interface Layer","Business Logic Layer","Data-Access Layer","Presentation Layer"],"a":2,"e":"The data-access layer runs CRUD against the database.","s":"bank","k":107},{"id":"b16-30","u":16,"q":"A company needs to store nested data such as \u003cdepartment>\u003cemployee>\u003cname>Ali\u003c/name>\u003c/employee>\u003c/department>. Which data format is most suitable?","o":["CSV","XML","JSON only","Flat-file"],"a":1,"e":"XML represents nested data naturally.","s":"bank"},{"id":"b16-31","u":16,"q":"Which XSLT tag is used to extract values from XML elements?","o":["\u003cxsl:for-each>","\u003cxsl:value-of>","\u003cxsl:apply-templates>","\u003cxsl:output>"],"a":1,"e":"\u003cxsl:value-of> outputs the value of a selected node.","s":"bank","k":113},{"id":"b16-32","u":16,"q":"The college needs a portable format to store teacher and student data and later display it on the web. Which is most suitable?","o":["JSON","XML","HTML","CSV"],"a":1,"e":"XML is portable and can be transformed for the web.","s":"bank"},{"id":"b16-33","u":16,"q":"You’re drafting the data file for the site. Which element must appear only once in each XML file?","o":["Child element","Root element","Attribute","Processing instruction"],"a":1,"e":"An XML document has exactly one root element.","s":"bank","k":110},{"id":"b16-34","u":16,"q":"During testing, an XML file fails to load because a closing tag is missing. What is the issue?","o":["The XML is not well-formed","The XML is invalid but well-formed","The schema is incorrect","The namespace is missing"],"a":0,"e":"A missing closing tag means the XML is not well-formed.","s":"bank","k":111},{"id":"b16-35","u":16,"q":"Management wants to enforce a strict structure for \u003cTeacher> and \u003cStudent> entries before publishing. What should you use?","o":["CSS file","XML Schema (XSD) or DTD","MySQL trigger","JavaScript validator"],"a":1,"e":"An XSD or DTD enforces structure.","s":"bank","k":112},{"id":"b16-36","u":16,"q":"You add this line to College.xml: \u003c?xml-stylesheet type=\"text/xsl\" href=\"style.xsl\"?>. What is the purpose?","o":["Minify the XML","Apply an XSLT transformation","Validate with XSD","Declare the XML version"],"a":1,"e":"This processing instruction links an XSLT stylesheet to the XML.","s":"bank","k":113},{"id":"b16-37","u":16,"q":"To render XML teacher data as an HTML table on the Information page, which file do you create?","o":["XSLT file","JSON file","CSV file","PHP include only"],"a":0,"e":"An XSLT file turns XML into an HTML table.","s":"bank","k":113},{"id":"b16-38","u":16,"q":"Your XML has \u003cTeachers> containing many \u003cTeacher> entries. What is \u003cTeachers>?","o":["An attribute","A parent element","A rootless node","A namespace"],"a":1,"e":"\u003cTeachers> contains \u003cTeacher> elements, so it is their parent.","s":"bank","k":110},{"id":"b16-39","u":16,"q":"The Information page must fetch teacher rows from the database and present them in HTML. Which connector helps apps talk to DBs regardless of vendor?","o":["XSLT","ODBC","CSS","XPath"],"a":1,"e":"ODBC connects apps to databases regardless of vendor.","s":"bank","k":108},{"id":"b16-40","u":16,"q":"On dropdown change (Teacher/Student), you load the matching XML fragment and display it. Which technique handles selection and DOM update?","o":["CSS only","JavaScript + XML DOM","W3C HTML validator","SQL VIEW"],"a":1,"e":"JavaScript reads the XML DOM and updates the page.","s":"bank","k":112},{"id":"b16-41","u":16,"q":"The validator reports 'type mismatch: student_id should be integer'. What does this indicate?","o":["Parsing warning only","Schema validation error","CSS cascade issue","Successful validation"],"a":1,"e":"A data-type mismatch is a schema validation error.","s":"bank","k":112},{"id":"b16-42","u":16,"q":"Which XSLT element declares you want HTML output in the transformation?","o":["\u003cxsl:template>","\u003cxsl:for-each>","\u003cxsl:output method=\"html\"/>","\u003cxsl:value-of>"],"a":2,"e":"\u003cxsl:output method=\"html\"/> declares HTML output.","s":"bank","k":113},{"id":"b16-43","u":16,"q":"A teammate mixes \u003cStudent> and \u003cstudent> tags in the same file. What is the result?","o":["XML merges them automatically","Still valid because names are similar","Not well-formed due to case sensitivity","Becomes JSON"],"a":2,"e":"XML is case-sensitive; mismatched case between opening and closing tags makes the file not well-formed.","s":"bank","f":"Strictly, two differently-cased elements are allowed; it only breaks when an open/close pair mismatches.","k":111},{"id":"b16-44","u":16,"q":"You need to iterate through all \u003cTeacher> nodes to print names in XSLT. Which construct is correct?","o":["\u003cxsl:if>","\u003cxsl:choose>","\u003cxsl:for-each select=\"Teacher\">","\u003cxsl:when>"],"a":2,"e":"\u003cxsl:for-each select=\"Teacher\"> loops through each Teacher.","s":"bank","k":113},{"id":"b16-45","u":16,"q":"The web form should not only read data but also add and edit rows in the DB. Which operation set is required?","o":["SELECT only","DELETE only","CRUD operations","No DB writes allowed"],"a":2,"e":"Read, add and edit = CRUD (Create, Read, Update, Delete).","s":"bank"},{"id":"b16-46","u":16,"q":"You run an XML validator to ensure the document follows the schema rules. What process is this?","o":["Parsing","Styling","Validation","Compilation"],"a":2,"e":"Checking against schema rules is validation.","s":"bank","k":112},{"id":"b16-47","u":16,"q":"To consume XML data in a JavaScript widget on the Home page, you first convert it to a JS-friendly representation. Which format?","o":["CSV","JSON","TXT","XSD"],"a":1,"e":"JSON is native to JavaScript.","s":"bank","k":112},{"id":"b16-48","u":16,"q":"In \u003cTeacher email=\"t.salem@college.edu\">, what is 'email'?","o":["Element","Attribute","Namespace","Text node only"],"a":1,"e":"email=\"...\" inside the tag is an attribute.","s":"bank"},{"id":"b16-49","u":16,"q":"You want to present the same XML data as a list on mobile and a table on desktop without changing the XML. Which tech enables this?","o":["XSD","XSLT","DTD","SQL"],"a":1,"e":"Different XSLT stylesheets can present the same XML in different ways.","s":"bank","k":112},{"id":"b16-50","u":16,"q":"The browser fails to transform XML because there is no \u003cxsl:template match=\"/\"> in the XSLT. Why does this break?","o":["It prevents validation","The transform has no starting template","XSD overrides XSL","It disables CSS rendering"],"a":1,"e":"Without a root-matching template, the transform has nowhere to start.","s":"bank","k":112},{"id":"b16-51","u":16,"q":"Your app needs to connect to the college DB, run a SELECT, and display results in an HTML table. What must be configured first?","o":["Connection string via ODBC/driver","CSS variables","An external JSON schema","A DTD DOCTYPE"],"a":0,"e":"Configure the connection string/driver (e.g. ODBC) before querying.","s":"bank","k":109},{"id":"b16-52","u":16,"q":"You are developing a banking application. When a user transfers money, the system must check if they have sufficient funds before deducting the amount and updating both account balances. In a multi-layer architecture, where should the \"sufficient funds\" check be implemented?","o":["User Interface (UI) Layer","Data-Access Layer","Business Logic Layer","Database Layer"],"a":2,"e":"'Sufficient funds' is a business rule for the business logic layer.","s":"bank","k":107},{"id":"b16-53","u":16,"q":"In a multi-layer application for a hospital, patient records are fetched from a central database and displayed on a screen. Which layer is responsible for executing the SQL SELECT query to retrieve this data?","o":["Presentation Layer","Business Logic Layer","Data-Access Layer","User Interface Layer"],"a":2,"e":"The data-access layer runs the SQL SELECT.","s":"bank","k":107},{"id":"b16-54","u":16,"q":"Your team is designing a food delivery app. The \"Apply Discount\" function uses a complex rule: \"If the user is a premium member AND the order is over $30, apply a 15% discount.\" A junior developer places this rule in the script for the checkout button on the webpage. What is the main architectural problem with this?","o":["It improves the app's performance.","It correctly separates the UI from the application's rules.","It tightly couples the business rule to the user interface, making it hard to change and reuse.","It ensures the discount rule is always applied correctly."],"a":2,"e":"Putting rules in UI code couples them to the interface; they can't be reused or changed easily.","s":"bank"},{"id":"b16-55","u":16,"q":"You are designing a system for a logistics company that must integrate with several partners. These partners exchange data using standardized, but complex, XML message formats (e.g., for shipping manifests). The system needs to store and query these entire message structures efficiently. Which technology is the best fit?","o":["A Relational Database, because it is the most common.","An XML Database, because it can natively store and query hierarchical XML data.","A simple file system, because XML is just text.","An ODBC connection, because it standardizes access."],"a":1,"e":"Native XML databases store and query hierarchical XML efficiently.","s":"bank","k":108},{"id":"b16-56","u":16,"q":"An analyst needs to create a weekly sales report by pulling data from both a MySQL database and a separate Microsoft Access database into a single Excel spreadsheet. What technology allows Excel to uniformly access data from these two different database systems?","o":["SQL","XML","ODBC","XQuery"],"a":2,"e":"ODBC lets Excel reach both MySQL and Access uniformly.","s":"bank","k":108},{"id":"b16-57","u":16,"q":"A developer is using a Native XML Database to store customer records. They need to write a query to find all customers named \"John\" who live in \"London\". The data is stored in a hierarchical format. Which query language is most appropriate for this task?","o":["SQL","XPath or XQuery","ODBC","CRUD"],"a":1,"e":"XPath/XQuery query hierarchical XML data.","s":"bank","k":108},{"id":"b16-58","u":16,"q":"You are given an XML file that fails to open in a web browser. The error message says \"invalid markup.\" What is the most likely cause of this error?","o":["The data inside the XML is factually incorrect.","The XML is not well-formed (e.g., a missing closing tag or mismatched case).","The XML does not have a DTD or XSD associated with it.","The file is too large."],"a":1,"e":"'Invalid markup' usually means the XML is not well-formed.","s":"bank","k":111},{"id":"b16-59","u":16,"q":"In an XML document representing a company's departments, which of the following snippets correctly shows the structure where a \u003cdepartment> contains an \u003cemployee> who has a \u003cname>?","o":["\u003cdepartment>\u003cname>John\u003c/name>\u003cemployee>\u003c/employee>\u003c/department>","\u003cdepartment>\u003cemployee>\u003cname>John\u003c/name>\u003c/employee>\u003c/department>","\u003cemployee>\u003cdepartment>\u003cname>John\u003c/name>\u003c/department>\u003c/employee>","\u003cname>John\u003c/name>\u003cemployee>\u003c/employee>\u003cdepartment>\u003c/department>"],"a":1,"e":"department → employee → name, each properly nested.","s":"bank"},{"id":"b16-60","u":16,"q":"An XML document is being used to exchange invoice data between two business systems. System B requires that every \u003cinvoice> element must contain a \u003cdate> and a \u003ctotal> element, and that \u003ctotal> must be a positive number. How can System B automatically enforce these rules when it receives the XML data?","o":["By viewing the XML in a browser with a linked CSS file.","By validating the XML against an XSD (XML Schema Definition) that defines these rules.","By transforming the XML using XSLT.","By storing the XML in a relational database."],"a":1,"e":"An XSD defines required elements and data rules for automatic validation.","s":"bank","k":112},{"id":"b16-61","u":16,"q":"You have an XML file containing raw book data (\u003ctitle>, \u003cauthor>, \u003cisbn>). You need to convert this XML into a clean HTML table for a website. Which technology is specifically designed for this kind of transformation?","o":["CSS","ODBC","XSLT","DTD"],"a":2,"e":"XSLT is designed to transform XML into HTML.","s":"bank","k":113},{"id":"b16-62","u":16,"q":"A developer creates an XML Schema (XSD) that defines an \u003cage> element as being of type xs:integer with a minimum value of 0. They then validate an XML file against this schema. The file contains the value \"twenty\" for the \u003cage> element. What is the outcome of the validation?","o":["It passes because \"twenty\" is a valid representation of an integer.","It fails because \"twenty\" is a string, not an integer, violating the data type defined in the XSD.","It passes because the XSD only checks for the presence of the element, not its content.","It fails because the value is not greater than 0."],"a":1,"e":"'twenty' is not an xs:integer, so validation fails.","s":"bank","k":112},{"id":"b17-1","u":17,"q":"What does features and capabilities of hardware and software mainly refer to?","o":["The brand name of the product","What the product can do and how it performs","The price of the product","The color and design"],"a":1,"e":"Features and capabilities = what the product can do and how well it performs.","s":"bank","k":114},{"id":"b17-2","u":17,"q":"Which is an example of a software capability?","o":["Keyboard layout","File processing speed","Monitor size","Cable type"],"a":1,"e":"Processing speed is something software does; the others are physical hardware traits.","s":"bank","k":114},{"id":"b17-3","u":17,"q":"What does “supported by an organization” mean?","o":["Approved and maintained by IT","Personally owned tools","Free online software","Outdated systems"],"a":0,"e":"Supported = approved, licensed and maintained by the organisation's IT team.","s":"bank","k":115},{"id":"b17-4","u":17,"q":"What is information technology terminology?","o":["Informal language","Marketing words","Technical terms used in IT","Legal vocabulary"],"a":2,"e":"IT terminology is the technical vocabulary of the field.","s":"bank","k":116},{"id":"b17-5","u":17,"q":"Which is the most reliable source of technical information?","o":["Online advertisements","Social media comments","Official vendor documentation","Personal opinions"],"a":2,"e":"Official vendor documentation is the most authoritative source.","s":"bank","k":117},{"id":"b17-6","u":17,"q":"What is the main purpose of a slideshow?","o":["Data storage","Visual presentation of information","File management","Network control"],"a":1,"e":"A slideshow presents information visually.","s":"bank","k":118},{"id":"b17-7","u":17,"q":"What is the main role of documentation?","o":["User guidance","Marketing","System monitoring","Data storage"],"a":0,"e":"Documentation guides users in using the system.","s":"bank","k":117},{"id":"b17-8","u":17,"q":"What does personalization allow users to change?","o":["Hardware structure","Security policies","User settings","System architecture"],"a":2,"e":"Personalisation lets users change their own settings.","s":"bank","k":120},{"id":"b17-9","u":17,"q":"What is on-site instruction?","o":["Remote voice support","Online chat support","Face-to-face support at the user’s location","Email support"],"a":2,"e":"On-site = face-to-face at the user's location.","s":"bank","k":121},{"id":"b17-10","u":17,"q":"What is telephone instruction?","o":["Written support","Face-to-face training","Remote support by phone","On-site assistance"],"a":2,"e":"Telephone instruction = remote support by phone.","s":"bank","k":121},{"id":"b17-11","u":17,"q":"Which tool is primarily used to design and present slides in one-to-one instruction sessions?","o":["Google Docs","Microsoft PowerPoint","Excel","Paint"],"a":1,"e":"PowerPoint is presentation (slide) software.","s":"bank","k":118},{"id":"b17-12","u":17,"q":"Which term refers to a step-by-step guide or live demonstration used to explain a process during training?","o":["Knowledge Base","Walkthrough","User Account","Release Notes"],"a":1,"e":"A walkthrough is a step-by-step guide or live demonstration.","s":"bank","k":119},{"id":"b17-13","u":17,"q":"What is a Learning Management System (LMS) used for in training?","o":["Designing hardware components","Delivering, tracking, and managing training","Recording audio only","Creating operating systems"],"a":1,"e":"An LMS delivers, tracks and manages training.","s":"bank","k":116},{"id":"b17-14","u":17,"q":"Which term describes a searchable collection of help articles or guides used during instruction?","o":["Job Aid","Knowledge Base","Hotline","Transition"],"a":1,"e":"A knowledge base is a searchable collection of help articles.","s":"bank","k":119},{"id":"b17-15","u":17,"q":"What is the main purpose of a Job Aid in one-to-one training?","o":["To replace user manuals completely","To provide quick-reference tools that help users complete tasks","To record every training session","To manage user accounts"],"a":1,"e":"A job aid is a quick-reference tool (cheat sheet, checklist) used while doing the task.","s":"bank","k":119},{"id":"b17-16","u":17,"q":"Which source of technical information is best for step-by-step guidance and explaining button functions and menus?","o":["Online forums and communities","User manuals and product documentation","Release notes","Telephone support"],"a":1,"e":"User manuals explain menus, buttons and procedures step by step.","s":"bank","k":117},{"id":"b17-17","u":17,"q":"Which source is best for quick answers to common user problems and up-to-date information on software changes?","o":["Online knowledge bases","Printed manuals only","Internal HR forms","Mind maps"],"a":0,"e":"Online knowledge bases are quick to search and kept up to date.","s":"bank","k":117},{"id":"b17-18","u":17,"q":"Training videos and tutorials are especially useful for which type of learners?","o":["Learners who prefer printed content only","learners who benefit from step-by-step demonstrations","Learners who avoid multimedia","Learners who never repeat content"],"a":1,"e":"Videos suit learners who benefit from seeing each step demonstrated.","s":"bank"},{"id":"b17-19","u":17,"q":"Which source of technical information is created by IT staff to cover company-specific processes and policies?","o":["Online forums","SOP (Standard Operating Procedures)","Public FAQs","Social media posts"],"a":1,"e":"SOPs document company-specific processes and policies.","s":"bank","k":117},{"id":"b17-20","u":17,"q":"What does the term “Access Rights / Permissions” refer to in IT instruction?","o":["The visual layout of slides","Controls over what a user can see or do on a system","The speed of the internet connection","The animation speed of transitions"],"a":1,"e":"Access rights control what a user can see or do.","s":"bank","k":118},{"id":"b17-21","u":17,"q":"What is a key capability of presentation software?","o":["Managing servers","Installing drivers","Creating and displaying slides","Controlling networks"],"a":2,"e":"Presentation software creates and displays slides.","s":"bank","k":118},{"id":"b17-22","u":17,"q":"Why is using correct IT terminology important?","o":["To confuse users","To reduce training","For clear technical communication","To replace support"],"a":2,"e":"Correct terminology makes technical communication clear.","s":"bank","k":114},{"id":"b17-23","u":17,"q":"What is the purpose of a user manual?","o":["To advertise products","To explain how to use a system","To store data","To install hardware"],"a":1,"e":"A user manual explains how to use a system.","s":"bank","k":117},{"id":"b17-24","u":17,"q":"Which feature improves clarity in slideshows?","o":["Long text paragraphs","Small fonts","Visuals and bullet points","Hidden content"],"a":2,"e":"Visuals and bullet points make slides clear.","s":"bank","k":114},{"id":"b17-25","u":17,"q":"Which document helps users fix common problems?","o":["User manual","Contract","Invoice","Advertisement"],"a":0,"e":"User manuals usually include troubleshooting sections.","s":"bank","k":117},{"id":"b17-26","u":17,"q":"Which is an example of personalization?","o":["Installing RAM","Changing language settings","Replacing hardware","Formatting storage"],"a":1,"e":"Changing language settings is personalisation.","s":"bank","k":120},{"id":"b17-27","u":17,"q":"When is on-site instruction most appropriate?","o":["Simple questions","Complex hardware issues","Password resets","Software updates"],"a":1,"e":"Complex hardware problems need someone physically present.","s":"bank","k":116},{"id":"b17-28","u":17,"q":"What is a disadvantage of on-site instruction?","o":["Immediate support","Higher cost and time","Clear communication","Personal assistance"],"a":1,"e":"On-site visits cost more time and money (travel).","s":"bank","k":121},{"id":"b17-29","u":17,"q":"Which skill is important for telephone support staff?","o":["Physical strength","Clear communication","Graphic design","Programming only"],"a":1,"e":"Phone support depends on clear verbal communication.","s":"bank","k":121},{"id":"b17-30","u":17,"q":"What is an advantage of telephone instruction?","o":["Requires travel","Fast remote help","High cost","Physical setup"],"a":1,"e":"Phone help is fast and needs no travel.","s":"bank","k":121},{"id":"b17-31","u":17,"q":"Which item is considered hardware?","o":["Antivirus program","Operating system","Word processor","Printer"],"a":3,"e":"A printer is physical hardware; the others are software.","s":"bank","k":116},{"id":"b17-32","u":17,"q":"Where can users find updated software instructions?","o":["Posters","Old textbooks","Vendor websites","Email signatures"],"a":2,"e":"Vendor websites carry the latest instructions.","s":"bank"},{"id":"b17-33","u":17,"q":"Which element is commonly used in slideshows?","o":["Databases","Firewalls","Slides","Servers"],"a":2,"e":"Slideshows are made of slides.","s":"bank","k":118},{"id":"b17-34","u":17,"q":"Why are manuals important for new users?","o":["They replace hardware","They explain system use","They slow learning","They increase cost"],"a":1,"e":"Manuals explain how to use the system.","s":"bank","k":114},{"id":"b17-35","u":17,"q":"Who usually provides on-site instruction?","o":["End users","IT technicians","Customers","Managers"],"a":1,"e":"IT technicians usually provide on-site instruction.","s":"bank","k":121},{"id":"b17-37","u":17,"q":"What is the primary purpose of a walkthrough in an instructional context?","o":["To track user progress and completion rates.","To provide a step-by-step guide or live demonstration of a process.","To create a personalized user profile with specific permissions.","To capture and document errors in a software system."],"a":1,"e":"A walkthrough demonstrates a process step by step.","s":"bank","k":119},{"id":"b17-38","u":17,"q":"The action of adjusting software settings to better suit a specific user's preferences or requirements is called?","o":["Troubleshooting","Customization","Session Recording","Walkthrough"],"a":1,"e":"Adjusting settings for a user is customisation.","s":"bank"},{"id":"b17-39","u":17,"q":"Moodle and Google Classroom are common examples of what?","o":["Knowledge Base platforms","Help Desk Systems","Remote Support tools","Learning Management Systems (LMS)"],"a":3,"e":"Moodle and Google Classroom are LMSs.","s":"bank","k":114},{"id":"b17-40","u":17,"q":"Which tool allows an IT trainer to take control of a learner's computer to assist them from another location?","o":["Knowledge Base","Learning Management System (LMS)","Remote Support","Session Recording"],"a":2,"e":"Remote support tools let the trainer control the learner's PC from elsewhere.","s":"bank","k":114},{"id":"b17-41","u":17,"q":"Which software is most likely supported by an organization?","o":["IT-approved office software","Trial games","Personal apps","Unlicensed tools"],"a":0,"e":"IT-approved office software is supported by the organisation.","s":"bank","k":115},{"id":"b17-42","u":17,"q":"Why do organizations limit supported software?","o":["To reduce user skills","To improve security and compatibility","To increase costs","To slow systems"],"a":1,"e":"Limiting software improves security and compatibility.","s":"bank","k":114},{"id":"b17-43","u":17,"q":"Which term refers to physical computer components?","o":["Software","Firmware","Data","Hardware"],"a":3,"e":"Hardware = physical components.","s":"bank","k":116},{"id":"b17-44","u":17,"q":"What does the term “operating system” mean?","o":["A type of hardware","A security threat","A program that manages computer resources","A user manual"],"a":2,"e":"An operating system manages hardware and software resources.","s":"bank","k":116},{"id":"b17-45","u":17,"q":"Why is access to technical information important?","o":["To increase system errors","To delay work","To support problem solving","To remove training"],"a":2,"e":"Technical information helps solve problems.","s":"bank","k":114},{"id":"b17-46","u":17,"q":"Which software type is used to create slideshows?","o":["Antivirus software","Presentation software","Accounting software","Database software"],"a":1,"e":"Presentation software creates slideshows.","s":"bank","k":118},{"id":"b17-47","u":17,"q":"When should documentation be provided?","o":["Only after errors occur","Only to experts","With the product or system","At the end of the year"],"a":2,"e":"Documentation should come with the product or system.","s":"bank","k":117},{"id":"b17-48","u":17,"q":"Why is personalization useful?","o":["It improves user experience","It reduces performance","It limits access","It removes features"],"a":0,"e":"Personalisation improves the user experience.","s":"bank","k":120},{"id":"b17-49","u":17,"q":"Personalization mainly focuses on:","o":["Network speed","Organizational rules","User preferences","Hardware limits"],"a":2,"e":"Personalisation is about user preferences.","s":"bank","k":120},{"id":"b17-50","u":17,"q":"Telephone instruction is most suitable for:","o":["Physical repairs","Simple troubleshooting","Hardware installation","Network wiring"],"a":1,"e":"Phone instruction suits simple troubleshooting.","s":"bank","k":121},{"id":"b17-51","u":17,"q":"Why should animations be used sparingly in instructional presentations?","o":["They increase file size only","They are incompatible with most hardware","They can distract from learning objectives","They reduce collaboration features"],"a":2,"e":"Too many animations distract from the learning objective.","s":"bank","k":118},{"id":"b17-52","u":17,"q":"Which option BEST differentiates documentation from training delivery?","o":["Documentation is always verbal","Documentation supports learning before, during, and after training","Training replaces the need for manuals","Documentation is only for advanced users"],"a":1,"e":"Documentation supports learners before, during and after training.","s":"bank","k":117},{"id":"b17-53","u":17,"q":"Which feature of a slideshow helps guide the audience through key points clearly?","o":["Long paragraphs","Visual hierarchy","Small font size","Excessive animations"],"a":1,"e":"Visual hierarchy guides the audience through key points.","s":"bank","k":118},{"id":"b17-54","u":17,"q":"What is the main purpose of using large fonts and clear titles in slides?","o":["To increase file size","To improve readability and understanding","To add decoration","To reduce preparation time"],"a":1,"e":"Large fonts and clear titles improve readability.","s":"bank","k":118},{"id":"b17-55","u":17,"q":"Which document is MOST useful for quickly learning basic software functions?","o":["Release notes","Licensing agreement","Quick-start guide","Marketing brochure"],"a":2,"e":"Quick-start guides cover the basics fast.","s":"bank","k":119},{"id":"b17-56","u":17,"q":"What does personalization in instruction mainly involve?","o":["Using the same content for everyone","Adapting content to learner needs","Reducing interaction","Avoiding learner feedback"],"a":1,"e":"Personalised instruction adapts content to the learner.","s":"bank","k":120},{"id":"b17-57","u":17,"q":"Which approach BEST supports personalized instruction?","o":["Following a fixed script","Ignoring learner background","Asking learners about their goals","Delivering content as fast as possible"],"a":2,"e":"Ask learners about their goals, then tailor the session.","s":"bank","k":114},{"id":"b17-58","u":17,"q":"What is a key advantage of on-site instruction?","o":["No preparation required","Ability to provide hands-on guidance","Works without any equipment","Suitable only for experts"],"a":1,"e":"On-site instruction allows hands-on guidance.","s":"bank","k":121},{"id":"s1","u":1,"q":"What is an example of a Software Development Life Cycle model?","o":["Sequence.","Spiral.","Capability maturity.","SD model."],"a":1,"e":"Spiral is an SDLC model (others: Waterfall, V-model, Agile, Iterative). Capability Maturity is a process-maturity framework, not an SDLC model.","s":"sample","n":1,"k":5},{"id":"s2","u":1,"q":"Which one of the following is a way of expressing algorithms in software development?","o":["Flowcharts.","HTML.","Interpreter charts.","Control charts."],"a":0,"e":"Algorithms are expressed with flowcharts or pseudocode. HTML is markup.","s":"sample","n":2,"k":6},{"id":"s3","u":1,"q":"What is a feature of Structured Programming?","o":["Write code.","Sequence.","Basic code.","Basic loops."],"a":1,"e":"Structured programming is built on three control structures: sequence, selection and iteration.","s":"sample","n":3,"k":8},{"id":"s4","u":1,"q":"What is the main purpose of a user interface?","o":["To interact with a system.","To gather software requirements.","To populate a database.","To test a software programme."],"a":0,"e":"A UI is how people interact with a system.","s":"sample","n":4},{"id":"s5","u":1,"q":"What best describes a principle of event driven programming?","o":["Events allow separate tasks to communicate.","An event class is a model of a user interface event.","Events do not allow separate tasks to communicate.","A mechanism that decides what should happen if an event occurs."],"a":3,"e":"Event-driven programs use handlers/listeners: a mechanism that decides what happens when an event occurs.","s":"sample","n":5,"k":11},{"id":"s6","u":2,"q":"What is the most important reason for modeling of requirements?","o":["To ensure consistency of process.","To communicate development needs.","To give a diagrammatic representation.","To identify how software functions."],"a":1,"e":"Models exist mainly to communicate needs clearly between stakeholders and developers.","s":"sample","n":6},{"id":"s7","u":2,"q":"Which one of the following is a type of modeling?","o":["UML.","W3C.","PCP.","HCI."],"a":0,"e":"UML (Unified Modeling Language) is a modelling notation. W3C is a standards body; HCI is a discipline.","s":"sample","n":7,"k":12},{"id":"s8","u":2,"q":"What ensures that a software development product is fit for purpose?","o":["Return on investment (ROI).","Quality assurance practices.","Cost-benefit analysis.","Benchmarking across the industry."],"a":1,"e":"Quality assurance practices check the product meets requirements, i.e. is fit for purpose.","s":"sample","n":8,"k":14},{"id":"s9","u":2,"q":"What is an example of a change management practice?","o":["Verifying that the code meets the user requirements.","Submitting a control assessment form to management.","Submitting a request to meet new user requirements.","Verifying that management have signed off the budget."],"a":2,"e":"Change management starts with a formal change request for new requirements.","s":"sample","n":9,"k":16},{"id":"s10","u":2,"q":"Which one of the following shows hardware and software events in the software development process?","o":["FTA.","ERD.","DFD.","UML."],"a":0,"e":"Fault Tree Analysis (FTA) models combinations of hardware and software events that lead to failures.","s":"sample","n":10,"k":18},{"id":"s11","u":3,"q":"What is an example of Software Metrics in software development?","o":["Performance metrics.","Function point analysis.","Risk factor analysis.","Routing."],"a":1,"e":"Function point analysis measures software size by functionality, a classic software metric.","s":"sample","n":11,"k":20},{"id":"s12","u":3,"q":"Which one of the following is a standard business requirement?","o":["Non-functional requirements.","Technical requirements.","Transitional requirements.","Definitive requirements."],"a":1,"e":"Per the sample key, technical requirements are listed as a standard business requirement category.","s":"sample","n":12,"k":24},{"id":"s13","u":4,"q":"What is the main purpose of debugging a program?","o":["To design a test plan.","To remove errors.","To evaluate test results.","To document the code."],"a":1,"e":"Debugging finds and removes errors (bugs).","s":"sample","n":13,"k":29},{"id":"s14","u":4,"q":"Which of the following test methods is used in prototyping?","o":["Static.","White box.","Alpha.","Dynamic."],"a":1,"e":"Per the sample key, white-box testing is the method associated with prototyping here.","s":"sample","n":14,"k":31},{"id":"s15","u":4,"q":"Which of the following tests the functionality of a Graphical User Interface?","o":["Verification.","Application.","Validation.","Usability."],"a":3,"e":"Usability testing checks how well users can operate the GUI.","s":"sample","n":15,"k":33},{"id":"s16","u":4,"q":"What is the correct term for testing applications?","o":["Validation.","Accountability.","Usability.","Performance."],"a":0,"e":"Validation confirms the application does what users need.","s":"sample","n":16,"k":33},{"id":"s17","u":5,"q":"Which of the following improves the usability of technical documentation?","o":["Templates.","Indexes.","Styles.","Forms."],"a":1,"e":"An index helps readers find information quickly.","s":"sample","n":17,"k":34},{"id":"s18","u":5,"q":"Which of the following improves readability of technical documentation?","o":["Clear and concise language.","Problems and their solutions included.","Tested and worked instructions.","Accurately defined technical terms."],"a":0,"e":"Readability depends on clear, concise language.","s":"sample","n":18,"k":37},{"id":"s19","u":5,"q":"Which of the following documents form part of continuous service improvement?","o":["Requirements specification.","User manual.","System maintenance manual.","Quality assurance policy."],"a":2,"e":"The system maintenance manual supports ongoing service improvement.","s":"sample","n":19,"k":35},{"id":"s20","u":5,"q":"Which is the best way to get user feedback on technical documentation?","o":["Online satisfaction survey.","Structured interviews.","Design workshop.","Accessibility testing."],"a":1,"e":"Structured interviews give detailed, comparable feedback.","s":"sample","n":20,"k":39},{"id":"s21","u":6,"q":"Which of the following is an internal quality metric for user interfaces?","o":["Integrity.","Accuracy.","Usability.","Reusability."],"a":2,"e":"Usability is the key internal quality metric for a UI.","s":"sample","n":21,"k":46},{"id":"s22","u":6,"q":"What is the main purpose of the World Wide Web Consortium's WAI initiative?","o":["To improve web accessibility for people with disabilities.","To improve web content accessibility guidelines.","To improve authoring tools accessibility guidelines.","To improve web protocols and formats."],"a":0,"e":"WAI's overall goal is accessibility for people with disabilities; WCAG and ATAG are its outputs.","s":"sample","n":22,"k":43},{"id":"s23","u":6,"q":"Which of the following best describes usability testing for user interfaces?","o":["Market research evaluation.","Qualitative evaluation.","Heuristic evaluation.","Cognitive evaluation."],"a":2,"e":"Heuristic evaluation checks the UI against usability principles.","s":"sample","n":23,"k":42},{"id":"s24","u":6,"q":"What is the purpose of using text equivalent for non-text elements on a web page?","o":["To improve design.","To improve accessibility.","To improve testability.","To improve consistency."],"a":1,"e":"Text equivalents (alt text) make non-text content accessible.","s":"sample","n":24,"k":44},{"id":"s25","u":6,"q":"Which of the following is a basic principle of user interface design?","o":["Consistency.","Mapping.","Verification.","Editing."],"a":0,"e":"Consistency is a core UI design principle.","s":"sample","n":25,"k":40},{"id":"s26","u":6,"q":"Which of the following is the most practical way to design and develop graphical user interfaces?","o":["Using modeling techniques.","Using user experience testing.","Using textual description.","Using prototyping."],"a":3,"e":"Prototyping lets you build, test and refine a GUI quickly.","s":"sample","n":26,"k":48},{"id":"s27","u":7,"q":"Java is an example of which type of programming language?","o":["Machine code.","Event driven.","Object-oriented.","Procedural."],"a":2,"e":"Java is object-oriented: classes, objects, inheritance, polymorphism.","s":"sample","n":27,"k":49},{"id":"s28","u":7,"q":"Which of the following can be used to describe the Java programming language?","o":["It is a scripting language.","It is a natural language.","It uses dynamic typing.","It is Class-based."],"a":3,"e":"Java is class-based and statically typed.","s":"sample","n":28,"k":49},{"id":"s29","u":8,"q":"Which one of the following is a Java programming tool?","o":["Spreadsheet.","Compiler.","Website.","Database."],"a":1,"e":"The Java compiler (javac) turns source code into bytecode.","s":"sample","n":29,"k":56},{"id":"s30","u":8,"q":"Which one of the following is usually included in standard libraries of software programs?","o":["Class definitions.","Interpreter definitions.","Book definitions.","Query definitions."],"a":0,"e":"Standard libraries provide ready-made class definitions (e.g. java.util).","s":"sample","n":30,"k":57},{"id":"s31","u":9,"q":"Which one of the following types of websites is open to the general public?","o":["Intranet.","Online catalogue.","Extranet.","Virtual Learning Environment."],"a":1,"e":"Online catalogues are public; intranets/extranets/VLEs need login.","s":"sample","n":31,"k":62},{"id":"s32","u":9,"q":"Which one of the following types of websites is mainly used for internal business communications?","o":["Intranets.","Libraries.","Online banking.","Online shopping."],"a":0,"e":"Intranets serve internal communication.","s":"sample","n":32,"k":63},{"id":"s33","u":9,"q":"Which one of the following gives access to the Internet?","o":["ISP.","URL.","W3C.","WWW."],"a":0,"e":"An Internet Service Provider gives access to the Internet.","s":"sample","n":33,"k":65},{"id":"s34","u":9,"q":"Which one of the following is not a type of server?","o":["Blog.","Mail.","Proxy.","Web."],"a":0,"e":"A blog is a type of website, not a server.","s":"sample","n":34,"k":68},{"id":"s35","u":9,"q":"Which one of the following is used to design webpages on a website?","o":["Action buttons.","Tables.","Hyperlinks.","Wireframes."],"a":3,"e":"Wireframes are the design blueprint of a page.","s":"sample","n":35,"k":70},{"id":"s36","u":9,"q":"Which one of the following is used to create webpages on a website?","o":["Action buttons.","HTML.","Hyperlinks.","Tables."],"a":1,"e":"HTML is the language used to create web pages.","s":"sample","n":36,"k":70},{"id":"s37","u":9,"q":"Which one of the following is most important for website usability?","o":["Colors and fonts.","Navigation.","Download speeds.","Static images."],"a":1,"e":"Clear navigation is the most important usability factor.","s":"sample","n":37,"k":71},{"id":"s38","u":10,"q":"Which HTML and HTML 5 tags are used when creating tables?","o":["\u003cH1> \u003c/H1>","\u003cOL> \u003c/OL>","\u003cP> \u003c/P>","\u003cTR> \u003c/TR>"],"a":3,"e":"\u003ctr> defines a table row.","s":"sample","n":38,"k":72},{"id":"s39","u":10,"q":"Which one of the following is used to transport and store data?","o":["CSS.","HTML.","XML.","XHTML."],"a":2,"e":"XML is designed to transport and store data; HTML displays it.","s":"sample","n":39,"k":74},{"id":"s40","u":10,"q":"What is the main function of a browser?","o":["To design web pages.","To set standards.","To display web pages.","To classify documents."],"a":2,"e":"Browsers retrieve and display web pages.","s":"sample","n":40,"k":77},{"id":"s41","u":10,"q":"Which of the following is a W3C standard?","o":["RTF.","DOC.","HTML.","PDF."],"a":2,"e":"HTML is a W3C standard.","s":"sample","n":41,"k":79},{"id":"s42","u":12,"q":"Which social networking site allows its users to write and send text messages with a limit of 140 characters?","o":["Facebook.","LinkedIn.","Pinterest.","Twitter."],"a":3,"e":"Twitter's original limit was 140 characters (now 280).","s":"sample","n":42,"k":82},{"id":"s43","u":12,"q":"Which of the following is an important guideline when using social networks?","o":["Keep personal data secure.","Share all information freely.","Upload large images separately.","Follow all suggested links."],"a":0,"e":"Protect personal data on social networks.","s":"sample","n":43,"k":83},{"id":"s44","u":13,"q":"What is JavaScript used for?","o":["To control the pages on a website.","To make the website more static.","To make web pages more dynamic.","To send web pages to the server."],"a":2,"e":"JavaScript makes pages dynamic and interactive.","s":"sample","n":44,"k":88},{"id":"s45","u":13,"q":"Which session type needs to save information about the session history in order to communicate?","o":["Cookies.","Stateful.","Stateless.","Telnet."],"a":1,"e":"Stateful sessions keep history/state between requests.","s":"sample","n":45,"k":91},{"id":"s46","u":14,"q":"Which of the following is a function of the firewall?","o":["Prevents the computer from over-heating.","Protects information from being misused.","Protects from viruses attached to email messages.","Prevents hackers accessing a computer."],"a":3,"e":"Firewalls block unauthorised network access (hackers). Email viruses are antivirus territory.","s":"sample","n":46,"k":92},{"id":"s47","u":14,"q":"Which one of the following is designed to damage or disrupt a system?","o":["Malware.","Cookies.","Anti-virus.","Spyware."],"a":0,"e":"Malware is any software designed to damage or disrupt; spyware specifically spies.","s":"sample","n":47,"k":96},{"id":"s48","u":14,"q":"Which of the following standards allows cable television operators to offer secure access to the internet?","o":["PCIDSS.","DOCSIS.","DNSSEC.","IEE 802.11."],"a":1,"e":"DOCSIS (Data Over Cable Service Interface Specification) is the cable-broadband standard. PCI DSS = card payments; DNSSEC = DNS; 802.11 = Wi-Fi.","s":"sample","n":48,"k":98},{"id":"s49","u":15,"q":"Which of the following is a part of a database management system?","o":["XML.","SQL.","UML.","CSS."],"a":1,"e":"SQL is the language a DBMS uses to define and manipulate data.","s":"sample","n":49,"k":102},{"id":"s50","u":15,"q":"Which of the following statements best describes the primary key in a database table?","o":["The primary key uniquely identifies each record.","The primary key must be a composite key.","The primary key is the same thing as a foreign key.","The primary key can contain a null attribute."],"a":0,"e":"A primary key is unique and not null.","s":"sample","n":50,"k":106},{"id":"s51","u":15,"q":"Why is UML important when creating a database?","o":["To test.","To design.","To record.","To model."],"a":3,"e":"UML is a modelling language.","s":"sample","n":51,"k":104},{"id":"s52","u":15,"q":"Which of the following SQL query statements will list book titles by all authors whose names begin with the letter C?","o":["SELECT title, author FROM book WHERE author LIKE 'C'","SELECT title, author FROM book WHERE author = 'C%'","SELECT title, author FROM book WHERE author LIKE 'C%'","SELECT title, author FROM book WHERE author = 'C____'"],"a":2,"e":"Wildcards (%) only work with LIKE. 'C%' = starts with C.","s":"sample","n":52,"k":106},{"id":"s53","u":15,"q":"Which one of the following is a key security issue to consider in database design?","o":["Redundancy of data.","Multi-user access control.","Use of primary keys.","Naming conventions."],"a":1,"e":"Controlling who can access what (multi-user access control) is the security issue.","s":"sample","n":53,"k":105},{"id":"s54","u":15,"q":"What result will the following SQL statement give?\nSELECT Orders.OrderID, Customers.CustomerName FROM Orders RIGHT JOIN Customers ON Orders.CustomerID=Customers.CustomerID;","o":["It will list all the names of Customers.","It will list all the Order ID numbers.","It will list the names of all Customers and any Orders they have placed.","It will list all the Order ID numbers and the names of Customers that placed them."],"a":2,"e":"RIGHT JOIN keeps every row of the right table (Customers) plus matching orders (NULL if none).","s":"sample","n":54,"k":106},{"id":"s55","u":16,"q":"Which layer manages the rate of data transmission between two nodes on a network?","o":["Transport layer.","Session layer.","Network layer.","Data link layer."],"a":0,"e":"Per the sample key, the transport layer handles flow control (rate of transmission) end to end.","s":"sample","n":55,"k":107},{"id":"s56","u":16,"q":"What is XML data stored in?","o":["HTML files.","Text files","RSS feeds.","Javascript."],"a":1,"e":"XML is stored as plain text files.","s":"sample","n":56},{"id":"s57","u":16,"q":"The diagram represents part of the document tree for an XML document. How many siblings does the element \u003cName> have?","o":["1.","2.","3.","4."],"a":2,"e":"\u003cName>, \u003cPayroll number>, \u003cDate of Birth> and \u003cGender> share one parent, so \u003cName> has 3 siblings. The Department attribute is not an element sibling.","s":"sample","n":57,"img":"xmltree","k":110},{"id":"s58","u":16,"q":"Which one of the following best describes an XML schema?","o":["It is converted from an XML file using an XML parser.","It is an XML alternative to DTD.","It needs an XML file to be loaded on different servers.","It needs an XML parser to be installed before using XML files."],"a":1,"e":"XML Schema (XSD) is the XML-based alternative to DTD.","s":"sample","n":58,"k":112},{"id":"s59","u":17,"q":"What hardware device is used to amplify network signals when sending them from one part of the network to another?","o":["A bridge.","A router.","A repeater.","A switch."],"a":2,"e":"A repeater regenerates/amplifies signals to extend range.","s":"sample","n":59,"k":114},{"id":"s60","u":17,"q":"Which one of the following is the best way to train a user to operate a new IT software program?","o":["Demonstrate the features for them to practice.","Upload the manual to the internet.","Give them the technical documentation.","Talk them through how to use it over the telephone."],"a":0,"e":"Demonstrate, then let them practise: the most effective one-to-one method.","s":"sample","n":60,"k":114},{"id":"d1","u":1,"q":"Which SDLC model completes each phase fully before the next one starts, with little room to go back?","o":["Waterfall","Spiral","Agile","Prototyping"],"a":0,"e":"Waterfall is linear and sequential. Spiral and Agile are iterative.","s":"draft","k":5},{"id":"d2","u":1,"q":"Which SDLC model is driven by repeated cycles of risk analysis?","o":["Spiral","Waterfall","V-model","Big Bang"],"a":0,"e":"Each loop of the Spiral model includes planning, risk analysis, engineering and evaluation.","s":"draft","k":5},{"id":"d3","u":1,"q":"In the V-model, each development phase is paired with:","o":["A matching testing phase","A marketing phase","A customer payment","A maintenance release"],"a":0,"e":"The V-model links each development stage to a test stage (e.g. requirements ↔ acceptance testing).","s":"draft","k":5},{"id":"d4","u":1,"q":"Which of the following is pseudocode used for?","o":["Describing an algorithm in plain, structured language before coding","Compiling code into machine language","Styling web pages","Storing data in a database"],"a":0,"e":"Pseudocode expresses logic in readable steps without the syntax of a real language.","s":"draft","k":6},{"id":"d5","u":1,"q":"The three basic control structures of structured programming are:","o":["Sequence, selection, iteration","Classes, objects, methods","Input, output, storage","Compile, link, run"],"a":0,"e":"Any algorithm can be built from sequence, selection (if) and iteration (loops).","s":"draft","k":8},{"id":"d6","u":1,"q":"Which flowchart symbol represents a decision?","o":["Diamond","Rectangle","Oval","Parallelogram"],"a":0,"e":"Diamond = decision; rectangle = process; oval = start/end; parallelogram = input/output.","s":"draft","k":6},{"id":"d7","u":1,"q":"What does a compiler do?","o":["Translates the whole source program into machine code before it runs","Executes source code one line at a time","Draws the user interface","Stores the program in a database"],"a":0,"e":"A compiler translates everything first; an interpreter translates and runs line by line.","s":"draft","k":1},{"id":"d8","u":1,"q":"In event-driven programming, the code that runs when
