"bank","k":72},{"id":"b10-64","u":10,"q":"During testing, the developer finds that paragraphs are running together without spacing. Which HTML tag is missing?","o":["\u003cbr>","\u003cp>","\u003cspan>","\u003chr>"],"a":1,"e":"\u003cp> creates separate paragraphs with spacing.","s":"bank","k":72},{"id":"b10-65","u":10,"q":"A student is creating a “Favorite Foods” list on her web page where each item should appear with a bullet point. Which HTML tag pair should she use?","o":["\u003cul> and \u003cli>","\u003col> and \u003cli>","\u003cdl> and \u003cdd>","\u003ctable> and \u003ctr>"],"a":0,"e":"\u003cul> with \u003cli> makes a bulleted list; \u003col> is numbered.","s":"bank","k":72},{"id":"b10-66","u":10,"q":"When creating a form, the developer notices that the browser shows an error due to unclosed tags. What does this indicate about the HTML version used?","o":["It is HTML5","It is XHTML, which requires strict tag closing","It is XML-based CSS","It is a legacy HTML version"],"a":1,"e":"XHTML is XML-based and strict: every tag must be closed.","s":"bank","k":73},{"id":"b10-67","u":10,"q":"Your XHTML page fails to load and displays a parsing error. What could be the cause?","o":["Missing \u003c!DOCTYPE> declaration","Unclosed tags or uppercase element names","Missing CSS reference","Wrong file name"],"a":1,"e":"XHTML parsers fail on unclosed tags or uppercase element names.","s":"bank","k":73},{"id":"b10-68","u":10,"q":"A developer wants a format for data exchange between different applications, such as student records between systems. Which markup language is best?","o":["HTML","XML","XHTML","CSS"],"a":1,"e":"XML is designed for exchanging data between systems.","s":"bank","k":74},{"id":"b10-69","u":10,"q":"You are reviewing an XML file and find two root elements. What will happen when you open it in a browser?","o":["It will display both trees","It will show a “not well-formed” error","It will merge both roots automatically","It will ignore one"],"a":1,"e":"XML must have exactly one root element; two roots make it not well-formed.","s":"bank","k":74},{"id":"b10-70","u":10,"q":"Your project’s XML file contains \u003cStudent> and \u003cstudent> elements. What problem might occur?","o":["Duplicate element","Case-sensitivity error","Encoding mismatch","Schema conflict"],"a":1,"e":"XML is case-sensitive, so \u003cStudent> and \u003cstudent> are different elements.","s":"bank","k":74},{"id":"b10-71","u":10,"q":"A designer is instructed to style the website text to appear blue for all paragraphs. Which CSS rule should they apply?","o":[".p {color:blue;}","p {color:blue;}","#p {color:blue;}","body {color:blue;}"],"a":1,"e":"Selector p (no dot or hash) targets every \u003cp> element.","s":"bank","k":72},{"id":"b10-72","u":10,"q":"Your homepage uses too much white space and the footer is misaligned. Which CSS property should be checked first?","o":["padding","font-size","margin","float"],"a":2,"e":"Margin controls space outside elements and alignment, the usual cause of extra white space.","s":"bank","k":75},{"id":"b10-73","u":10,"q":"Your college is redesigning its site. The manager asks for a layout that stays readable across devices. Which design principle applies?","o":["Fixed-width layout","Grid-based responsive design","Random placement of elements","Single-column only"],"a":1,"e":"Grid-based responsive design keeps the layout readable on every device.","s":"bank","k":76},{"id":"b10-74","u":10,"q":"The marketing team wants the homepage to reflect “professional trust.” Which design element should be carefully chosen to influence perception?","o":["Colors and typography","File formats","Screen size","HTML version"],"a":0,"e":"Colours and typography shape how trustworthy a site feels.","s":"bank","k":78},{"id":"b10-75","u":10,"q":"The same website looks different on Chrome and Safari. What concept is being tested?","o":["Responsive design","Cross-browser compatibility","Semantic HTML","Code validation"],"a":1,"e":"Same site, different browsers = cross-browser compatibility.","s":"bank","k":77},{"id":"b10-76","u":10,"q":"After uploading a page, it displays oddly in older browsers. The developer discovers \u003c!DOCTYPE html> was missing. What caused the issue?","o":["The browser entered quirks mode","Invalid CSS syntax","Slow server speed","Wrong charset"],"a":0,"e":"Without \u003c!DOCTYPE html>, browsers fall back to quirks mode and render inconsistently.","s":"bank","k":77},{"id":"b10-77","u":10,"q":"Your site loads well on Chrome but breaks on Firefox due to missing CSS prefixes. Which best practice can prevent this?","o":["Use browser-specific CSS files","Test early across browsers","Use inline styling","Avoid CSS frameworks"],"a":1,"e":"Testing in several browsers early catches problems such as missing prefixes.","s":"bank","k":75},{"id":"b10-78","u":10,"q":"A developer designs a responsive gallery that adapts from one column on mobile to four columns on desktop. What technique is used?","o":["Tables","Media Queries","Inline Styles","Iframes"],"a":1,"e":"Media queries change the number of columns at different widths.","s":"bank","k":75},{"id":"b10-79","u":10,"q":"When viewed on mobile, the college website appears zoomed out and unreadable. What’s missing in the code?","o":["\u003cmeta charset=\"UTF-8\">","\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">","\u003cstyle> block","\u003cbase> tag"],"a":1,"e":"Missing viewport meta tag makes mobile pages look zoomed out.","s":"bank","k":78},{"id":"b10-80","u":10,"q":"Your team must ensure the student portal is accessible to screen readers. Which HTML feature supports this?","o":["alt attributes for images","\u003cb> for emphasis","\u003cmarquee> for movement","Background audio"],"a":0,"e":"alt attributes let screen readers describe images.","s":"bank","k":80},{"id":"b10-81","u":10,"q":"Your college media page uses large PNG images that load slowly. What optimization helps performance without losing quality?","o":["Replace PNG with JPEG for photos","Add more CSS","Increase image resolution","Use BMP format"],"a":0,"e":"JPEG compresses photos much better than PNG with little visible loss.","s":"bank","k":81},{"id":"b10-82","u":10,"q":"Which principle ensures that a web page adapts effectively across different devices and screen sizes?","o":["Progressive enhancement","Responsive design","Graceful degradation","Code minification"],"a":1,"e":"Responsive design adapts pages across devices and screen sizes.","s":"bank","k":76},{"id":"b10-83","u":10,"q":"In web scripting, what is the main purpose of separating concerns (HTML, CSS, JavaScript)?","o":["To reduce file size","To improve browser compatibility only","To enhance maintainability and scalability","To eliminate scripting errors"],"a":2,"e":"Keeping structure, style and behaviour separate makes code easier to maintain and scale.","s":"bank","k":76},{"id":"b10-84","u":10,"q":"Which feature allows modern browsers to store data locally without using cookies?","o":["Session storage","Local storage","Cache API","IndexedDB"],"a":1,"e":"localStorage keeps data in the browser with no expiry and without cookies.","s":"bank","k":77},{"id":"b10-85","u":10,"q":"Which browser capability enables real-time communication between client and server?","o":["AJAX","WebSocket","HTTP","FTP"],"a":1,"e":"WebSocket keeps a two-way connection open for real-time messages.","s":"bank","k":77},{"id":"b10-86","u":10,"q":"What is the primary limitation when relying on browser-specific features?","o":["Reduced performance","Security vulnerabilities","Cross-browser compatibility issues","Increased loading time"],"a":2,"e":"Browser-specific features may not work in other browsers.","s":"bank","k":77},{"id":"b10-87","u":10,"q":"Which unit is most suitable for responsive web design?","o":["px","cm","em/rem","pt"],"a":2,"e":"em/rem scale with font size, suiting responsive design.","s":"bank","k":72},{"id":"b10-88","u":10,"q":"Why is designing for multiple screen resolutions important?","o":["To ensure usability across devices","To improve SEO only","To increase page speed","To reduce coding effort"],"a":0,"e":"Designing for many resolutions keeps the site usable on all devices.","s":"bank","k":78},{"id":"b10-89","u":10,"q":"Which technique ensures layout adapts to screen width?","o":["Fixed layout","Fluid grid layout","Inline styling","Absolute positioning"],"a":1,"e":"A fluid grid uses percentages so the layout follows screen width.","s":"bank","k":78},{"id":"b10-90","u":10,"q":"Why are W3C standards important?","o":["Improve graphics rendering","Ensure interoperability across browsers","Increase internet speed","Reduce server costs"],"a":1,"e":"W3C standards make sites work the same across browsers (interoperability).","s":"bank","k":79},{"id":"b10-91","u":10,"q":"Which of the following improves accessibility?","o":["Using images without alt text","Providing text alternatives for media","Using only mouse navigation","Avoiding headings"],"a":1,"e":"Text alternatives (alt text, captions) improve accessibility.","s":"bank","k":80},{"id":"b10-92","u":10,"q":"Which format supports animation?","o":["PNG","GIF","JPEG","BMP"],"a":1,"e":"GIF supports simple animation.","s":"bank","k":81},{"id":"b11-1","u":11,"q":"Which HTML element is semantically correct for the main page title and should be used only once on a page?","o":["\u003ch6>","\u003cheader>","\u003ch1>","\u003ctitle>"],"a":2,"e":"\u003ch1> is the top-level heading and normally appears once per page. \u003ctitle> sets the browser-tab text, not a visible heading.","s":"bank"},{"id":"b11-2","u":11,"q":"Which set of elements correctly represents a simple table header row with two header cells?","o":["\u003cthead>\u003ctr>\u003cth>H1\u003c/th>\u003cth>H2\u003c/th>\u003c/tr>\u003c/thead>","\u003ctable>\u003ctr>\u003ctd>H1\u003c/td>\u003ctd>H2\u003c/td>\u003c/tr>\u003c/table>","\u003ccaption>\u003cth>H1\u003c/th>\u003cth>H2\u003c/th>\u003c/caption>","\u003ctbody>\u003ctr>\u003cth>H1\u003c/th>\u003cth>H2\u003c/th>\u003c/tr>\u003c/tbody>"],"a":0,"e":"Header cells use \u003cth> inside \u003ctr>, grouped in \u003cthead>.","s":"bank"},{"id":"b11-3","u":11,"q":"Which is the modern, standards-compliant way to set the font family for paragraph text?","o":["\u003cfont face=\"Arial\">","\u003cp style=\"font-family: Arial, sans-serif;\">","\u003cp font=\"Arial\">","\u003cstyle font=\"Arial\">\u003c/style>"],"a":1,"e":"Styling belongs in CSS (font-family); \u003cfont> is obsolete.","s":"bank"},{"id":"b11-4","u":11,"q":"Which attribute of the \u003ca> element specifies the URL the link points to?","o":["src","href","link","target"],"a":1,"e":"href holds the link's destination URL.","s":"bank"},{"id":"b11-5","u":11,"q":"Which CSS rule correctly selects all \u003ch2> elements and sets their text color to blue?","o":["h2 { color: blue; }",".h2 { color: blue }","#h2 { color: blue; }","\u003ch2 style=\"color: blue;\">"],"a":0,"e":"A bare element selector (h2) targets all \u003ch2> elements. A dot is a class selector; a hash is an id selector.","s":"bank"},{"id":"b11-6","u":11,"q":"What is the primary role of CSS in web development?","o":["To define the structure of a webpage","To describe the presentation and layout of HTML elements","To create database connections","To validate form inputs"],"a":1,"e":"CSS controls presentation and layout; HTML provides structure.","s":"bank"},{"id":"b11-7","u":11,"q":"Which of the following is an example of inline CSS?","o":["\u003cstyle>p { color: red; }\u003c/style>","\u003clink rel=\"stylesheet\" href=\"style.css\">","\u003cp style=\"color:red;\">This is a paragraph.\u003c/p>","body { background-color: blue; }"],"a":2,"e":"Inline CSS sits in the element's style attribute.","s":"bank"},{"id":"b11-8","u":11,"q":"Which of the following is required in well-formed XHTML that is not strictly required in HTML5?","o":["All tags must be lowercase and properly closed.","Use of the \u003csection> element for sections.","Inline CSS only.","Use of the \u003cmeta charset> tag."],"a":0,"e":"XHTML follows XML rules: lowercase tags, every tag closed, correct nesting.","s":"bank"},{"id":"b11-9","u":11,"q":"Which of the following is the most important principle of website design?","o":["Adding as many animations as possible","Ensuring consistent layout and navigation","Using multiple fonts on every page","Avoiding white space"],"a":1,"e":"Consistent layout and navigation is the core design principle.","s":"bank"},{"id":"b11-10","u":11,"q":"Why is simplicity important in website design?","o":["It makes the site load slower","It reduces user confusion and improves usability","It hides important content","It limits accessibility"],"a":1,"e":"Simple designs reduce confusion and improve usability.","s":"bank"},{"id":"b11-11","u":11,"q":"What is the first step in identifying user requirements for a website?","o":["Writing HTML code","Conducting user research and analysis","Uploading media files","Testing browser compatibility"],"a":1,"e":"Start by researching users and analysing what they need.","s":"bank"},{"id":"b11-12","u":11,"q":"Which of the following is not a user requirement?","o":["Easy navigation","Accessibility","Fast loading time","Number of advertisements"],"a":3,"e":"The number of adverts is a business choice, not something users require.","s":"bank"},{"id":"b11-13","u":11,"q":"Which protocol ensures secure data transfer between a website and its users?","o":["HTTP","HTTPS","FTP","SMTP"],"a":1,"e":"HTTPS encrypts traffic between site and user.","s":"bank"},{"id":"b11-14","u":11,"q":"Why should user input forms be validated?","o":["To make the design more colorful","To prevent malicious attacks like SQL injection","To improve SEO ranking","To increase advertisement clicks"],"a":1,"e":"Validating input blocks malicious data such as SQL injection.","s":"bank"},{"id":"b11-15","u":11,"q":"Findability in web design refers to:","o":["How secure the website is","How easily users can locate information","How fast the website loads","How many images are used"],"a":1,"e":"Findability = how easily users (and search engines) can locate content.","s":"bank"},{"id":"b11-16","u":11,"q":"Which of the following improves findability?","o":["Broken links","Proper use of headings and keywords","Hiding navigation menus","Using long URLs without structure"],"a":1,"e":"Good headings and keywords help users and search engines find content.","s":"bank"},{"id":"b11-17","u":11,"q":"Why should images be optimized for websites?","o":["To increase file size","To slow down loading time","To improve performance and reduce bandwidth use","To reduce accessibility"],"a":2,"e":"Optimised images are smaller, load faster and use less bandwidth.","s":"bank"},{"id":"b11-18","u":11,"q":"Why is cross-browser compatibility important?","o":["Because all users use the same browser","To ensure the website works consistently across different browsers","To avoid using CSS","To reduce responsiveness"],"a":1,"e":"Users have different browsers; the site must work in all of them.","s":"bank"},{"id":"b11-19","u":11,"q":"Responsive web design ensures:","o":["The website only works on desktop","The website adjusts layout for different screen sizes","The website loads only on mobile data","The website hides images on desktop"],"a":1,"e":"Responsive design adjusts layout to screen size.","s":"bank"},{"id":"b11-20","u":11,"q":"A student needs to add headings, lists, and paragraphs to a web page. Which language should they use?","o":["XHTML","HTML","CSS","Java"],"a":1,"e":"HTML is the language for headings, lists and paragraphs.","s":"bank"},{"id":"b11-21","u":11,"q":"A developer wants to strictly enforce closing tags and correct nesting in code. Which markup language is best?","o":["HTML5","XHTML","CSS","JavaScript"],"a":1,"e":"XHTML enforces closing tags and correct nesting.","s":"bank"},{"id":"b11-22","u":11,"q":"A team wants to style all pages with a uniform font and color scheme. What tool should they use?","o":["HTML tables","CSS","PHP","Java"],"a":1,"e":"CSS gives every page the same fonts and colours.","s":"bank"},{"id":"b11-23","u":11,"q":"Why is CSS preferred over inline styling in HTML?","o":["It validates automatically","It applies consistent design across multiple pages","It reduces server cost","It replaces JavaScript"],"a":1,"e":"External CSS applies one consistent design across many pages.","s":"bank"},{"id":"b11-24","u":11,"q":"Which of the following tags is unique to HTML5 and not part of older HTML versions?","o":["\u003cvideo>","\u003ctable>","\u003cimg>","\u003cp>"],"a":0,"e":"\u003cvideo> was introduced in HTML5.","s":"bank"},{"id":"b11-25","u":11,"q":"A mobile banking site needs to adapt to different screen sizes. Which principle applies?","o":["Responsiveness","Robustness","Simplicity","Consistency"],"a":0,"e":"Adapting to screen sizes is responsiveness.","s":"bank"},{"id":"b11-26","u":11,"q":"A new university website must be easy for first-year students to navigate. Which design principle is most important?","o":["Ease of use","Browser compatibility","Robustness","Security"],"a":0,"e":"First-year students need a site that is easy to use.","s":"bank"},{"id":"b11-27","u":11,"q":"A government portal must protect personal data during login. Which factor is essential?","o":["Accessibility","Security","Robustness","Simplicity"],"a":1,"e":"Protecting personal data at login is security.","s":"bank"},{"id":"b11-28","u":11,"q":"A museum site hides navigation behind unusual icons. Which principle is being violated?","o":["Simplicity","Robustness","Consistency","Accessibility"],"a":0,"e":"Confusing, unusual icons break simplicity (keep it obvious).","s":"bank"},{"id":"b11-29","u":11,"q":"A shopping site is tested on Chrome, Firefox, and Safari to ensure it works the same. This reflects:","o":["Browser compatibility","Robustness","Security","Accessibility"],"a":0,"e":"Testing in several browsers checks browser compatibility.","s":"bank"},{"id":"b11-30","u":11,"q":"A job portal doesn’t show up in Google search results. Which design factor is missing?","o":["Findability","Responsiveness","Accessibility","Robustness"],"a":0,"e":"Not appearing in search results is a findability problem.","s":"bank"},{"id":"b11-31","u":11,"q":"An online art gallery adds large background images and videos. Which principle must be checked to avoid slow loading?","o":["Robustness","Security","Simplicity","Accessibility"],"a":0,"e":"Robustness here means the site keeps performing reliably under heavy media.","s":"bank","f":"Ambiguous: 'performance' or 'simplicity' could also be argued. Consider rewording."},{"id":"b11-32","u":11,"q":"A developer ensures the 'Sign Up' button looks the same on every page. Which principle is followed?","o":["Consistency","Simplicity","Robustness","Findability"],"a":0,"e":"The same button look on every page is consistency.","s":"bank"},{"id":"b11-33","u":11,"q":"Why should user requirements be collected before starting web design?","o":["To reduce testing","To ensure the site meets users’ needs","To replace security standards","To shorten coding time"],"a":1,"e":"Requirements first, so the site meets real user needs.","s":"bank"},{"id":"b11-34","u":11,"q":"Which element is MOST likely to reduce accessibility for disabled users?","o":["Missing alt text for images","Using a sans-serif font","Using blue for links","Adding a site map"],"a":0,"e":"Missing alt text blocks screen-reader users.","s":"bank"},{"id":"b11-35","u":11,"q":"A developer checks their site with W3C’s online validator. Why?","o":["To ensure markup follows web standards","To improve server speed","To add animations","To compress media"],"a":0,"e":"The W3C validator checks markup against web standards.","s":"bank"},{"id":"b11-36","u":11,"q":"Which guideline ensures that color-blind users can read text easily?","o":["Accessibility","Robustness","Simplicity","Responsiveness"],"a":0,"e":"Readable text for colour-blind users is an accessibility guideline.","s":"bank"},{"id":"b11-37","u":11,"q":"A teacher tells students to design sites that follow W3C standards. What is the benefit?","o":["Sites work consistently across browsers","Sites load without servers","Sites never require CSS","Sites automatically rank higher in search"],"a":0,"e":"Standards-compliant sites behave consistently across browsers.","s":"bank"},{"id":"b11-38","u":11,"q":"Which principle supports disabled users by allowing screen readers to describe page elements?","o":["Accessibility guidelines","Findability","Browser compatibility","Robustness"],"a":0,"e":"Screen readers describing elements = accessibility guidelines.","s":"bank"},{"id":"b11-39","u":11,"q":"A company wants to avoid future issues when web standards change. Which design principle helps most?","o":["Robustness","Flexibility","Accessibility","Simplicity"],"a":0,"e":"Robust sites keep working as browsers and standards change.","s":"bank"},{"id":"b11-40","u":11,"q":"Which HTML5 feature best supports embedding video content directly into a webpage without relying on third-party plugins?","o":["\u003cobject>","\u003cembed>","\u003cvideo>","\u003cmarquee>"],"a":2,"e":"\u003cvideo> embeds video natively, without plugins.","s":"bank"},{"id":"b11-41","u":11,"q":"How does the introduction of semantic tags in HTML5, such as \u003carticle> and \u003csection>, improve accessibility and SEO compared to older HTML versions?","o":["By reducing file size","By enabling clearer content structure for screen readers and crawlers","By allowing CSS animations","By replacing the need for \u003cdiv> entirely"],"a":1,"e":"Semantic tags give a clear structure that screen readers and search crawlers understand.","s":"bank"},{"id":"b11-42","u":11,"q":"What is the primary difference between HTML and XHTML in terms of syntax enforcement?","o":["XHTML allows unclosed tags","XHTML enforces well-formed XML rules","HTML requires strict nesting of tags","XHTML ignores case sensitivity"],"a":1,"e":"XHTML must be well-formed XML.","s":"bank"},{"id":"b11-43","u":11,"q":"Why would a developer choose XHTML over HTML5 for a project requiring data interchange between web applications and XML-based services?","o":["XHTML allows use of Flash","XHTML supports loose syntax","XHTML provides better compatibility with XML parsers","XHTML requires fewer closing tags"],"a":2,"e":"XHTML is XML, so XML parsers and services can read it.","s":"bank"},{"id":"b11-44","u":11,"q":"Which CSS property ensures that a webpage layout adapts to different screen sizes across devices?","o":["float","z-index","flex-wrap","media queries"],"a":3,"e":"Media queries apply different layouts per screen size.","s":"bank"},{"id":"b11-45","u":11,"q":"How does CSS specificity influence the rendering of styles when multiple rules target the same element?","o":["The shortest rule is applied","The latest rule in the file always overrides","Inline styles override external styles due to higher specificity","Browser chooses styles randomly"],"a":2,"e":"More specific rules win; inline styles beat external styles.","s":"bank"},{"id":"b11-46","u":11,"q":"Which design principle ensures that the same navigation bar and colour scheme are maintained across all pages of a website?","o":["Flexibility","Simplicity","Consistency","Robustness"],"a":2,"e":"Same navigation and colours on every page = consistency.","s":"bank"},{"id":"b11-47","u":11,"q":"How does prioritising accessibility in website design directly contribute to robustness and findability?","o":["By reducing website load time","By ensuring content can be accessed by all users, including those with disabilities and search engine crawlers","By eliminating CSS usage","By improving background images"],"a":1,"e":"Accessible content is readable by all users and by search crawlers.","s":"bank"},{"id":"b11-48","u":11,"q":"Which factor is most important when gathering user requirements for an e-commerce website?","o":["Preferred colour of navigation bar","Payment methods and checkout security","Number of background images","Size of banner ads"],"a":1,"e":"For e-commerce, payment options and checkout security matter most.","s":"bank"},{"id":"b11-49","u":11,"q":"How should a designer reconcile conflicting user requirements such as high visual appeal versus fast load time?","o":["Prioritise visuals always","Eliminate images entirely","Optimise media and balance performance with aesthetics","Ignore performance concerns"],"a":2,"e":"Optimise media to balance looks and speed.","s":"bank"},{"id":"b11-50","u":11,"q":"Which security measure best prevents cross-site scripting (XSS) in website forms?","o":["Using inline CSS","Validating and sanitising user input","Enabling autoplay videos","Adding animations"],"a":1,"e":"Validate and sanitise input to stop XSS.","s":"bank"},{"id":"b11-51","u":11,"q":"How does implementing HTTPS with SSL/TLS contribute to both security and user trust in website design?","o":["By speeding up CSS rendering","By encrypting data transmission and displaying a secure padlock icon","By allowing larger video files","By enforcing XHTML rules"],"a":1,"e":"TLS encrypts data and the padlock reassures users.","s":"bank"},{"id":"b11-52","u":11,"q":"Which technique best improves a website’s findability on search engines?","o":["Adding \u003cmarquee> text","Using semantic HTML tags and metadata","Increasing the number of decorative elements","Embedding large banners"],"a":1,"e":"Semantic HTML and metadata help search engines index the site.","s":"bank"},{"id":"b11-53","u":11,"q":"Why is structuring content with headings and landmarks crucial for both findability and accessibility?","o":["They make the site more colourful","They guide search crawlers and screen readers in understanding content hierarchy","They prevent browser compatibility issues","They eliminate the need for CSS"],"a":1,"e":"Headings and landmarks show hierarchy to crawlers and screen readers.","s":"bank"},{"id":"b11-54","u":11,"q":"Which media type is most effective for conveying dynamic product demonstrations on a website?","o":["Clip art","Video","Backgrounds","Banners"],"a":1,"e":"Video best shows a product working.","s":"bank"},{"id":"b11-55","u":11,"q":"How should designers balance the use of high-resolution images with website performance requirements?","o":["Always use original full-size files","Optimise images with compression without noticeable quality loss","Replace images with text descriptions only","Use unlimited decorative clip art"],"a":1,"e":"Compress images without visible quality loss.","s":"bank"},{"id":"b11-56","u":11,"q":"Which feature of modern browsers improves offline accessibility of web applications?","o":["CSS animations","Local storage and service workers","Background banners","Flash plugins"],"a":1,"e":"Local storage plus service workers let web apps work offline.","s":"bank"},{"id":"b11-57","u":11,"q":"How does understanding different browser rendering engines help developers ensure compatibility?","o":["It reduces need for testing","It allows developers to write engine-specific fallbacks and polyfills","It enables skipping HTML validation","It makes debugging unnecessary"],"a":1,"e":"Knowing engine differences lets developers add fallbacks and polyfills.","s":"bank"},{"id":"b11-58","u":11,"q":"Which design approach ensures websites display correctly across desktops, tablets, and smartphones?","o":["Responsive design","XHTML design","Static design","Clip art integration"],"a":0,"e":"Responsive design works on desktops, tablets and phones.","s":"bank"},{"id":"b11-59","u":11,"q":"Why is testing on multiple mobile devices essential for ensuring a positive user experience?","o":["Different devices use the same screen size","Different devices may vary in screen resolution, performance, and OS behaviour","Testing eliminates CSS use","It is required only for animations"],"a":1,"e":"Devices differ in resolution, power and OS behaviour.","s":"bank"},{"id":"b11-60","u":11,"q":"Which organisation is responsible for developing and maintaining HTML, CSS, and other web standards?","o":["IEEE","ISO","W3C","ITU"],"a":2,"e":"W3C maintains HTML, CSS and other web standards.","s":"bank"},{"id":"b11-61","u":11,"q":"How do W3C standards support interoperability in website development?","o":["By allowing proprietary coding methods","By ensuring consistent behaviour across browsers and platforms","By reducing file sizes only","By eliminating the need for accessibility testing"],"a":1,"e":"Standards make behaviour consistent across browsers and platforms.","s":"bank"},{"id":"b11-62","u":11,"q":"According to WCAG 2.1 guidelines, which principle ensures that all content is perceivable by users with disabilities?","o":["Robustness","Flexibility","Perceivability","Compatibility"],"a":2,"e":"The 'Perceivable' principle covers content users must be able to perceive.","s":"bank"},{"id":"b11-63","u":11,"q":"How does implementing ARIA (Accessible Rich Internet Applications) roles enhance accessibility compliance on dynamic websites?","o":["By adding SEO keywords","By helping assistive technologies interpret interactive content correctly","By reducing CSS file size","By increasing animation speed"],"a":1,"e":"ARIA roles tell assistive technology what custom interactive elements are.","s":"bank"},{"id":"b11-64","u":11,"q":"A university website is receiving complaints that visually impaired users cannot access course schedules properly, and the site looks broken on tablets. Which combination of design improvements would most effectively address these issues?","o":["Increase decorative clip art and animations","Apply semantic HTML tags, alt text for images, and responsive CSS media queries","Replace all tables with images of text content","Add only more video banners for clarity"],"a":1,"e":"Semantic HTML + alt text fixes access; media queries fix tablet layout.","s":"bank"},{"id":"b11-65","u":11,"q":"You are tasked with designing a secure e-commerce website that will mainly be accessed on mobile devices. During testing, users report that login details can be seen in the URL bar after submission. Which best practice should be implemented to solve this problem?","o":["Use GET requests for login forms and apply animations to mask URLs","Use POST requests with input validation and ensure HTTPS is enabled","Use XHTML instead of HTML5 for the login page","Save login details in cookies for faster re-authentication"],"a":1,"e":"POST keeps data out of the URL; HTTPS encrypts it; validation adds safety.","s":"bank"},{"id":"b11-66","u":11,"q":"A government portal must comply with WCAG 2.1 AA standards. During evaluation, it was found that buttons created with \u003cdiv> tags are not being recognised by screen readers. What should the developer do to fix this issue while meeting accessibility requirements?","o":["Keep using \u003cdiv> but add bold styling for visibility","Replace \u003cdiv> with semantic \u003cbutton> elements or apply ARIA roles","Use only images as clickable elements","Disable screen reader support since compliance is already achieved"],"a":1,"e":"Use real \u003cbutton> elements (or ARIA roles) so screen readers recognise them.","s":"bank"},{"id":"b11-67","u":11,"q":"Which of the following statements about HTML5 is true?","o":["HTML5 replaces CSS for styling web pages.","HTML5 allows embedding of multimedia without plugins.","HTML5 requires XHTML syntax for validation.","HTML5 cannot be used for offline web applications."],"a":1,"e":"HTML5 embeds audio and video without plugins.","s":"bank"},{"id":"b11-68","u":11,"q":"In XHTML, which rule must always be followed that is not mandatory in HTML5?","o":["Attribute values must be enclosed in double quotes.","All tags must be uppercase.","Inline styles are not allowed.","Comments must end with //."],"a":0,"e":"XHTML requires quoted attribute values.","s":"bank"},{"id":"b11-69","u":11,"q":"Which of the following tags was deprecated in HTML5 but valid in XHTML?","o":["\u003cmarquee>","\u003cvideo>","\u003csection>","\u003carticle>"],"a":0,"e":"\u003cmarquee> is obsolete/non-standard and not part of HTML5.","s":"bank","f":"Flawed premise: \u003cmarquee> was never valid XHTML either. Consider rewording."},{"id":"b11-70","u":11,"q":"Which CSS selector targets all \u003cp> elements inside a \u003cdiv> element?","o":["div + p","div > p","div p","p div"],"a":2,"e":"'div p' (space) is a descendant selector: any \u003cp> inside a \u003cdiv>.","s":"bank"},{"id":"b11-71","u":11,"q":"The principle of consistency in web design mainly ensures that:","o":["Every page has a unique layout.","All elements appear and behave similarly across pages.","Users can customize the interface freely.","The design automatically resizes images."],"a":1,"e":"Consistency means elements look and behave the same across pages.","s":"bank"},{"id":"b11-72","u":11,"q":"“Ease of use” primarily relates to:","o":["Visual aesthetics","User-friendly navigation and interaction","Database management","Code readability"],"a":1,"e":"Ease of use is about friendly navigation and interaction.","s":"bank"},{"id":"b11-73","u":11,"q":"A responsive website:","o":["Automatically detects user emotions.","Adapts its layout across different screen sizes and devices.","Loads only on desktop browsers.","Uses only HTML without CSS."],"a":1,"e":"Responsive layouts adapt to screen size and device.","s":"bank"},{"id":"b11-74","u":11,"q":"Which of the following improves accessibility the most?","o":["Using bright, complex backgrounds","Using inline JavaScript for text","Hiding navigation links","Providing text alternatives for images"],"a":3,"e":"Text alternatives for images help screen-reader users most.","s":"bank"},{"id":"b11-75","u":11,"q":"Which website design principle helps maintain usability when users switch browsers?","o":["Simplicity","Browser compatibility","Flexibility","Robustness"],"a":1,"e":"Browser compatibility keeps the site usable in any browser.","s":"bank"},{"id":"b11-76","u":11,"q":"In terms of security, which is the most effective web design practice?","o":["Using plain-text passwords for easier debugging","Disabling HTTPS for faster loading","Validating all user inputs","Storing credentials in cookies"],"a":2,"e":"Validating all inputs blocks many attacks.","s":"bank"},{"id":"b11-77","u":11,"q":"Findability refers to:","o":["The process of optimizing visuals for screen readers.","The ability of users to locate content easily within a website.","The way pages are cached by the browser.","The method used for encrypting form data."],"a":1,"e":"Findability is how easily users locate content.","s":"bank"},{"id":"b11-78","u":11,"q":"Which of the following is not an example of web media?","o":["Animations","Backgrounds","Tables","Video"],"a":2,"e":"Tables organise data; they are not a media type.","s":"bank"},{"id":"b11-79","u":11,"q":"To make a website robust, developers should:","o":["Minimize code testing","Ignore older browser versions","Ensure the website performs well across environments and updates","Use only one style sheet"],"a":2,"e":"Robust sites perform well across environments and updates.","s":"bank"},{"id":"b11-80","u":11,"q":"Which design principle encourages reducing clutter and unnecessary elements?","o":["Flexibility","Robustness","Simplicity","Accessibility"],"a":2,"e":"Simplicity = less clutter.","s":"bank"},{"id":"b11-81","u":11,"q":"Which of the following is part of W3C’s accessibility guidelines?","o":["Use of fixed-width layouts","Ensuring content is perceivable, operable, understandable, and robust","Using non-standard HTML attributes","Restricting color contrast"],"a":1,"e":"WCAG's four principles: Perceivable, Operable, Understandable, Robust.","s":"bank"},{"id":"b11-82","u":11,"q":"The WCAG (Web Content Accessibility Guidelines) is mainly concerned with:","o":["Accessibility for users with disabilities","Security testing","Browser speed optimization","SEO ranking"],"a":0,"e":"WCAG is about accessibility for people with disabilities.","s":"bank"},{"id":"b11-83","u":11,"q":"Which of the following is not a purpose of adhering to web standards?","o":["Enhancing compatibility","Improving accessibility","Preventing plagiarism","Maintaining consistency across platforms"],"a":2,"e":"Web standards don't deal with plagiarism.","s":"bank"},{"id":"b11-84","u":11,"q":"Your classmate created a table but didn’t add a title or explain what the headers mean. What should be added to make the table accessible for screen readers?","o":["\u003ctbody>","\u003ctfoot>","\u003ccaption> and scope attribute in \u003cth>","Use \u003ch1> inside the table"],"a":2,"e":"\u003ccaption> titles the table; scope on \u003cth> explains which cells each header covers.","s":"bank"},{"id":"b11-85","u":11,"q":"You are styling a university homepage. The client wants the college name in red, bold, and 40px in Arial font. Which CSS properties will help you achieve that?","o":["font-style, color, text-shadow","font-family, font-size, color, font-weight","margin, text-align, position","text-decoration, height, border"],"a":1,"e":"font-family (Arial), font-size (40px), color (red), font-weight (bold).","s":"bank"},{"id":"b11-86","u":11,"q":"A peer creates an XHTML page but it won’t load in the browser. You notice the \u003cimg> tag is written as \u003cimg>. What should they do?","o":["Add a caption to the image","Use uppercase for the tag","Use \u003cimg src=\"...\" /> with a slash","Use the \u003cimage> tag instead"],"a":2,"e":"XHTML empty elements must self-close: \u003cimg ... />.","s":"bank"},{"id":"b11-87","u":11,"q":"Your instructor asks you to change the background color of all paragraphs on your website. Which CSS selector should you use?","o":[".p {}","p:hover {}","#p {}","p {}"],"a":3,"e":"The element selector p {} targets all paragraphs.","s":"bank"},{"id":"b11-88","u":11,"q":"You want only the \u003cp> tags inside a specific \u003cdiv> with id=\"main\" to have red text. Which CSS selector should you use?","o":["div p { color: red; }","#main p { color: red; }",".main p { color: red; }","p#main { color: red; }"],"a":1,"e":"#main p = \u003cp> elements inside the element with id='main'.","s":"bank"},{"id":"b11-89","u":11,"q":"Your manager asked for a layout that adapts to screen sizes automatically. Which of the following CSS layout techniques is most appropriate?","o":["Tables","Flexbox or Grid","Static positioning","Fixed divs only"],"a":1,"e":"Flexbox and Grid build flexible, adaptive layouts.","s":"bank"},{"id":"b11-90","u":11,"q":"You are testing a new website on both desktop and mobile. You want the images to resize based on the screen size. Which HTML/CSS solution would you use?","o":["Fixed pixel sizes for images","Use \u003csvg> format only","Use media queries and percentage widths","Use only \u003ccanvas> tags"],"a":2,"e":"Percentage widths and media queries let images resize.","s":"bank"},{"id":"b11-91","u":11,"q":"Your team is building a form that collects user names, email addresses, and phone numbers. What HTML5 feature improves input validation without JavaScript?","o":["\u003cselect> dropdowns","\u003cform method=\"get\">","type=\"email\" and type=\"tel\" in \u003cinput>","Placeholder text in paragraphs"],"a":2,"e":"type='email' and type='tel' give built-in browser validation.","s":"bank"},{"id":"b11-92","u":11,"q":"The training coordinator wants a clear separation between each section of content. Which HTML5 semantic element should be used to wrap each logical section?","o":["\u003cdiv>","\u003csection>","\u003cp>","\u003caside>"],"a":1,"e":"\u003csection> wraps a logical section of content.","s":"bank"},{"id":"b11-93","u":11,"q":"You are building a job portal website. One of the users requests that the site should support screen readers and allow navigation using keyboard. What key principle is being requested?","o":["Flexibility","Accessibility","Robustness","Findability"],"a":1,"e":"Screen readers and keyboard navigation = accessibility.","s":"bank"},{"id":"b11-94","u":11,"q":"You are creating a website for your college. The homepage needs a section for navigation, main content, and a footer.\nWhich HTML5 structure best follows semantic conventions?","o":["\u003cdiv id=\"nav\"> \u003cdiv id=\"main\"> \u003cdiv id=\"footer\">","\u003cnav> \u003csection> \u003cfooter>","\u003cheader> \u003cbody> \u003cfooter>","\u003csection> \u003carticle> \u003caside>"],"a":1,"e":"\u003cnav>, \u003csection>, \u003cfooter> are the semantic elements for those parts.","s":"bank"},{"id":"b11-95","u":11,"q":"You created a table showing student grades, but your supervisor says it’s not accessible to screen readers.\nWhat should you add?","o":["\u003ccaption> and scope attributes in \u003cth>","\u003cb> tags for headers","Inline styles with background colors","\u003cfont> tags for readability"],"a":0,"e":"\u003ccaption> and scope make the table understandable to screen readers.","s":"bank"},{"id":"b11-96","u":11,"q":"A webpage uses both inline CSS and an external stylesheet. The external stylesheet sets \u003cp> text to blue, but one paragraph is manually styled with style=\"color: red\".\nWhat color will that paragraph appear as?","o":["Blue, because external stylesheets override inline styles","Red, because inline styles have higher specificity","Depends on browser settings","It won’t display any color"],"a":1,"e":"Inline styles beat external stylesheets, so the paragraph is red.","s":"bank"},{"id":"b11-97","u":11,"q":"A website looks perfect in Chrome but breaks in Internet Explorer.\nWhat should the developer do first?","o":["Remove all CSS animations","Validate the code using the W3C validator","Rewrite all HTML using \u003cdiv> tags only","Disable JavaScript"],"a":1,"e":"Validate first: invalid markup is a common cause of browser differences.","s":"bank"},{"id":"b11-98","u":11,"q":"Your manager asks why the company website looks too small on mobile phones.\nWhat CSS technique will best fix this issue?","o":["Set fixed pixel widths","Add \u003ctable> layouts","Use media queries to adjust layout for screen width","Use only inline CSS"],"a":2,"e":"Media queries adjust the layout to the screen width.","s":"bank"},{"id":"b11-99","u":11,"q":"While developing a new website for students, you find many users struggling to locate the “Apply Now” button.\nWhat is the best step to take?","o":["Make the button larger and place it in a consistent position","Remove the button and replace it with a text link","Reduce contrast to match the site colors","Add more animations to the page"],"a":0,"e":"A larger button in a consistent place is easier to find.","s":"bank"},{"id":"b11-100","u":11,"q":"A contact form allows users to submit feedback, but hackers started injecting scripts through the input fields.\nWhich security practice will prevent this?","o":["Use \u003ciframe> for forms","Add alt text to all form fields","Sanitize user inputs to remove malicious code","Use only GET requests"],"a":2,"e":"Sanitising inputs removes injected scripts.","s":"bank"},{"id":"b11-101","u":11,"q":"A client complains that their site does not appear in Google search results.\nWhat should you recommend first?","o":["Add meta tags, alt text, and keywords for SEO","Increase the image size for visibility","Use more \u003cbr> tags for spacing","Move the entire site to another domain"],"a":0,"e":"Meta tags, alt text and keywords help search engines find the site.","s":"bank"},{"id":"b11-102","u":11,"q":"A student developer uses many outdated \u003cfont> and \u003ccenter> tags in their website.\nWhich W3C standard principle are they violating?","o":["Accessibility","Use of semantic HTML","Security","Findability"],"a":1,"e":"\u003cfont> and \u003ccenter> are presentational; standards call for semantic HTML with CSS for styling.","s":"bank"},{"id":"b12-1","u":12,"q":"Your company wants to instantly share product updates with short messages that include hashtags and links to boost visibility. Which platform best suits this goal?","o":["Twitter","Facebook","LinkedIn","Pinterest"],"a":0,"e":"Twitter (X) is built for short, instant messages with hashtags and links.","s":"bank","k":82},{"id":"b12-2","u":12,"q":"A local café wants to build an online community, share photos, run ads, and engage with customers through comments and groups. Which platform should they focus on?","o":["LinkedIn","Facebook","Pinterest","Twitter"],"a":1,"e":"Facebook combines photos, groups, comments and ads for community building.","s":"bank","k":82},{"id":"b12-3","u":12,"q":"An HR manager wants to find experienced software developers and post professional job openings. Which social network is best for this?","o":["Facebook","Pinterest","Twitter","LinkedIn"],"a":3,"e":"LinkedIn is the professional network for recruiting and job posts.","s":"bank","k":82},{"id":"b12-4","u":12,"q":"A graphic designer wants to collect and share visual design inspirations, mood boards, and artwork with others in a creative field. Which platform is most appropriate?","o":["Pinterest","Facebook","Twitter","LinkedIn"],"a":0,"e":"Pinterest is for collecting and sharing visual inspiration on boards.","s":"bank","k":82},{"id":"b12-5","u":12,"q":"A travel enthusiast creates long posts detailing travel experiences, tips, and photos on a personal website updated weekly. What type of social media is this?","o":["Podcast","Blog","Video platform","Image sharing site"],"a":1,"e":"Regular long posts on a personal site = a blog.","s":"bank","k":83},{"id":"b12-6","u":12,"q":"A teacher records weekly discussions about digital marketing trends for students to listen to on Spotify. What form of media is being used?","o":["Video","Blog","Podcast","Social post"],"a":2,"e":"Recorded audio episodes on Spotify = a podcast.","s":"bank","k":83},{"id":"b12-7","u":12,"q":"A photographer uploads portfolios and nature shots to a platform where followers can like and share visual content. What media type does this represent?","o":["Video","Blog","Image","Podcast"],"a":2,"e":"Photo uploads that followers like and share = image media.","s":"bank","k":83},{"id":"b12-8","u":12,"q":"A marketing team publishes promotional clips and tutorials on YouTube to increase brand awareness. Which media format are they using?","o":["Audio","Blog","Image","Video"],"a":3,"e":"YouTube clips and tutorials = video.","s":"bank","k":83},{"id":"b12-9","u":12,"q":"A data analyst examines which influencers most effectively spread campaign messages across Instagram by tracking post shares and mentions. What process is being used?","o":["Sentiment analysis","Network analysis","Content curation","Audience targeting"],"a":1,"e":"Tracking how messages spread between users is network analysis.","s":"bank","k":84},{"id":"b12-10","u":12,"q":"To understand how news spreads online, a researcher maps how users share articles between groups. What is this mapping activity an example of?","o":["Content scheduling","Keyword tracking","Network analysis","Trend forecasting"],"a":2,"e":"Mapping who shares with whom is network analysis.","s":"bank","k":84},{"id":"b12-11","u":12,"q":"Your website allows users to click “Share on Facebook” to publish your site’s article directly on their feed. Which API function is being used?","o":["Pull data from Facebook","Post data to Facebook","Embed live video","Read user comments"],"a":1,"e":"'Share on Facebook' sends (posts) data to Facebook.","s":"bank","k":85},{"id":"b12-12","u":12,"q":"A “Tweet This” button on a webpage lets visitors automatically post a quote from your article to their Twitter account. What type of integration is this?","o":["Data pull API","Data push (post) API","Database connection","Web scraping"],"a":1,"e":"'Tweet This' pushes content to Twitter, a post/push integration.","s":"bank","k":85},{"id":"b12-13","u":12,"q":"A website shows the latest posts from a company’s LinkedIn page using an embedded API feed. Which operation is this?","o":["Posting information","Pulling and displaying information","Authenticating users","Uploading media"],"a":1,"e":"Showing LinkedIn posts on your site pulls data from the API.","s":"bank","k":85},{"id":"b12-14","u":12,"q":"You add a section on your homepage that displays your latest tweets automatically. Which API feature is used?","o":["Post information","Pull and display data","User login","Share via link"],"a":1,"e":"A live tweet feed pulls and displays data.","s":"bank","k":85},{"id":"b12-15","u":12,"q":"An e-commerce website shows customer reviews from Facebook pages in real time. This is achieved through what API function?","o":["Post data","Retrieve data","Store data","Upload file"],"a":1,"e":"Showing Facebook reviews means retrieving data from the API.","s":"bank","k":85},{"id":"b12-16","u":12,"q":"A university’s career page displays alumni LinkedIn profiles directly on its website. Which two concepts are combined here?","o":["Network analysis and podcasts","Social networking (LinkedIn) and API data pull","Facebook marketing and video sharing","Pinterest boards and data posting"],"a":1,"e":"LinkedIn (social networking) data is pulled through the API.","s":"bank","k":85},{"id":"b12-17","u":12,"q":"A blog site lets users post YouTube videos directly from its editor to their YouTube channel with one click. Which API action is taking place?","o":["Pulling information","Posting information","Sharing image data","Tracking views"],"a":1,"e":"Uploading from your editor to YouTube is posting information.","s":"bank","k":83},{"id":"b12-18","u":12,"q":"A company identifies top influencers in their campaign by measuring the number of retweets and mentions each user generates. What analytical method is applied?","o":["Social listening","Network analysis","SEO optimization","Trend monitoring"],"a":1,"e":"Counting retweets/mentions to find influencers is network analysis.","s":"bank","k":84},{"id":"b12-19","u":12,"q":"An artist’s website shows their latest Instagram images using the Instagram API. Which kind of media and API process is involved?","o":["Image media and data pull","Video media and data push","Blog content and data post","Podcast and data retrieval"],"a":0,"e":"Instagram images (image media) pulled into the site.","s":"bank","k":83},{"id":"b12-20","u":12,"q":"For a UI inspiration board with clickable references, which network style is most aligned?","o":["Facebook","LinkedIn","Twitter","Pinterest"],"a":3,"e":"Pinterest boards are built for visual inspiration with clickable pins.","s":"bank","c":1,"k":82},{"id":"b12-21","u":12,"q":"What is the main use of the \"Retweet\" feature?","o":["Messaging friends","Sharing others' content","Creating groups","Posting images"],"a":1,"e":"Retweet shares someone else's content with your followers.","s":"bank","k":82},{"id":"b12-22","u":12,"q":"Which platform is primarily used for professional networking?","o":["Instagram","LinkedIn","Pinterest","Facebook"],"a":1,"e":"LinkedIn is for professional networking.","s":"bank","k":82},{"id":"b12-23","u":12,"q":"In Facebook, what feature enables organizing promotional activities?","o":["News Feed","Messenger","Events","Reactions"],"a":2,"e":"Facebook Events organise and promote activities.","s":"bank","k":82},{"id":"b12-24","u":12,"q":"What does the acronym \"API\" stand for in web technologies?","o":["Automated Personal Interaction","Application Programming Interface","Applied Program Integration","Advanced Protocol Internet"],"a":1,"e":"API = Application Programming Interface.","s":"bank","k":85},{"id":"b12-25","u":12,"q":"Which is an example of a blog platform?","o":["WordPress","Twitter","LinkedIn","Facebook"],"a":0,"e":"WordPress is a blogging platform/CMS.","s":"bank","k":82},{"id":"b12-26","u":12,"q":"Which protocol is commonly used for securing API authentication?","o":["RSS","OAuth 2.0","SMTP","XML"],"a":1,"e":"OAuth 2.0 is the standard for secure API authorisation.","s":"bank","k":85},{"id":"b12-27","u":12,"q":"What is the function of a hashtag on social platforms?","o":["Register an account","Organize topics and facilitate discovery","Increase followers","Send direct messages"],"a":1,"e":"Hashtags group posts by topic so people can discover them.","s":"bank"},{"id":"b12-28","u":12,"q":"Which type of markup is required for structuring web pages?","o":["Markdown","HTML","Python","SQL"],"a":1,"e":"HTML structures web pages.","s":"bank","k":86},{"id":"b12-29","u":12,"q":"Which tool is used for visual network analysis?","o":["NodeXL","Adobe Photoshop","Microsoft Word","Instagram"],"a":0,"e":"NodeXL draws and analyses social network graphs.","s":"bank","k":84},{"id":"b12-30","u":12,"q":"What is the purpose of CSS in web development?","o":["Storing data","Styling and layout of web pages","User authentication","Data analysis"],"a":1,"e":"CSS handles styling and layout.","s":"bank","k":86},{"id":"b12-31","u":12,"q":"Which is NOT a common element in a blog?","o":["Chronological Posts","Categories","News Feed","Comments Section"],"a":2,"e":"A news feed belongs to social networks, not blogs.","s":"bank","k":85},{"id":"b12-32","u":12,"q":"What is required to post content from your site to Twitter using its API?","o":["API keys and OAuth authentication","HTML code","RSS Feed","CSS file"],"a":0,"e":"Posting through Twitter's API needs API keys and OAuth.","s":"bank","k":85},{"id":"b12-33","u":12,"q":"Which file format is NOT typically used for images on social media?","o":["JPEG","GIF","PDF","PNG"],"a":2,"e":"PDF is a document format, not a social media image format.","s":"bank","k":83},{"id":"b12-34","u":12,"q":"What feature in LinkedIn allows users to validate each other's skills?","o":["Groups","Endorsements","Messaging","Posts"],"a":1,"e":"LinkedIn Endorsements let connections vouch for skills.","s":"bank","k":82},{"id":"b12-35","u":12,"q":"What is a key requirement for XHTML documents?","o":["All tags must be lowercase and properly nested","Use of hashtags","Responsive design","Unlimited character count"],"a":0,"e":"XHTML: lowercase tags, properly nested and closed.","s":"bank","k":86},{"id":"b12-36","u":12,"q":"What kind of API req },{"id":"b12-76","u":12,"q":"A data analyst wants to identify tightly connected groups within a LinkedIn follower graph. Which network analysis method is MOST appropriate?","o":["Measuring shortest paths","Community detection (clustering)","Calculating edge weights","Computing global density"],"a":1,"e":"Community detection (clustering) finds tightly connected groups.","s":"bank","k":84},{"id":"b13-1","u":13,"q":"Which of the following best describes a Java Servlet?","o":["A client-side script that runs in the browser","A server-side program that extends the functionality of a web server","A database query language","A style sheet processor"],"a":1,"e":"A servlet is Java code that runs on the server and extends what the web server can do.","s":"bank","k":87},{"id":"b13-2","u":13,"q":"In PHP, the $_GET superglobal array is mainly used to:","o":["Send data to the database","Retrieve data from a submitted form using the POST method","Retrieve data sent through the URL query string","Store session data"],"a":2,"e":"$_GET reads values from the URL query string (?name=value).","s":"bank","k":87},{"id":"b13-3","u":13,"q":"Which of the following PHP statements is used to include another file in your script?","o":["load()","require()","readfile()","insert()"],"a":1,"e":"require() (and include()) pull another PHP file into the script.","s":"bank","k":87},{"id":"b13-4","u":13,"q":"In JavaScript, what will document.getElementById(\"demo\").innerHTML = \"Hello\"; do?","o":["Create a new HTML element","Insert \"Hello\" into an element with the ID demo","Remove an element from the page","Display an alert message"],"a":1,"e":"innerHTML replaces the content of the element whose id is 'demo'.","s":"bank","k":88},{"id":"b13-5","u":13,"q":"Which of the following is a correct way to declare a JavaScript variable?","o":["variable x = 5;","int x = 5;","let x = 5;","define x = 5;"],"a":2,"e":"JavaScript declares variables with let, const or var. 'int' is Java/C.","s":"bank","k":88},{"id":"b13-6","u":13,"q":"What is the purpose of the addEventListener() method in JavaScript?","o":["It creates a new event loop","It adds a CSS style dynamically","It registers an event handler for a specific event","It validates form inputs automatically"],"a":2,"e":"addEventListener() attaches a handler that runs when the event fires.","s":"bank","k":88},{"id":"b13-7","u":13,"q":"What is the output of typeof 10 in JavaScript?","o":["integer","number","string","float"],"a":1,"e":"JavaScript has one numeric type, so typeof 10 is 'number'.","s":"bank","k":88},{"id":"b13-8","u":13,"q":"What is a cookie in web development?","o":["A temporary file stored on the server","A small text file stored on the client’s computer","A type of database","A browser cache"],"a":1,"e":"A cookie is a small text file stored by the browser on the client.","s":"bank","k":89},{"id":"b13-9","u":13,"q":"Which of the following is a security concern when using cookies?","o":["They cannot be used by multiple domains","They are automatically encrypted","They can be read or modified by unauthorized users if not protected","They expire after one second"],"a":2,"e":"Unprotected cookies can be stolen or altered.","s":"bank","k":89},{"id":"b13-10","u":13,"q":"What is the primary goal of authentication?","o":["To determine what a user can access","To verify a user’s identity","To store user information","To encrypt sensitive data"],"a":1,"e":"Authentication verifies who you are; authorisation decides what you can access.","s":"bank","k":90},{"id":"b13-11","u":13,"q":"In web applications, which of the following is a common method of authentication?","o":["CAPTCHA verification","Username and password","Session timeout","Cookie expiration"],"a":1,"e":"Username + password is the most common authentication method.","s":"bank","k":90},{"id":"b13-12","u":13,"q":"Which statement best defines stateless programming?","o":["Each client request is handled independently without remembering previous interactions","The server keeps all previous user data","Data is stored in memory across sessions","Each page maintains user session automatically"],"a":0,"e":"Stateless = each request stands alone; the server remembers nothing between them.","s":"bank","k":91},{"id":"b13-13","u":13,"q":"Which protocol is inherently stateless?","o":["FTP","HTTP","SMTP","HTTPS"],"a":1,"e":"HTTP is stateless by design.","s":"bank","k":91},{"id":"b13-14","u":13,"q":"In a stateless system, how can state be maintained between requests?","o":["By using cookies or sessions","By storing data in RAM","By caching pages","By reloading the browser"],"a":0,"e":"Cookies and sessions add state on top of stateless HTTP.","s":"bank","k":91},{"id":"b13-15","u":13,"q":"What is the main characteristic of stateful programming?","o":["The server does not retain any client data","The server maintains the state of each client session","Each request is treated independently","It uses cookies to clear session data"],"a":1,"e":"Stateful = the server keeps each client's session state.","s":"bank","k":91},{"id":"b13-16","u":13,"q":"A web developer builds a Java Servlet that retrieves customer data from a database. Users report that the data from one request sometimes appears in another user’s session.\nWhat is the most likely cause?","o":["The servlet uses doPost() instead of doGet()","A class variable (instance field) is being used to store user data","The servlet is not using HTTPS","The database connection is not closed properly"],"a":1,"e":"Servlet instance fields are shared by all requests, so user data leaks between users. Use local variables or the session.","s":"bank","k":87},{"id":"b13-17","u":13,"q":"A PHP developer wants to prevent direct URL access to a dashboard page unless a user is logged in. Which method is most secure?","o":["Hide the dashboard link on the homepage","Store a variable in JavaScript after login","Check a session variable in every page that requires authentication","Use HTML form validation to block access"],"a":2,"e":"Check the session on the server for every protected page; hiding links or JS checks can be bypassed.","s":"bank","k":90},{"id":"b13-18","u":13,"q":"A web form dynamically validates email addresses as the user types.\nWhich feature of JavaScript enables this without refreshing the page?","o":["Server-side scripting","Asynchronous event handling","CSS transitions","Inline form attributes"],"a":1,"e":"Event handlers (e.g. oninput) run asynchronously as the user types, with no page reload.","s":"bank","k":88},{"id":"b13-19","u":13,"q":"A developer finds that a cookie set from https://bank.com is not being sent to http://bank.com. Why?","o":["Cookies can’t be sent over HTTP","The Secure flag prevents transmission over HTTP","Domain names don’t match","Cookies expire automatically"],"a":1,"e":"A cookie marked Secure is only sent over HTTPS, so http://bank.com never receives it.","s":"bank","k":89},{"id":"b13-20","u":13,"q":"Which of the following best describes multi-factor authentication (MFA)?","o":["Two usernames for extra verification","Combining password with another proof like OTP or fingerprint","Password entered twice","Encrypting the password twice"],"a":1,"e":"MFA combines something you know (password) with something you have/are (OTP, fingerprint).","s":"bank","k":90},{"id":"b13-21","u":13,"q":"The college web app must process form data and store it in the server database. Which type of scripting handles this task?","o":["Client-side scripting","Styling scripts","Server-side scripting","Database triggers"],"a":2,"e":"Processing and storing form data on the server is server-side scripting.","s":"bank","k":87},{"id":"b13-22","u":13,"q":"When a user fills out a feedback form and clicks Submit, which layer of the web architecture processes the data first?","o":["Client browser","Server-side script (e.g., PHP/Servlet)","Database","Web server hardware"],"a":1,"e":"The server-side script (PHP/Servlet) receives and processes submitted data before it reaches the database.","s":"bank","f":"Wording 'first' is ambiguous: the browser handles the submit before the server.","k":87},{"id":"b13-23","u":13,"q":"To dynamically validate input before submission, which type of script is most suitable?","o":["Server-side script","SQL query","Client-side script (JavaScript)","Backend batch job"],"a":2,"e":"Client-side JavaScript can check input before it is sent.","s":"bank","k":88},{"id":"b13-24","u":13,"q":"A student website displays an alert when the user leaves a required field empty. Which scripting language is responsible?","o":["PHP","SQL","Python","JavaScript"],"a":3,"e":"Browser alerts for empty fields come from JavaScript.","s":"bank","k":88},{"id":"b13-25","u":13,"q":"The app must hide the database password from the client. Where should it be stored?","o":["Server-side PHP/Servlet file","Client JavaScript file","CSS file","Browser cache"],"a":0,"e":"Secrets stay in server-side code; anything sent to the client can be read.","s":"bank","k":87},{"id":"b13-26","u":13,"q":"The IT department wants a page that updates automatically without reloading. Which technology achieves this?","o":["HTML5","AJAX","CSS3","ODBC"],"a":1,"e":"AJAX fetches data in the background and updates the page without reloading.","s":"bank","k":88},{"id":"b13-27","u":13,"q":"A developer uses the 'POST' method instead of 'GET' when sending login data. Why?","o":["POST works only in HTML5","POST loads faster","POST caches automatically","POST hides sensitive data from the URL"],"a":3,"e":"POST sends data in the request body, not the URL.","s":"bank","k":90},{"id":"b13-28","u":13,"q":"In a web app, the server sends back JSON data to the browser without refreshing. Which approach is used?","o":["HTML form submit","AJAX request","FTP upload","Static HTML"],"a":1,"e":"Getting JSON from the server without a reload is an AJAX request.","s":"bank","k":88},{"id":"b13-29","u":13,"q":"What ensures user input from a web form is validated before reaching the data  or session variables","AJAX polling"],"a":2,"e":"Cookies or session variables carry login state between pages.","s":"bank","k":89},{"id":"b13-37","u":13,"q":"A session ID is stored on the client to maintain login state. Where is it usually saved?","o":["XML file","Local storage","Database","Cookie"],"a":3,"e":"The session ID is normally kept in a cookie.","s":"bank","k":89},{"id":"b13-38","u":13,"q":"When should a session be destroyed?","o":["After login","After every request","After logout or timeout","Never"],"a":2,"e":"Destroy the session on logout or after a timeout.","s":"bank","k":91},{"id":"b13-39","u":13,"q":"The web app must ensure that if a user is inactive for 15 minutes, they are logged out automatically. Which technique handles this?","o":["Auto-refresh","Session timeout","Cookie injection","Cache clearing"],"a":1,"e":"A session timeout logs out inactive users.","s":"bank","k":91},{"id":"b13-40","u":13,"q":"If a student logs in and another opens the site on the same computer, why shouldn’t they access the first session?","o":["AJAX blocks reuse","Cookies are shared globally","PHP caches all sessions","Each session ID is unique per user"],"a":3,"e":"Each user gets a unique session ID, so sessions are separate.","s":"bank","k":91},{"id":"b13-41","u":13,"q":"The ITC admin panel requires both username and password verification. What kind of system is this?","o":["Authentication system","Validation system","Session tracker","AJAX handler"],"a":0,"e":"Checking username and password is authentication.","s":"bank","k":90},{"id":"b13-42","u":13,"q":"Why should passwords not be stored in plain text in a database?","o":["To save memory","To make login slower","To prevent data breaches if accessed","To reduce bandwidth"],"a":2,"e":"Plain-text passwords are exposed instantly if the database is breached; store hashes.","s":"bank","k":90},{"id":"b13-43","u":13,"q":"To securely verify passwords, which function should be used in PHP?","o":["password_verify()","md5()"," r accounts. Which concept is being applied here?","o":["Stateless communication","Authentication","Caching","Load balancing"],"a":1,"e":"Password plus one-time code = (multi-factor) authentication.","s":"bank","k":90},{"id":"b13-62","u":13,"q":"A company intranet allows only employees with valid credentials to access internal documents. What is this process of verifying their identity called?","o":["Encryption","Authentication","Compression","Logging"],"a":1,"e":"Verifying identity is authentication.","s":"bank","k":90},{"id":"b13-63","u":13,"q":"A developer wants to improve security for a login system that uses cookies to maintain sessions. Which practice is most appropriate?","o":["Storing plaintext passwords in cookies","Using HTTPOnly and Secure cookie attributes","Embedding session IDs in all URLs","Disabling HTTPS to reduce overhead"],"a":1,"e":"HttpOnly blocks JavaScript access; Secure forces HTTPS.","s":"bank","k":90},{"id":"b13-64","u":13,"q":"A web app lets users remain logged in for several days using a “Remember me” checkbox. Which combination is typically used to implement this securely?","o":["Plain text cookies without expiry","HTTP GET parameters only","Cookies plus server-side session or token validation","CSS-only configuration"],"a":2,"e":"A long-lived cookie holds a token that the server validates.","s":"bank","k":87},{"id":"b13-65","u":13,"q":"An API is designed so that each HTTP request from a mobile app includes all information needed to process it, and the server does not store any previous conversation state. Which principle does this describe?","o":["Stateful programming","Stateless programming","Synchronous processing","Client caching"],"a":1,"e":"Each request carries everything needed: stateless.","s":"bank","k":91},{"id":"b13-66","u":13,"q":"A developer is building a RESTful web service where every request must include authentication data because the server does not remember previous requests. What design approach is being followed?","o":["Monolithic stateful design","Stateless design","Server session storage","Cookie-based persistent login"],"a":1,"e":"REST services are stateless, so every request carries authentication.","s":"bank","k":91},{"id":"b13-67","u":13,"q":"A social media site stores user session data on the server so that it can show each user’s personalized feed whenever they refresh the page. Which type of programming model is this?","o":["Stateless programming","Functional programming","Stateful programming","Event-driven hardware programming"],"a":2,"e":"Keeping session data on the server is stateful.","s":"bank","k":91},{"id":"b13-68","u":13,"q":"A shopping website keeps track of each user’s cart contents on the server between different requests. What does this behavior illustrate?","o":["Stateless architecture","Stateful session management","Static site generation","DNS caching"],"a":1,"e":"Tracking the cart on the server between requests is stateful session management.","s":"bank","k":91},{"id":"b14-1","u":14,"q":"What is the purpose of identifying password protection requirements?","o":["To secure systems from unauthorized access","To increase internet speed","To improve performance","To reduce storage"],"a":0,"e":"Password requirements exist to stop unauthorised access.","s":"bank"},{"id":"b14-2","u":14,"q":"Which solution best meets strong password requirements?","o":["Short passwords","Reusing passwords","Complex passwords with symbols","Writing passwords down"],"a":2,"e":"Long, complex passwords with symbols resist guessing and brute force.","s":"bank"},{"id":"b14-3","u":14,"q":"Why is creating a security policy important?","o":["To decorate documents","To define security rules and procedures","To increase memory","To reduce internet usage"],"a":1,"e":"A security policy sets the rules and procedures everyone must follow.","s":"bank"},{"id":"b14-4","u":14,"q":"What is the benefit of password history?","o":["Prevent reuse","Increase storage","Improve speed","Reduce login time"],"a":0,"e":"Password history stops users re-using recent passwords.","s":"bank"},{"id":"b14-5","u":14,"q":"How can passwords be non-traceable?","o":["Use password manager","Use names","Reuse passwords","Write them down"],"a":0,"e":"A password manager generates random, unrelated passwords that can't be traced to personal details.","s":"bank"},{"id":"b14-6","u":14,"q":"What is the role of a firewall?","o":["Store files","Control network traffic","Install apps","Backup data"],"a":1,"e":"A firewall filters (allows/blocks) network traffic.","s":"bank","k":92},{"id":"b14-7","u":14,"q":"Why is antivirus important?","o":["Improve battery","Protect against malware","Increase speed","Organize data"],"a":1,"e":"Antivirus detects and removes malware.","s":"bank","k":96},{"id":"b14-8","u":14,"q":"What is the most secure approach for server login credentials?","o":["Use default passwords","Share credentials","Use simple passwords","Use strong unique passwords and change them regularly"],"a":3,"e":"Server credentials should be strong, unique and changed regularly; never defaults.","s":"bank"},{"id":"b14-9","u":14,"q":"What is the purpose of role-based access control (RBAC)?","o":["Give all users equal access","Assign permissions based on job roles","Remove access","Increase speed"],"a":1,"e":"RBAC grants permissions according to job role (least privilege).","s":"bank"},{"id":"b14-10","u":14,"q":"What is a key function of server firewalls?","o":["Store files","Manage users","Control network traffic","Improve graphics"],"a":2,"e":"Server firewalls control which traffic may reach the server.","s":"bank","k":92},{"id":"b14-11","u":14,"q":"What is the first step in determining password protection requirements?","o":["Installing antivirus","Identifying risks and system needs","Sharing passwords","Disabling login controls"],"a":1,"e":"Start by identifying risks and what the system needs.","s":"bank","k":96},{"id":"b14-12","u":14,"q":"What makes a password policy effective?","o":["Allowing simple passwords","No expiration rules","Enforcing complexity and updates","Letting users decide freely"],"a":2,"e":"Effective policies enforce complexity and regular change.","s":"bank"},{"id":"b14-13","u":14,"q":"What is the difference between firewall and antivirus?","o":["Same function","Firewall scans files","Antivirus detects malware, firewall controls traffic","Firewall works offline"],"a":2,"e":"Antivirus finds malicious files; a firewall controls network traffic.","s":"bank","k":96},{"id":"b14-14","u":14,"q":"What is good password practice?","o":["Simple passwords","Share passwords","Complex unique passwords","Reuse passwords"],"a":2,"e":"Use complex, unique passwords.","s":"bank"},{"id":"b14-15","u":14,"q":"What is the benefit of a firewall?","o":["Increase storage","Control traffic","Improve graphics","Organize files"],"a":1,"e":"A firewall controls traffic in and out.","s":"bank","k":92},{"id":"b14-16","u":14,"q":"What should administrators do to maintain server security?","o":["Ignore updates","Disable antivirus","Avoid monitoring","Regularly update and scan systems"],"a":3,"e":"Keep servers patched and scanned.","s":"bank","k":96},{"id":"b14-17","u":14,"q":"What is the main benefit of monitoring server logs?","o":["Improve storage","Detect unusual activities","Increase speed","Organize files"],"a":1,"e":"Logs reveal unusual or suspicious activity.","s":"bank"},{"id":"b14-18","u":14,"q":"What is the best response to a suspected security breach?","o":["Ignore it","Investigate and take immediate action","Restart system","Disable firewall"],"a":1,"e":"Investigate and act immediately to contain a breach.","s":"bank","k":92},{"id":"b14-19","u":14,"q":"How can users maintain password security?","o":["Never change","Share passwords","Update regularly","Use simple passwords"],"a":2,"e":"Change passwords regularly.","s":"bank"},{"id":"b14-20","u":14,"q":"What should be considered when identifying password requirements?","o":["System risks and user roles","Screen size","File names","Printer type"],"a":0,"e":"Requirements depend on system risks and user roles.","s":"bank"},{"id":"b14-21","u":14,"q":"What is the main role of a firewall?","o":["To control incoming and outgoing network traffic","To store backup files","To speed up browsing","To format hard drives"],"a":0,"e":"Firewalls control incoming and outgoing traffic.","s":"bank","k":92},{"id":"b14-22","u":14,"q":"Which firewall type tracks active connections and uses context to make decisions?","o":["Packet-filtering firewall","Stateful inspection firewall","Proxy firewall","Hardware firewall"],"a":1,"e":"Stateful inspection firewalls track connection state and context.","s":"bank","k":92},{"id":"b14-23","u":14,"q":"What does an HTTP server do?","o":["It processes and responds to client web requests","It deletes viruses automatically","It encrypts email messages","It blocks all internet traffic"],"a":0,"e":"An HTTP server receives web requests and sends responses.","s":"bank","k":93},{"id":"b14-24","u":14,"q":"Which of the following is a common use of HTTP servers?","o":["Hosting websites and web applications","Preventing malware spread","Scanning Wi-Fi signals","Managing printer queues only"],"a":0,"e":"HTTP servers host websites and web apps.","s":"bank","k":93},{"id":"b14-25","u":14,"q":"What happens during the SSL/TLS handshake?","o":["Devices agree on secure communication settings","Files are permanently deleted","Passwords are removed from browsers","The server shuts down access"],"a":0,"e":"In the handshake, client and server agree on cipher, verify certificates and exchange keys.","s":"bank","k":94},{"id":"b14-26","u":14,"q":"Which protocol replaced SSL as the more secure modern standard?","o":["FTP","TLS","HTTP","DNS"],"a":1,"e":"TLS succeeded SSL.","s":"bank","k":94},{"id":"b14-27","u":14,"q":"What is the main goal of email security?","o":["To protect email accounts, content, and communication from threats","To make messages shorter","To increase inbox size","To stop all attachments permanently"],"a":0,"e":"Email security protects accounts, contents and communication.","s":"bank","k":95},{"id":"b14-28","u":14,"q":"What is phishing?","o":["A fraudulent email or message that tricks users into giving sensitive information","A type of firewall rule","A browser update","A file compression method"],"a":0,"e":"Phishing tricks people into revealing sensitive information.","s":"bank","k":95},{"id":"b14-29","u":14,"q":"What is malware?","o":["Software designed to damage, disrupt, or steal information","A secure messaging tool","A web hosting service","A password manager"],"a":0,"e":"Malware is software designed to damage, disrupt or steal.","s":"bank","k":96},{"id":"b14-30","u":14,"q":"What is the main purpose of ransomware?","o":["To encrypt files and demand payment for decryption","To improve system speed","To protect email signatures","To block Wi-Fi signals"],"a":0,"e":"Ransomware encrypts files and demands payment.","s":"bank","k":96},{"id":"b14-31","u":14,"q":"What is the risk of weak password requirements?","o":["Faster performance","Easier unauthorized access","Reduced storage","Better usability"],"a":1,"e":"Weak passwords make unauthorised access easier.","s":"bank"},{"id":"b14-32","u":14,"q":"What is the role of password protection solutions?","o":["Improve speed","Reduce memory usage","Protect access to systems and data","Organize files"],"a":2,"e":"Password solutions protect access to systems and data.","s":"bank"},{"id":"b14-33","u":14,"q":"What is the purpose of maintaining a security policy?","o":["Improve graphics","Define and enforce security practices","Store passwords","Reduce cost"],"a":1,"e":"Maintaining the policy keeps security practices defined and enforced.","s":"bank"},{"id":"b14-34","u":14,"q":"What should be included in a security policy?","o":["Entertainment rules","Hardware list","Security procedures and responsibilities","Employee birthdays"],"a":2,"e":"Policies include procedures and who is responsible for what.","s":"bank"},{"id":"b14-35","u":14,"q":"What should you do when malware is detected?","o":["Remove it","Ignore it","Disable antivirus","Restart only"],"a":0,"e":"Detected malware should be quarantined/removed.","s":"bank","k":96},{"id":"b14-37","u":14,"q":"What is the safest way to protect internet communication?","o":["Use encryption protocols","Use plain text","Disable security","Share data publicly"],"a":0,"e":"Encryption protocols (TLS, HTTPS) protect data in transit.","s":"bank"},{"id":"b14-38","u":14,"q":"What is the purpose of securing shared network resources?","o":["Increase speed","Allow public access","Prevent unauthorized access","Reduce memory"],"a":2,"e":"Securing shared resources prevents unauthorised access.","s":"bank"},{"id":"b14-39","u":14,"q":"Why is authentication important for shared resources?","o":["Improve graphics","Verify user identity","Reduce storage","Increase speed"],"a":1,"e":"Authentication verifies who is using the shared resource.","s":"bank"},{"id":"b14-40","u":14,"q":"What happens if protocols are not secured?","o":["Faster system","Data can be intercepted","Better design","Improved storage"],"a":1,"e":"Unsecured protocols send data that can be intercepted.","s":"bank"},{"id":"b14-41","u":14,"q":"Why enforce password expiration?","o":["Increase workload","Improve design","Reduce storage","Limit exposure"],"a":3,"e":"Expiry limits how long a stolen password stays useful.","s":"bank"},{"id":"b14-42","u":14,"q":"Which password solution provides the highest level of security?","o":["Reusing passwords","Short passwords","Writing passwords down","Multi-factor authentication"],"a":3,"e":"MFA adds a second factor, giving the strongest protection listed.","s":"bank"},{"id":"b14-43","u":14,"q":"What is the best method to ensure compliance with a security policy?","o":["Ignore updates","Train users and enforce rules","Allow personal decisions","Remove restrictions"],"a":1,"e":"Train users and enforce the rules.","s":"bank"},
