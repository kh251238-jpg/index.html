<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ITUSD Exam Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: test-centre console. Steel chrome bar on top, workspace card below; unit "blueprint" rail on the dashboard. */
:root{
  --bg:#eef1f5; --panel:#ffffff; --chrome:#1f3349; --chrome-fg:#e8eef5;
  --fg:#18222e; --muted:#5b6878; --line:#d5dbe3; --soft:#f5f7fa;
  --accent:#2563a8; --accent-soft:#e3edf8; --flag:#c98a0b; --flag-soft:#fbf1dc;
  --good:#1d7a4c; --good-soft:#e2f3ea; --bad:#b93a32; --bad-soft:#fbe7e5; --draft:#7a4fb0;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --panel:#18212b; --chrome:#0a1017; --chrome-fg:#d8e2ec;
  --fg:#e3e9ef; --muted:#93a1b1; --line:#2b3746; --soft:#1e2833;
  --accent:#6ea8e8; --accent-soft:#1c2f45; --flag:#e3a93a; --flag-soft:#3a2f17;
  --good:#4fbf86; --good-soft:#163628; --bad:#ec7a70; --bad-soft:#3d1d1b; --draft:#b38ce6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151c; --panel:#18212b; --chrome:#0a1017; --chrome-fg:#d8e2ec;
  --fg:#e3e9ef; --muted:#93a1b1; --line:#2b3746; --soft:#1e2833;
  --accent:#6ea8e8; --accent-soft:#1c2f45; --flag:#e3a93a; --flag-soft:#3a2f17;
  --good:#4fbf86; --good-soft:#163628; --bad:#ec7a70; --bad-soft:#3d1d1b; --draft:#b38ce6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--chrome)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--chrome);color:var(--chrome-fg);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.15rem;letter-spacing:.02em;cursor:pointer;background:none;border:0;color:inherit;padding:0}
.brand small{font-weight:500;opacity:.7;margin-left:8px;font-size:.85rem}
.bar .sp{flex:1}
.timer{font-family:var(--f-mono);font-weight:700;font-size:1.05rem;padding:4px 10px;border-radius:4px;background:rgba(255,255,255,.08);font-variant-numeric:tabular-nums}
.timer.low{background:var(--bad);color:#fff}
main{max-width:1100px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2rem;font-weight:700}
h2{font-size:1.35rem;font-weight:600}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:.78rem;font-weight:600;color:var(--muted)}
.panel>*{min-width:0}
.kf{margin-top:6px;font-size:.9rem}
.kf summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.85rem}
.kf ul{margin:6px 0 2px;padding-left:18px;display:grid;gap:4px}
.week{border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:8px;background:var(--panel)}
.week.now{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.week.past{opacity:.75}
.week.brk{background:var(--soft);border-style:dashed}
.task{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:6px 0;border-top:1px dashed var(--line)}
.task label{flex:1;min-width:180px;display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.task .task-done{text-decoration:line-through;color:var(--muted)}
.banner{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:14px 18px}
details summary{list-style-position:outside}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.mode{display:grid;gap:6px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;cursor:pointer;color:var(--fg);font:inherit}
.mode:hover{border-color:var(--accent)}
.mode:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mode .t{font-family:var(--f-display);font-size:1.15rem;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mode .t span{font-family:var(--f-mono);font-size:.8rem;color:var(--accent);font-weight:500}
.mode.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.mode.primary .t span,.mode.primary .muted{color:rgba(255,255,255,.85)}
:root[data-theme="dark"] .mode.primary,.dk .mode.primary{color:#0f151c}
.btn{font:inherit;font-weight:600;border-radius:6px;padding:9px 16px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn.flag.on{background:var(--flag-soft);border-color:var(--flag);color:var(--flag)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* blueprint */
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-family:var(--f-display);font-weight:600;font-size:.82rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.n{text-align:right;font-family:var(--f-mono);font-size:.88rem}
.meter{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;min-width:80px;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--accent)}
.meter i.g{background:var(--good)} .meter i.w{background:var(--flag)} .meter i.b{background:var(--bad)}
.chip{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap;font-family:var(--f-body)}
.chip.draft{color:var(--draft)} .chip.booklet{color:var(--good)} .chip.sample{color:var(--accent)} .chip.fix{color:var(--good)} .chip.warn{color:var(--flag)} .chip.none{color:var(--muted)}
/* exam */
.exam{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px;align-items:start}
@media (max-width:820px){.exam{grid-template-columns:minmax(0,1fr)}}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:16px}
.qnum{font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.qtext{font-size:1.12rem;font-weight:500;white-space:pre-wrap;margin-bottom:18px;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:11px 14px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt .l{font-family:var(--f-mono);font-weight:700;width:26px;height:26px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;font-size:.85rem}
.opt .x{min-width:0;overflow-wrap:anywhere;white-space:pre-wrap;padding-top:1px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:var(--panel);border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-soft)} .opt.ok .l{background:var(--good);border-color:var(--good);color:var(--panel)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)} .opt.no .l{background:var(--bad);border-color:var(--bad);color:var(--panel)}
.opt:disabled{cursor:default}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:6px}
.nav button{font-family:var(--f-mono);font-size:.8rem;height:34px;border-radius:4px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;position:relative;padding:0}
.nav button.a{background:var(--accent-soft);border-color:var(--accent)}
.nav button.cur{outline:2px solid var(--fg);outline-offset:1px}
.nav button.f::after{content:"";position:absolute;top:2px;right:2px;width:7px;height:7px;border-radius:50%;background:var(--flag)}
.nav button.ok{background:var(--good-soft);border-color:var(--good)} .nav button.no{background:var(--bad-soft);border-color:var(--bad)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin-right:4px}
.feedback{margin-top:16px;border-radius:6px;padding:14px 16px;border:1px solid var(--line);background:var(--soft)}
.feedback.ok{border-color:var(--good)} .feedback.no{border-color:var(--bad)}
.feedback b{font-family:var(--f-display);font-size:1.05rem}
.conf{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;font-size:.92rem}
.conf button{font:inherit;font-size:.88rem;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.conf button.on{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.score{font-family:var(--f-display);font-weight:700;font-size:3.4rem;line-height:1}
.kv{display:flex;gap:28px;flex-wrap:wrap}
.kv div{display:grid}
.kv b{font-family:var(--f-mono);font-size:1.3rem;font-variant-numeric:tabular-nums}
.review-item{border-top:1px solid var(--line);padding-block:14px;display:grid;gap:8px}
.review-item .opt{padding:7px 12px}
.svgbox{overflow-x:auto;margin-bottom:16px;border:1px solid var(--line);border-radius:6px;background:var(--soft);padding:10px}
.modal{position:fixed;inset:0;background:rgba(10,16,23,.55);display:grid;place-items:center;z-index:20;padding:16px}
.modal .panel{max-width:440px;width:100%;display:grid;gap:14px}
textarea{width:100%;min-height:90px;font-family:var(--f-mono);font-size:.75rem;background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px}
select,input[type=number]{font:inherit;padding:7px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
label.ck{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.kbd{font-family:var(--f-mono);font-size:.75rem;border:1px solid var(--line);border-radius:3px;padding:0 4px;background:var(--soft)}
.hint{font-size:.85rem;color:var(--muted)}
@media (max-width:520px){h1{font-size:1.6rem}.score{font-size:2.6rem}.panel{padding:16px}}
@media (prefers-reduced-motion:no-preference){.opt,.mode,.btn{transition:border-color .12s,background .12s}}
</style>

<script>
const BANK = [{"id":"b6-1","u":6,"q":"Which of the following is NOT a QA activity?","o":["Code reviews","Process audits","Regression testing","Standards compliance check"],"a":2,"e":"QA is about preventing defects through process (reviews, audits, standards checks). Regression testing finds defects in the product, so it is classed as QC/testing.","s":"bank","f":"QA vs QC boundary is debatable; some textbooks list regression testing under QA."},{"id":"b6-2","u":6,"q":"The WAI is a part of which organization?","o":["ISO","W3C","IEEE","CMMI"],"a":1,"e":"The Web Accessibility Initiative (WAI) is run by the World Wide Web Consortium (W3C).","s":"bank","k":43},{"id":"b6-3","u":6,"q":"WCAG guidelines are organized under which four principles?","o":["Accurate, Reliable, Testable, Secure","Portable, Flexible, Usable, Interactive","Perceivable, Operable, Understandable, Robust (POUR)","Accessible, Navigable, Visible, Efficient"],"a":2,"e":"WCAG is built on four principles, remembered as POUR: Perceivable, Operable, Understandable, Robust.","s":"bank","k":43},{"id":"b6-4","u":6,"q":"What is the main goal of user testing in software QA?","o":["To identify bugs in source code","To measure system performance under load","To evaluate usability and user satisfaction","To ensure software compiles correctly"],"a":2,"e":"User testing watches real users complete tasks to judge usability and satisfaction, not code correctness or load.","s":"bank","k":42},{"id":"b6-5","u":6,"q":"Which is an example of equity in digital systems?","o":["Offering multiple language support","Limiting system access to a single region","Removing screen reader support","Enforcing a single login method"],"a":0,"e":"Equity means everyone gets fair access. Supporting several languages removes a barrier for non-native speakers.","s":"bank","k":41},{"id":"b6-6","u":6,"q":"Why is it important to provide a text equivalent (alt text) for non-text elements such as images?","o":["To reduce file size","To make content accessible to screen readers","To improve page loading speed","To enhance visual appeal"],"a":1,"e":"Screen readers cannot 'see' images; alt text gives them words to read aloud, making the content accessible.","s":"bank","k":44},{"id":"b6-7","u":6,"q":"Which of the following is an example of providing a text equivalent?","o":["Adding a watermark to an image","Using \u003calt> attribute for an image","Writing captions in bold text","Using animation instead of text"],"a":1,"e":"The alt attribute on \u003cimg> is the standard text equivalent for an image.","s":"bank","k":44},{"id":"b6-8","u":6,"q":"Accessibility requires that text can operate with text-to-speech technology so that:","o":["Content can be read aloud by assistive technologies","Documents load faster","Content is automatically translated","Text becomes more colorful"],"a":0,"e":"Text-to-speech compatibility means assistive technologies can read the content aloud.","s":"bank","k":44},{"id":"b6-9","u":6,"q":"Which user group benefits most from text-to-speech compatibility?","o":["Users with slow internet","Users with visual impairments","Users with old devices","Users with limited storage"],"a":1,"e":"Text-to-speech mainly serves blind and visually impaired users.","s":"bank","k":44},{"id":"b6-10","u":6,"q":"Why should documents be readable without style sheets (CSS)?","o":["To improve color contrast","To ensure the content is accessible even if styles are disabled or unsupported","To make pages load slower","To hide unnecessary content"],"a":1,"e":"If CSS fails or is turned off, the content and its order must still make sense, especially for assistive tech.","s":"bank","k":45},{"id":"b6-11","u":6,"q":"Which principle of user-centered design ensures that users can easily learn and operate the interface?","o":["Flexibility","Usability","Portability","Scalability"],"a":1,"e":"Usability = how easy the interface is to learn and use. Portability/scalability are technical qualities.","s":"bank","k":46},{"id":"b6-12","u":6,"q":"In visual design, “consistency” helps users by:","o":["Making the interface faster to load","Reducing the need to relearn similar elements across the interface","Providing more color variety","Increasing system security"],"a":1,"e":"Consistent elements behave the same everywhere, so users learn once and reuse that knowledge.","s":"bank","k":40},{"id":"b6-13","u":6,"q":"Why is it important to consider technical parameters (e.g., screen size, resolution, operating system) in UI design?","o":["To make interfaces look identical on all platforms","To optimize usability and accessibility for different devices","To increase the number of fonts available","To reduce testing requirements"],"a":1,"e":"Different screens, resolutions and operating systems change how a UI behaves, so design must adapt to each.","s":"bank","k":47},{"id":"b6-14","u":6,"q":"Which of the following is a typical format for documenting a user interface design?","o":["Flowchart","Wireframe","Gantt chart","Use-case diagram"],"a":1,"e":"A wireframe is the standard skeleton layout used to document a UI design.","s":"bank","k":48},{"id":"b6-15","u":6,"q":"A storyboard in UI design is mainly used to:","o":["Show financial budgeting","Measure screen resolution","Document programming code.","Visualize user interaction sequences step by step"],"a":3,"e":"A storyboard shows the sequence of screens/steps a user goes through.","s":"bank","k":48},{"id":"b6-16","u":6,"q":"A user says, “I prefer talking to my device instead of typing commands or navigating menus.”\nWhich type of interface best suits this preference?","o":["Menu-based Interface","Natural-Language Interface","Command-Line Interface","Graphical User Interface"],"a":1,"e":"Speaking to a device in everyday language is a natural-language (voice) interface.","s":"bank"},{"id":"b6-17","u":6,"q":"You are testing a mobile app that has very small buttons, low contrast text, and slow navigation. What is the biggest issue in terms of UI design principles?","o":["Usability","Accessibility","Visual Attractiveness","Responsiveness"],"a":0,"e":"Small targets, poor contrast and slow navigation all make the app hard to use, which is a usability problem.","s":"bank","f":"Low contrast and small buttons are also accessibility issues; consider rewording.","k":46},{"id":"b6-18","u":6,"q":"Your team needs to present an early interactive version of an app for stakeholder feedback. Which tool would be the best choice?","o":["Notepad","Adobe XD","Google Docs","Command Prompt"],"a":1,"e":"Adobe XD is a prototyping tool that produces clickable, interactive mock-ups for stakeholder feedback.","s":"bank"},{"id":"b6-19","u":6,"q":"A government website is being redesigned. During testing, you discover images are missing alt text, making it difficult for screen reader users. Which guideline is being violated?","o":["WCAG","ATAG","UAAG","ARIA"],"a":0,"e":"Missing alt text breaks WCAG (Web Content Accessibility Guidelines).","s":"bank","k":44},{"id":"b6-20","u":6,"q":"A web developer wants to make sure their website looks the same across Chrome, Firefox, and Safari. Which W3C goal supports this need?","o":["Encourage Innovation","Promote Interoperability","Ensure Legal Compliance","Increase Business Growth"],"a":1,"e":"Interoperability means web content works the same across different browsers and devices.","s":"bank","k":43},{"id":"b6-21","u":6,"q":"You are creating a webpage and want to add a heading followed by a paragraph. Which HTML structure is correct?","o":["\u003ch1>Heading\u003cp>Paragraph\u003c/h1>\u003c/p>","\u003cp>Heading\u003c/p>\u003ch1>Paragraph\u003c/h1>","\u003ch1>Heading\u003c/h1>\u003cp>Paragraph\u003c/p>","\u003cheading>Heading\u003c/heading>\u003cpara>Paragraph\u003c/para>"],"a":2,"e":"Elements must open and close in the right order: \u003ch1>…\u003c/h1> then \u003cp>…\u003c/p>.","s":"bank"},{"id":"b6-22","u":6,"q":"A company has 100 web pages. The manager wants all pages to use the same font and color scheme. What is the best way to achieve this?","o":["Inline CSS","Internal CSS","External CSS","JavaScript"],"a":2,"e":"One external .css file linked by every page lets you change the whole site's look in one place.","s":"bank","k":45},{"id":"b6-23","u":6,"q":"You want to change the text of a \u003cp> element when a user clicks a button. Which JavaScript feature makes this possible?","o":["Loops","Events","Functions","Variables"],"a":1,"e":"An event (e.g. onclick) runs code when the user acts; that is what changes the text.","s":"bank"},{"id":"b6-24","u":6,"q":"You are designing a travel booking site. On desktop, it shows a full navigation bar, but on mobile it collapses into a hamburger menu. Which responsive principle is applied?","o":["Fluid Layouts","Breakpoints & Media Queries","Negative Space","Accessibility"],"a":1,"e":"Media queries switch the layout at set screen widths (breakpoints), e.g. collapsing to a hamburger menu.","s":"bank"},{"id":"b6-25","u":6,"q":"A food delivery app shows the restaurant name in large bold text, followed by the delivery time in smaller text, and then customer reviews in the smallest font. Which UI/UX principle is being applied?","o":["Alignment","Proximity","Hierarchy","Balance"],"a":2,"e":"Visual hierarchy uses size and weight to show what matters most first.","s":"bank","k":46},{"id":"b6-26","u":6,"q":"Which of the following best demonstrates compliance with quality assurance practices in web development?","o":["Deploying the website without testing and monitoring real-time errors","Performing unit testing, regression testing, and documenting defect resolutions","Using only manual testing methods without automation","Relying solely on client feedback after deployment"],"a":1,"e":"QA compliance means planned testing (unit + regression) and documenting how defects were fixed.","s":"bank","k":40},{"id":"b6-27","u":6,"q":"A web designer decides to follow international guidelines that ensure web content is perceivable, operable, understandable, and robust. Which framework is the designer applying?","o":["Six Sigma Quality Assurance","Web Content Accessibility Guidelines (WCAG)","ISO 27001 Information Security","Agile Scrum Standards"],"a":1,"e":"Perceivable, Operable, Understandable, Robust are the four WCAG principles.","s":"bank","k":43},{"id":"b6-28","u":6,"q":"Which scenario best illustrates equity principles in digital design?","o":["Providing a website only in English to maintain brand consistency","Offering text captions, multiple language options, and alternative input methods","Designing an interface optimized only for high-end devices","Restricting access to content based on geographic region"],"a":1,"e":"Captions, multiple languages and alternative inputs give every user group fair access, which is equity.","s":"bank","k":44},{"id":"b6-29","u":6,"q":"Which testing method directly evaluates real users’ interaction to ensure usability?","o":["White-box testing","Usability testing with representative users","Automated regression testing","Penetration testing"],"a":1,"e":"Usability testing puts real, representative users in front of the system.","s":"bank","k":42},{"id":"b6-30","u":6,"q":"The WAI initiative by W3C primarily aims to:","o":["Improve search engine optimization","Provide international guidelines to make web content accessible to people with disabilities","Enforce copyright protection","Standardize programming languages"],"a":1,"e":"WAI's aim is guidelines that make the web accessible to people with disabilities.","s":"bank","k":43},{"id":"b6-31","u":6,"q":"Which of the following reflects compliance with accessibility and equity legislation in an e-learning system?","o":["Locking resources to premium subscribers only","Ensuring the platform meets ADA (Americans with Disabilities Act) requirements","Enforcing strict password complexity policies","Requiring proprietary software installation for access"],"a":1,"e":"Meeting disability law (e.g. ADA) is accessibility/equity compliance.","s":"bank","k":41},{"id":"b6-32","u":6,"q":"Which of the following is not governed by W3C standards?","o":["HTML","CSS","XML","Python"],"a":3,"e":"W3C sets web standards such as HTML, CSS and XML. Python is a general programming language outside W3C.","s":"bank","k":43},{"id":"b6-33","u":6,"q":"Which practice aligns with accessibility standards for non-text content?","o":["Embedding high-resolution images without alt attributes","Using alt text for images to describe their purpose or content","Relying solely on video narration without captions","Using decorative fonts in graphical logos without description"],"a":1,"e":"Alt text describing an image's purpose is the core rule for non-text content.","s":"bank","k":44},{"id":"b6-34","u":6,"q":"An e-book application ensures its content is machine-readable so that users with visual impairments can access it using screen readers. This is an example of:","o":["Accessibility compliance for text-to-speech support","Security feature for intellectual property protection","Cross-browser compatibility","Cloud deployment advantage"],"a":0,"e":"Machine-readable text lets screen readers speak it, which is text-to-speech accessibility.","s":"bank","k":44},{"id":"b6-35","u":6,"q":"Which design choice satisfies accessibility guidelines?","o":["Indicating errors only with red highlights","Using red for errors but also including a text description such as “Invalid input”","Showing required fields only in green","Differentiating sections using only color gradients"],"a":1,"e":"Never rely on colour alone; add a text message too so colour-blind users understand.","s":"bank","k":45},{"id":"b6-36","u":6,"q":"Why is it important that documents remain readable without CSS style sheets?","o":["To increase aesthetic appeal","To ensure accessibility for assistive technologies and text-only browsers","To reduce page load time for mobile users","To enforce W3C compliance for multimedia"],"a":1,"e":"Without CSS, text-only browsers and assistive technologies must still get readable content.","s":"bank","k":45},{"id":"b6-37","u":6,"q":"Which of the following best represents user-centered design?","o":["Designing based solely on developer preferences","Prioritizing end-user needs, usability testing, and feedback in the design process","Copying layouts from trending websites","Choosing aesthetic themes over accessibility requirements"],"a":1,"e":"User-centred design puts end-user needs, testing and feedback at the centre.","s":"bank","k":46},{"id":"b6-38","u":6,"q":"Which technical parameter must developers consider when designing applications to ensure consistent user interface behavior across different platforms such as Android and iOS?","o":["Screen sizes, resolutions, and OS-specific guidelines","Only backend database performance","Aesthetic preferences of the designer","Color choices aligned with brand identity"],"a":0,"e":"Screen sizes, resolutions and each platform's OS guidelines decide how a UI behaves on Android vs iOS.","s":"bank","k":47},{"id":"b6-39","u":6,"q":"Which format is most suitable for documenting user interface workflows for both stakeholders and developers?","o":["UML class diagrams","Site maps, wireframes, and storyboards","Regression test cases","Gantt charts"],"a":1,"e":"Site maps, wireframes and storyboards are understood by both stakeholders and developers.","s":"bank","k":48},{"id":"b6-40","u":6,"q":"You are asked to evaluate a government services website. During testing, you find that the “Apply Now” button is visible but cannot be accessed through a screen reader. Which principle has been violated?","o":["Text-to-speech operability for interactive elements","W3C markup validation","Equity in legislation compliance","Color contrast accessibility"],"a":0,"e":"A button screen readers cannot reach fails text-to-speech operability of interactive elements.","s":"bank","k":44},{"id":"b6-41","u":6,"q":"A university is launching an e-learning portal. During pilot testing, students complain that the platform works well on desktops but key navigation buttons are hidden on mobile browsers. Which design issue is most likely the cause?","o":["Non-compliance with user-centered design and cross-platform parameters","Failure in CSS validation","Incomplete accessibility legislation compliance","Lack of multilingual support"],"a":0,"e":"Hidden buttons on mobile mean the design ignored cross-platform parameters and user-centred design.","s":"bank","k":47},{"id":"b6-42","u":6,"q":"A new employee training system is being planned. Which standard ensures the user interface meets usability and accessibility requirements?","o":["TCP/IP","W3C WCAG","SQL","ISO 27001"],"a":1,"e":"W3C's WCAG is the standard for usable, accessible interfaces. ISO 27001 is security; TCP/IP is networking.","s":"bank","k":43},{"id":"b6-43","u":6,"q":"During development, the designer wants to follow usability standards. Which aspect would directly support this?","o":["Increasing server bandwidth","Ensuring database normalization","Conducting user testing sessions","Encrypting passwords"],"a":2,"e":"User testing sessions check directly whether the design meets usability standards.","s":"bank","k":42},{"id":"b6-44","u":6,"q":"When considering accessibility legislation, which principle ensures people with vision impairment can access web content?","o":["Keyboard shortcuts","Text-to-speech support","Cloud storage","Responsive layout"],"a":1,"e":"Text-to-speech lets people with vision impairment hear the content.","s":"bank","k":41},{"id":"b6-45","u":6,"q":"A design team is preparing usability testing with real users. What is the purpose of this activity?","o":["To reduce server load","To ensure users find the interface intuitive","To increase code efficiency","To identify database queries"],"a":1,"e":"Testing with real users confirms the interface is intuitive.","s":"bank","k":42},{"id":"b6-46","u":6,"q":"Which W3C initiative focuses specifically on making the web accessible to people with disabilities?","o":["XML","HTML5","CSS3","WAI"],"a":3,"e":"WAI (Web Accessibility Initiative) is W3C's accessibility programme.","s":"bank","k":43},{"id":"b6-47","u":6,"q":"A developer is preparing the steps a user follows to book a ticket online. Which task is this?","o":["Formulating content flow","Writing source code","Encrypting payment details","Building server APIs"],"a":0,"e":"Planning the steps a user follows is formulating the content (task) flow.","s":"bank"},{"id":"b6-48","u":6,"q":"In a shopping cart system, the 'Add to Cart' button, search bar, and dropdown menus are examples of:","o":["Accessibility guidelines","UI components","Database fields","Algorithms"],"a":1,"e":"Buttons, search bars and drop-downs are UI components (controls).","s":"bank"},{"id":"b6-49","u":6,"q":"When clicking the 'Submit' button in a registration form, what is the UI action?","o":["Form submission","Server backup","Database update","None of the above"],"a":0,"e":"Clicking Submit triggers the form-submission action.","s":"bank"},{"id":"b6-50","u":6,"q":"If a website responds to hovering over a navigation link by changing color, this is an example of a:","o":["Usability test","UI event","Database query","Server event"],"a":1,"e":"Hover is a UI event that the page reacts to.","s":"bank","k":45},{"id":"b6-51","u":6,"q":"A team decides to build the user interface using JavaScript and React. This step aligns with which objective?","o":["Building backend APIs","Determining the appropriate language","Writing accessibility reports","Creating user personas"],"a":1,"e":"Picking JavaScript/React is the step of determining the appropriate language.","s":"bank"},{"id":"b6-52","u":6,"q":"After selecting a language, the developer codes a login form with username and password fields. This represents:","o":["Performing system backups","Building UI with required functionality","Drafting test cases","Creating wireframes"],"a":1,"e":"Coding a working login form is building the UI with required functionality.","s":"bank","k":48},{"id":"b6-53","u":6,"q":"A student tests a newly developed mobile app to ensure each button works correctly. Which step is this?","o":["Writing HTML","Building UI","Conducting surveys","Testing for functionality"],"a":3,"e":"Checking every button works is functional testing.","s":"bank"},{"id":"b6-54","u":6,"q":"After discovering that the navigation menu is confusing, the designer revises it until users find it easy to use. This is:","o":["Writing accessibility reports","Debugging server code","Creating wireframes","Iterating until requirements are met"],"a":3,"e":"Revise → test → revise again until users are satisfied is iteration.","s":"bank","k":48},{"id":"b6-55","u":6,"q":"The final stage of UI development includes writing a help guide for end users and technical notes for developers. This is:","o":["Building databases","Running unit tests","Coding in JavaScript","Producing user & technical documentation"],"a":3,"e":"A help guide (users) plus technical notes (developers) is the documentation stage.","s":"bank"},{"id":"b6-56","u":6,"q":"Before developing a student portal, the designer researches WCAG 2.1 guidelines. This step corresponds to:","o":["Choosing CSS frameworks","Writing pseudocode","Testing APIs","Identifying standards and requirements"],"a":3,"e":"Researching WCAG before building is identifying standards and requirements.","s":"bank","k":43},{"id":"b6-57","u":6,"q":"To ensure accessibility, a team creates a checklist including 'Provide alt text for images' and 'Use sufficient color contrast.' This represents:","o":["Debugging HTML code","Creating an accessibility checklist","Writing JavaScript functions","Conducting interviews"],"a":1,"e":"A list of accessibility items to tick off is an accessibility checklist.","s":"bank","k":44},{"id":"b6-58","u":6,"q":"A developer runs an automated tool such as WAVE to check accessibility compliance. This is:","o":["Applying automatic testing tools","Validating database schema","Encrypting user data","Writing wireframes"],"a":0,"e":"WAVE is an automatic accessibility-testing tool.","s":"bank","k":48},{"id":"b6-59","u":6,"q":"An e-learning site ensures that every image includes descriptive 'alt text.' This satisfies which requirement?","o":["Designing navigation bars","Creating wireframes","Ensuring text equivalents for non-text elements","Building responsive layout"],"a":2,"e":"Alt text is the text equivalent for non-text elements.","s":"bank","k":44},{"id":"b6-60","u":6,"q":"A weather app uses both colors and icons to indicate temperature levels so that users with color blindness can understand. This aligns with:","o":["Optimizing server speed","Conducting surveys","Verifying color-independent information","Debugging JavaScript"],"a":2,"e":"Using icons as well as colour means information does not depend on colour alone.","s":"bank","k":45},{"id":"b6-61","u":6,"q":"A website developer tests whether the content can be read correctly by screen readers. This ensures:","o":["Writing backend code","Database normalization","Verifying text-to-speech compatibility","Conducting peer review"],"a":2,"e":"Checking screen readers read content correctly verifies text-to-speech compatibility.","s":"bank","k":44},{"id":"b6-62","u":6,"q":"A tester disables CSS style sheets to confirm that the page content is still understandable. This step is:","o":["Checking pages without style sheets","Creating wireframes","Writing test cases","Encrypting data"],"a":0,"e":"Turning CSS off to see if content still makes sense is checking pages without style sheets.","s":"bank","k":45},{"id":"b6-63","u":6,"q":"Which of the following best illustrates the difference between usability and accessibility in a web application?","o":["Usability focuses on keyboard shortcuts, while accessibility focuses only on mobile compatibility","Usability ensures efficiency for all users, while accessibility ensures inclusivity for people with diverse abilities","Usability applies only to visual design, while accessibility applies only to screen readers","Usability prevents errors, while accessibility eliminates navigation menus"],"a":1,"e":"Usability = efficient and easy for everyone; accessibility = usable by people with diverse abilities.","s":"bank","k":46},{"id":"b6-64","u":6,"q":"A banking website highlights missing fields in red and provides error messages like “Invalid email format.” This feature primarily addresses which usability principle?","o":["Efficiency","Error Management","Memorability","Consistency"],"a":1,"e":"Highlighting the error and explaining it helps users recover, which is error management.","s":"bank","k":46},{"id":"b6-65","u":6,"q":"According to compliance strategies, ensuring that all interactive elements can be reached via the Tab key addresses which accessibility requirement?","o":["Screen reader compatibility","Keyboard navigation","Robust content interpretation","Text-to-speech support"],"a":1,"e":"Reaching every control with Tab is keyboard navigation.","s":"bank","k":44},{"id":"b6-66","u":6,"q":"A developer designs an app where visually impaired users can give voice commands to perform tasks. This application demonstrates which type of user interface?","o":["Graphical User Interface (GUI)","Command Line Interface (CLI)","Voice User Interface (VUI)","Natural-Language Processing Interface"],"a":2,"e":"Controlling an app by spoken commands is a Voice User Interface (VUI).","s":"bank"},{"id":"b6-67","u":6,"q":"Which of the following best describes iterative design in UI development?","o":["Building the entire UI once and releasing it to users","Continuously refining the UI based on feedback and repeated testing","Designing only prototypes without real implementation","Relying solely on automated tools to finalize the design"],"a":1,"e":"Iterative design = refine, test, get feedback, repeat.","s":"bank","k":48},{"id":"b6-68","u":6,"q":"Which feature directly protects passwords during transmission from UI to server?","o":["Client-side validation","Event handling","HTTPS/SSL Encryption","Dynamic styling"],"a":2,"e":"HTTPS (SSL/TLS) encrypts data in transit, so passwords are protected between browser and server.","s":"bank"},{"id":"b6-69","u":6,"q":"Why integrate security into the design phase rather than after deployment?","o":["Avoids testing","Reduces costs & prevents vulnerabilities early","Removes need for authentication","Ensures attractive design"],"a":1,"e":"Fixing security at design time is cheaper and prevents vulnerabilities from being built in.","s":"bank"},{"id":"b6-70","u":6,"q":"Which AI-driven feature most directly assists a user with hearing impairments in online lectures?","o":["Predictive text","Automated captions","Keyboard shortcuts","Dynamic color contrast"],"a":1,"e":"Automatic captions turn speech into text for deaf or hard-of-hearing users.","s":"bank","k":44},{"id":"b6-71","u":6,"q":"During testing, users fail to find the checkout button in an e-commerce site. Which method revealed this issue?","o":["Heuristic Evaluation","User Testing","A/B Testing","Automated Testing"],"a":1,"e":"Watching real users fail a task is user testing.","s":"bank","k":42},{"id":"b6-72","u":6,"q":"Which of the following is a principle of visual design for user interfaces?","o":["Random placement of elements","Overloading users with information","Using as many colors as possible","Consistency and clarity"],"a":3,"e":"Consistency and clarity are core visual-design principles.","s":"bank","k":40},{"id":"b9-1","u":9,"q":"Which type of online application is primarily used by employees within a company for internal processes?","o":["Customer facing","Social","Internal business use","Public forum"],"a":2,"e":"Applications used by staff for internal processes (HR, payroll, workflow) are internal business use.","s":"bank","k":64},{"id":"b9-2","u":9,"q":"What is the primary goal of customer-facing applications?","o":["Internal employee collaboration","Public news broadcasting","Engaging external users and providing services","Managing payroll systems"],"a":2,"e":"Customer-facing apps exist to serve and engage external users, e.g. shoppers or bank customers.","s":"bank","k":62},{"id":"b9-3","u":9,"q":"Which category of application has an online store like Amazon falls ?","o":["Social","Internal business use","Customer facing","Open source"],"a":2,"e":"An online store serves the public, so it is customer-facing.","s":"bank","k":62},{"id":"b9-4","u":9,"q":"Which of the following best describes the role of a database server in a web application architecture?","o":["It manages HTML content and user interface rendering","It handles DNS resolution and routing","It stores, retrieves, and manages structured data for dynamic websites","It encrypts all traffic between client and server using SSL"],"a":2,"e":"The database server stores and returns structured data that dynamic pages are built from.","s":"bank","k":68},{"id":"b9-5","u":9,"q":"Which protocol is primarily used to send data securely between a web server and a client?","o":["FTP","HTTP","HTTPS","SMTP"],"a":2,"e":"HTTPS = HTTP + TLS/SSL encryption, so data travels securely.","s":"bank","k":68},{"id":"b9-6","u":9,"q":"In the client-server model, which component is responsible for initiating communication?","o":["Web server","DNS server","Client","Proxy"],"a":2,"e":"The client (browser) always starts the conversation by sending a request; the server responds.","s":"bank","k":68},{"id":"b9-7","u":9,"q":"Which of the following best explains how a reverse proxy server functions in a web application?","o":["It routes outbound email traffic to users.","It serves as a backup database for client request.","It forwards client requests to backend servers and masks their identity.","It scans client files for malware before upload."],"a":2,"e":"A reverse proxy sits in front of back-end servers, forwards requests to them and hides them from clients.","s":"bank","k":68},{"id":"b9-8","u":9,"q":"In modern web architecture, what is the main advantage of using microservices on the server side?","o":["They reduce the size of client-side JavaScript.","They allow individual components to be developed, deployed, and scaled independently.","They eliminate the need for any server infrastructure.","They automatically generate UI components."],"a":1,"e":"Microservices split the server side into small services that can each be built, deployed and scaled on their own.","s":"bank","k":68},{"id":"b9-9","u":9,"q":"A user enters a URL into their browser. Which is the first server their request typically contacts?","o":["Web server","Application server","DNS server","Load balancer"],"a":2,"e":"The domain name must first be turned into an IP address, so the DNS server is contacted first.","s":"bank","k":65},{"id":"b9-10","u":9,"q":"Which of the following best reflects a user-centered design approach when developing a web application?","o":["Focusing only on technical specifications defined by stakeholders","Prioritizing system efficiency over usability","Conducting usability testing and iterating based on user feedback","Designing for mobile last to maximize desktop performance"],"a":2,"e":"User-centred design = test with users and keep improving from their feedback.","s":"bank","k":71},{"id":"b9-11","u":9,"q":"When considering user needs in application design, which of the following is most important?","o":["Choosing the most modern technology stack","Maximizing ad revenue opportunities","Ensuring the interface aligns with user goals and context","Using animations and effects for visual appeal"],"a":2,"e":"Good design fits what users are trying to do and the context they use it in.","s":"bank"},{"id":"b9-12","u":9,"q":"Which of the following is a customer-facing use of a website?","o":["Employee training","Online catalogues","Intranet portals","Document repositories"],"a":1,"e":"Online catalogues are for customers to browse products, so they are customer-facing.","s":"bank","k":62},{"id":"b9-13","u":9,"q":"What is the primary purpose of a business website used for marketing?","o":["To store confidential company data","To train staff internally","To manage employee schedules","To promote products or services to customers"],"a":3,"e":"Marketing websites promote products and services to customers.","s":"bank","k":62},{"id":"b9-14","u":9,"q":"An intranet is mainly used for:","o":["Reaching global customers","Internal communication and collaboration within a business","Selling products online","Running social campaigns"],"a":1,"e":"An intranet is a private network site for staff communication and collaboration.","s":"bank","k":63},{"id":"b9-15","u":9,"q":"Which of the following represents the social use of websites?","o":["Social networking and community building","E-commerce platforms","Corporate information pages","Internal business training portals"],"a":0,"e":"Social use = networking and building communities.","s":"bank","k":64},{"id":"b9-16","u":9,"q":"Online applications provided through websites are mainly used for:","o":["Enabling interactive services like email, banking, or cloud tools","Publishing a company’s address and contact details","Hosting marketing videos only","Archiving printed documents"],"a":0,"e":"Online applications deliver interactive services such as e-mail, banking and cloud tools.","s":"bank","k":64},{"id":"b9-17","u":9,"q":"What is the main function of HTTP in web communication?","o":["Encrypting data between servers","Routing packets between devices","Defining how messages are formatted and transmitted between browsers and servers","Storing web pages for offline use"],"a":2,"e":"HTTP defines the request/response message format between browser and server.","s":"bank","k":65},{"id":"b9-18","u":9,"q":"Which of the following statements about domains and registrars is correct?","o":["A registrar manages IP routing for ISPs.","A domain is purchased directly from ICANN, without registrars.","A registrar is an authorized organization that sells and manages domain names.","A register is the URL used to access a website."],"a":2,"e":"A registrar is an accredited company that sells and manages domain names.","s":"bank","k":65},{"id":"b9-19","u":9,"q":"What role does an Internet Service Provider (ISP) play in web architecture?","o":["Registers domain names","Provides end users with access to the internet","Stores websites on hosting servers","Develops web applications"],"a":1,"e":"The ISP connects end users to the Internet.","s":"bank","k":66},{"id":"b9-20","u":9,"q":"Which of the following best defines a web hosting service?","o":["A service that registers domain names","A service that provides space and resources on a server to make websites accessible online","A protocol for secure communication on the web","A service for faster internet access speeds"],"a":1,"e":"Hosting rents server space and resources so a website is reachable online.","s":"bank","k":66},{"id":"b9-21","u":9,"q":"Which factor most directly influences access speeds for end users?","o":["The speed of the user’s ISP connection and server response time","The size of the URL","The registrar used for the domain","The number of cookies stored in the browser"],"a":0,"e":"Access speed depends mainly on the user's connection and how fast the server responds.","s":"bank","k":66},{"id":"b9-22","u":9,"q":"Which feature distinguishes Web 2.0 from the early web?","o":["Static HTML pages only","Focus on user-generated content and interactivity","Absence of social media platforms","Exclusive reliance on email for communication"],"a":1,"e":"Web 2.0 = interactive, user-generated content (blogs, social media, wikis).","s":"bank","k":67},{"id":"b9-23","u":9,"q":"What is the primary difference between a web server and a proxy server?","o":["A web server hosts content, while a proxy server acts as an intermediary to manage requests.","A web server encrypts email, while a proxy server only stores cached files.","A web server manages domains, while a proxy server registers IP addresses.","They perform the same functions but at different speeds."],"a":0,"e":"A web server hosts and delivers content; a proxy sits in the middle handling requests on behalf of others.","s":"bank","k":68},{"id":"b9-24","u":9,"q":"Which of the following statements about a mail server is accurate?","o":["It stores static HTML pages for client access.","It manages the sending, receiving, and storage of email messages.","It caches frequently accessed websites for faster browsing.","It authenticates domain registrations."],"a":1,"e":"Mail servers send, receive and store e-mail.","s":"bank","k":68},{"id":"b9-25","u":9,"q":"Which of the following best describes the role of a wireframe in web design?","o":["A high-fidelity prototype with interactive elements","A rough sketch used only for brainstorming design ideas","A low-fidelity blueprint focusing on layout and functionality, not style","A storyboard with user interaction sequences"],"a":2,"e":"Wireframes are low-fidelity: layout and function only, no colours or styling.","s":"bank","k":69},{"id":"b9-26","u":9,"q":"A storyboard in web design differs from a wireframe because it:","o":["Represents only visual design with no interaction","Emphasizes user flow and navigation paths across multiple screens","Provides the final coded version of the website","Is mainly used to define font sizes and color palettes"],"a":1,"e":"Storyboards show the user's journey across several screens; a wireframe shows one screen's layout.","s":"bank","k":69},{"id":"b9-27","u":9,"q":"Which of the following statements about CSS is most accurate?","o":["CSS only defines HTML structure.","CSS separates content from presentation, enabling consistent styling across multiple pages.","CSS is outdated and replaced entirely by HTML5.","CSS can only be applied inline within HTML tags."],"a":1,"e":"CSS separates presentation from content so styles can be shared by many pages.","s":"bank","k":70},{"id":"b9-28","u":9,"q":"Frames in HTML are now rarely used because:","o":["They cannot display hyperlinks.","They were never part of HTML specifications.","They prevent integration with CSS.","They break usability, bookmarking, and accessibility standards."],"a":3,"e":"Frames break bookmarking, the back button, search indexing and screen readers, so they are avoided.","s":"bank","k":70},{"id":"b9-29","u":9,"q":"When designing for usability, why is clear navigation considered critical?","o":["It ensures that hyperlinks are cached in proxy servers.","It minimizes the number of colors required in CSS.","It helps users find content quickly without confusion.","It ensures search engines rank the website higher."],"a":2,"e":"Clear navigation lets users find what they want fast without getting lost.","s":"bank","k":71},{"id":"b9-30","u":9,"q":"Which of the following is an interactive feature often used to simulate navigation between screens in wireframes or prototypes?","o":["Tables","Hotspots","Templates","Logos"],"a":1,"e":"Hotspots are clickable areas in a prototype that simulate moving between screens.","s":"bank","k":70},{"id":"b9-31","u":9,"q":"Which factor is most important when selecting colors and fonts for a website?","o":["They must match the latest design trends regardless of readability.","They should align with branding but also support readability and accessibility.","They should always be bright to attract users’ attention.","They must be chosen only based on the designer’s preference."],"a":1,"e":"Colours and fonts should reflect the brand but must stay readable and accessible.","s":"bank","k":71},{"id":"b9-32","u":9,"q":"A clothing store launches a website with a banner 'Summer Sale - 30% OFF'. What use of websites does this demonstrate?","o":["Internal training","Social networking","Customer-facing marketing","Information repository"],"a":2,"e":"A sale banner promotes products to customers, which is customer-facing marketing.","s":"bank","k":62},{"id":"b9-33","u":9,"q":"An electronics shop creates a website where  site.","s":"bank","k":71},{"id":"b9-109","u":9,"q":"You are visiting a travel booking website. The homepage takes a long time to load, and the images of hotels are too large. You leave the site without booking.\nWhat design problem does this website have, and how could it be solved?","o":["Poor accessibility; add more colors","Slow download speeds; optimize images and improve hosting","Bad navigation; remove menus","Weak branding; change the logo"],"a":1,"e":"Large images and slow loading = download-speed problem; fix by optimising images and improving hosting.","s":"bank","k":66},{"id":"b9-110","u":9,"q":"A university designs a new online training portal for students. However, visually impaired students cannot use it because the images do not have alternative text.\nWhat should the designers do to make the portal more accessible?","o":["Add background music to every page","Provide alternative text (alt text) for all images","Use bright colors to highlight menus","Reduce the number of images completely"],"a":1,"e":"Adding alt text to all images fixes the screen-reader problem.","s":"bank","k":71},{"id":"b9-111","u":9,"q":"A company wants to let customers explore all its products online without visiting a store. Which website feature would best support this?","o":["Internal HR policies","Company news blog","Product catalogue page","Training portal"],"a":2,"e":"A product catalogue page lets customers explore products online.","s":"bank","k":62},{"id":"b9-112","u":9,"q":"An organization needs a private platform for staff to share documents and announcements. Which type of website would fit this need?","o":["Online shopping site","Intranet site","Public social network","Customer support forum"],"a":1,"e":"A private staff platform is an intranet.","s":"bank","k":63},{"id":"b9-113","u":9,"q":"A student edits a group project file with classmates from different cities using their browsers. Which tool allows this?","o":["Offline text editor","Installed desktop software","Online application","Device-specific program"],"a":2,"e":"Editing together in a browser from different cities needs an online application.","s":"bank","k":64},{"id":"b9-114","u":9,"q":"A browser requests a web page and receives the data from a server. Which protocol made this possible?","o":["Hyper Tool Tagging Program","HyperText Transfer Protocol","High Transmission Transfer Process","Hyperlink Text Tracking Protocol"],"a":1,"e":"HTTP (HyperText Transfer Protocol) carries web pages from server to browser.","s":"bank","k":68},{"id":"b9-115","u":9,"q":"A website allows users to post reviews, comment on products, and edit shared content. Which concept does this reflect?","o":["Static Web 1.0 model","Limited client-server model","interactive model","Dedicated hosting model"],"a":2,"e":"Reviews, comments and shared editing are the interactive (Web 2.0) model.","s":"bank","k":70},{"id":"b9-116","u":9,"q":"A company regularly posts articles with industry tips and allows readers to comment. What type of web platform is this?","o":["File storage system","Online blog","DNS registry","Remote database"],"a":1,"e":"Regular articles with reader comments = a blog.","s":"bank","k":67},{"id":"b9-117","u":9,"q":"When a user visits a site, which server sends the website’s pages to their browser?","o":["Proxy server","Database server","Mail server","Web server"],"a":3,"e":"The web server sends page files to the browser.","s":"bank","k":68},{"id":"b9-119","u":9,"q":"A designer sketches where the menu, content, and footer will appear on each page before coding. What is she creating?","o":["Security policy","Wireframe","Login system","Cloud template"],"a":1,"e":"Sketching where menu, content and footer go is a wireframe.","s":"bank","k":70},{"id":"b9-120","u":9,"q":"Visitors leave a site quickly because menus are confusing and pages load slowly. Which aspect likely needs improvement?","o":["Hosting cost","Website usability","Banner ads","Page animations"],"a":1,"e":"Confusing menus and slow pages are usability problems.","s":"bank","k":71},{"id":"b10-1","u":10,"q":"The college’s IT department wants to create a homepage that all browsers can display correctly. Which markup should they use to ensure compatibility?","o":["HTML5","Python","C++","PHP"],"a":0,"e":"HTML5 is the W3C markup standard all modern browsers render. Python, C++ and PHP are not markup languages.","s":"bank","c":1,"k":77},{"id":"b10-2","u":10,"q":"A developer is designing pages that must display correctly on Chrome, Safari, and Edge. Which HTML standard supports this?","o":["HTML5 (standardized by W3C)","Older HTML 3.2","Proprietary XHTML","Browser-specific extensions"],"a":0,"e":"HTML5, standardised by W3C, is supported consistently by Chrome, Safari and Edge.","s":"bank","k":79},{"id":"b10-3","u":10,"q":"The homepage displays incorrectly on some older browsers. Which HTML version is likely missing modern compatibility features?","o":["HTML 3.2","HTML5","HTML5.1","XHTML"],"a":0,"e":"HTML 3.2 is a very old version without modern features, so it causes compatibility problems.","s":"bank","c":1,"k":77},{"id":"b10-4","u":10,"q":"A student uses \u003cimg> tags to add images but they stretch on mobile. What should she add to make them responsive?","o":["max-width:100%; height:auto;","width:500px;","float:right;","background-repeat:no-repeat;"],"a":0,"e":"max-width:100% stops the image overflowing its container; height:auto keeps its proportions.","s":"bank","k":76},{"id":"b10-5","u":10,"q":"Which tag ensures the browser adjusts content size to the device width?","o":["\u003cmeta name='viewport' content='width=device-width, initial-scale=1'>","\u003cmeta charset='UTF-8'>","\u003clink rel='stylesheet'>","\u003cscript src='main.js'>"],"a":0,"e":"The viewport meta tag tells mobile browsers to use the real device width instead of a zoomed-out desktop width.","s":"bank","k":77},{"id":"b10-6","u":10,"q":"The designer must make sure the page looks consistent across devices. Which CSS method helps achieve that?","o":["Media queries","Internal styling only","Using \u003cfont> tags","Fixed pixel widths"],"a":0,"e":"Media queries apply different CSS for different screen sizes, keeping the page consistent across devices.","s":"bank","c":1,"k":75},{"id":"b10-7","u":10,"q":"The college wants to improve load time. What should be used for faster rendering of fonts?","o":["WOFF or WOFF2","BMP","TIFF","OTF only"],"a":0,"e":"WOFF/WOFF2 are compressed web-font formats built for fast loading.","s":"bank","c":1,"k":72},{"id":"b10-8","u":10,"q":"The website must support users with disabilities. Which element improves accessibility for screen readers?","o":["alt attribute","style attribute","float:left;","overflow:hidden;"],"a":0,"e":"Screen readers read the alt attribute aloud in place of the image.","s":"bank","k":80},{"id":"b10-9","u":10,"q":"To improve SEO and accessibility, each page should have one unique:","o":["\u003ch1> heading","\u003ctitle> and \u003ch3>","\u003cb> text","\u003cdiv>"],"a":0,"e":"Each page should have exactly one unique \u003ch1> describing its main topic.","s":"bank","c":1,"k":72},{"id":"b10-10","u":10,"q":"The developer uses a grid layout for aligning elements. Which CSS feature is this?","o":["display:grid;","display:block;","float:left;","align:center;"],"a":0,"e":"display:grid turns on CSS Grid layout.","s":"bank","k":75},{"id":"b10-11","u":10,"q":"If the navigation bar overlaps on smaller screens, what technique can fix it?","o":["Media query for screen width","Add inline styles","Change HTML version","Add more \u003cbr> tags"],"a":0,"e":"A media query can change the navigation layout below a certain screen width.","s":"bank","c":1,"k":75},{"id":"b10-12","u":10,"q":"Which color contrast improves text readability?","o":["Dark text on light background","Bright text on bright background","Blue on blue","Light gray on white"],"a":0,"e":"High contrast, such as dark text on a light background, is easiest to read.","s":"bank","c":1,"k":80},{"id":"b10-13","u":10,"q":"A teacher’s profile image looks blurry on the new website. Which format should be used for best quality and smaller size?","o":["JPEG","BMP","TIFF","RAW"],"a":0,"e":"JPEG gives good photo quality at small file size. BMP, TIFF and RAW files are huge.","s":"bank","c":1,"k":81},{"id":"b10-14","u":10,"q":"A student adds a YouTube video using \u003ciframe>. What is this media type?","o":["Embedded media","Linked script","Static text","External stylesheet"],"a":0,"e":"Content from another site shown via \u003ciframe> is embedded media.","s":"bank","k":75},{"id":"b10-15","u":10,"q":"The website must display correctly on both phones and desktops. What is this feature called?","o":["Responsive design","Interactive scripting","Server validation","Static rendering"],"a":0,"e":"Adapting the layout to phones and desktops is responsive design.","s":"bank","c":1,"k":76},{"id":"b10-16","u":10,"q":"A web developer uses 'em' and 'rem' in CSS instead of 'px'. Why?","o":["They scale text relative to font size","They fix text to 16px","They lock layout size","They disable responsiveness"],"a":0,"e":"em and rem are relative units that scale with font size, helping responsiveness.","s":"bank","c":1,"k":72},{"id":"b10-17","u":10,"q":"The footer text must remain centered regardless of screen width. Which CSS property ensures this?","o":["text-align:center;","float:center;","position:fixed;","margin-top:0;"],"a":0,"e":"text-align:center centres inline content such as text at any width. There is no float:center.","s":"bank","c":1,"k":75},{"id":"b10-18","u":10,"q":"To ensure proper character display in Arabic and English, which meta tag should be used?","o":["\u003cmeta charset='UTF-8'>","\u003cmeta name='viewport'>","\u003cmeta language='en'>","\u003cscript charset='UTF-16'>"],"a":0,"e":"UTF-8 encodes both Arabic and English characters correctly.","s":"bank","c":1,"k":76},{"id":"b10-19","u":10,"q":"Which file format is best for vector-based icons and logos on the college site?","o":["SVG","JPEG","GIF","BMP"],"a":0,"e":"SVG is a vector format, so icons and logos stay sharp at any size.","s":"bank","c":1,"k":81},{"id":"b10-20","u":10,"q":"A student’s website loads slowly because of large images. What can improve performance?","o":["Compress images","Use BMP format","Increase resolution","Add extra CSS"],"a":0,"e":"Compressing images shrinks file size and speeds up loading.","s":"bank","c":1,"k":75},{"id":"b10-21","u":10,"q":"If the college wants the layout to automatically adjust to tablets, what should the CSS include?","o":["@media screen and (min-width:768px)","@keyframes fade","@font-face","@import url"],"a":0,"e":"@media screen and (min-width:768px) targets tablet-sized screens and up.","s":"bank","k":72},{"id":"b10-22","u":10,"q":"Which file format is ideal for transparent images like the college logo?","o":["PNG","JPG","TIFF","BMP"],"a":0,"e":"PNG supports transparency; JPG and BMP do not.","s":"bank","c":1,"k":81},{"id":"b10-23","u":10,"q":"The webpage must validate under W3C standards. What tool checks HTML code correctness?","o":["HTML Validator","CSS Linter","ODBC Checker","API Tester"],"a":0,"e":"The W3C HTML Validator checks HTML against the standard. A CSS linter checks CSS.","s":"bank","c":1,"k":79},{"id":"b10-24","u":10,"q":"What happens if CSS is embedded in each HTML file instead of external stylesheet?","o":["Harder maintenance, slower load","Better performance","Faster debugging","Automatic validation"],"a":0,"e":"Repeating CSS in every page means many places to edit and no shared browser caching.","s":"bank","c":1,"k":75},{"id":"b10-25","u":10,"q":"Which CSS property ensures equal spacing between grid items?","o":["gap","float","padding-left","border-radius"],"a":0,"e":"gap sets equal spacing between grid (and flex) items.","s":"bank","k":75},{"id":"b10-26","u":10,"q":"Which tag structure ensures a properly nested HTML document?","o":["\u003chtml>\u003chead>\u003c/head>\u003cbody>\u003c/body>\u003c/html>","\u003cbody>\u003chtml>\u003c/html>\u003c/body>","\u003chead>\u003cbody>\u003c/body>\u003c/head>","\u003chtml>\u003cbody>\u003chead>\u003c/head>\u003c/body>\u003c/html>"],"a":0,"e":"\u003chtml> wraps everything; \u003chead> comes before \u003cbody> inside it.","s":"bank"},{"id":"b10-27","u":10,"q":"The IT manager asks to ensure color contrast for visually impaired users. Which guideline does this follow?","o":["Accessibility (WCAG)","Performance","SEO","Cross-browser design"],"a":0,"e":"Colour contrast for visually impaired users is a WCAG accessibility requirement.","s":"bank","c":1,"k":80},{"id":"b10-28","u":10,"q":"If a developer sets fixed width of 960px for the content, how will it affect mobile users?","o":["They must scroll horizontally","It improves readability","It auto-fits smaller screens","It increases speed"],"a":0,"e":"A fixed 960px width is wider than a phone, so mobile users must scroll sideways.","s":"bank","c":1,"k":78},{"id":"b10-29","u":10,"q":"The header’s logo must always appear proportionally scaled. Which CSS ensures this?","o":["max-width:100%; height:auto;","width:500px;","overflow:hidden;","padding:0;"],"a":0,"e":"max-width:100% with height:auto scales the logo while keeping its proportions.","s":"bank","c":1,"k":75},{"id":"b10-30","u":10,"q":"A student mistakenly uses \u003cfont> tags to style text. What’s the correct modern alternative?","o":["CSS rules (color, font-family)","HTML attributes","JavaScript inline style","Using \u003cb> tags"],"a":0,"e":"\u003cfont> is obsolete. Use CSS properties such as color and font-family.","s":"bank","k":72},{"id":"b10-31","u":10,"q":"A developer is creating a blog post layout. They want to semantically define a self-contained composition that is independently distributable, such as a forum post or magazine article. Which HTML5 element should they use?","o":["\u003csection>","\u003cdiv>","\u003carticle>","\u003caside"],"a":2,"e":"\u003carticle> marks self-contained content that could be distributed on its own, like a blog post.","s":"bank","k":72},{"id":"b10-32","u":10,"q":"You are tasked with creating an accessible data table. The table has a header, \"Monthly Sales,\" and two columns: \"Product\" and \"Revenue.\" To programmatically associate the \"Monthly Sales\" text with the entire table for screen readers, what is the best practice?","o":["Use a \u003ccaption> element inside the \u003ctable>.","Use a \u003cth colspan=\"2\"> in the first row.","Use the title attribute on the \u003ctable> tag.","Use a \u003cp> element immediately before the table."],"a":0,"e":"\u003ccaption> is the semantic title for a table and is announced by screen readers.","s":"bank","k":80},{"id":"b10-33","u":10,"q":"You are implementing a drag-and-drop interface to reorder items in a list. You have used the draggable=\"true\" attribute and the dragstart event to set the data. During the drag, you need to prevent the default handling over a drop zone to allow a drop. Which event must you cancel by calling event.preventDefault()?","o":["The drag event on the draggable element.","The dragover event on the target drop zone.","The dragenter event on the target drop zone.","The drop event on the target drop zone"],"a":1,"e":"A drop zone only accepts a drop if the dragover event's default is prevented.","s":"bank","k":72},{"id":"b10-34","u":10,"q":"You are writing an XHTML 1.0 Strict document that includes a link to an external CSS file. According to the standard, where should the \u003clink> tag be placed, and what attributes are required for it to be valid?","o":["In the \u003cbody>, with href and type attributes.","In the \u003chead>, with href and rel attributes.","In the \u003chead>, with href, rel, and type attributes.","Anywhere in the document, with src and rel attributes"],"a":2,"e":"In XHTML Strict, \u003clink> goes in \u003chead> with href, rel and type.","s":"bank","k":72},{"id":"b10-35","u":10,"q":"During a website redesign, the team is debating layout strategies. A colleague argues for a \"Mobile First\" approach. What is the primary rationale for this?","o":["It makes the desktop version of the site load faster.","It prioritizes the user experience on the smallest screens, then enhances it for larger ones using min-width media queries.","It is easier to code than a desktop-first approach.","It ensures the website looks identical on all devices."],"a":1,"e":"Mobile-first designs for the smallest screen first, then adds layout for bigger screens with min-width queries.","s":"bank","k":75},{"id":"b10-36","u":10,"q":"You are building a responsive site and have set a max-width: 100% on all images. On a blog post, an author has uploaded a very large image (2000px wide). On a high-DPI (Retina) mobile screen with a viewport of 375px, what is the expected outcome?","o":["The image will display at 2000px, causing horizontal scrolling.","The image will display at 375px, potentially looking blurry on the high-DPI screen.","The image will display at 750px, using the high-DPI screen's pixel ratio, but be constrained to the viewport width.","The image will not display because it is too large."],"a":2,"e":"max-width:100% limits the image to the 375px viewport width; a high-DPI screen uses extra device pixels so it stays sharp.","s":"bank","f":"Options B and C are both muddled about CSS vs device pixels. Consider rewriting.","k":78},{"id":"b10-37","u":10,"q":"A user reports that your website's layout is broken in Internet Explorer 11, but it works perfectly in Chrome and Firefox. Your CSS uses modern features like CSS Grid. What is the best long-term strategy for handling this?","o":["Use a CSS reset to remove all default styles.","Implement a progressive enhancement approach, providing a simpler, functional layout for older browsers and enhanced layouts for modern ones.","Detect the user's browser and block access if it's IE11.","Rewrite all layouts using HTML tables for maximum compatibility."],"a":1,"e":"Progressive enhancement: a basic working layout for old browsers, richer layouts for modern ones.","s":"bank","k":75},{"id":"b10-38","u":10,"q":"Your web application uses a JavaScript feature, the fetch() API, which is not supported in Internet Explorer. To make the application work without changing the code, what tool or technique can you use?","o":["A CSS preprocessor like Sass.","A polyfill that implements the fetch API using older XMLHttpRequest.","A JavaScript linter like ESLint.","A different backend programming language."],"a":1,"e":"A polyfill adds a missing browser feature (fetch) using older technology (XMLHttpRequest).","s":"bank","k":76},{"id":"b10-39","u":10,"q":"You are performing an accessibility audit. You find that all form \u003cinput> elements use a \u003cp> tag for their labels. What is the most accessible and semantically correct way to associate a label with an input?","o":["Use a \u003cdiv> with a for attribute matching the input's id.","Use a \u003clabel> element with a for attribute matching the input's id.","Use the title attribute on the \u003cinput>.","Use a \u003cspan> with a class=\"label\"."],"a":1,"e":"\u003clabel for=\"id\"> programmatically links the label to its input.","s":"bank","k":72},{"id":"b10-40","u":10,"q":"A screen reader user is navigating a data table via its headers. The table has a structure where the first column contains row headers (e.g., \"Name,\" \"Email\") and the top row contains column headers (e.g., \"Q1 Sales,\" \"Q2 Sales\"). For a data cell at the intersection of \"Email\" and \"Q2 Sales,\" which technique best ensures the screen reader announces both relevant headers?","o":["Use scope=\"row\" on the row header and scope=\"col\" on the column headers.","Use scope=\"rowgroup\" and scope=\"colgroup\".","Use id and headers attributes on every cell.","Use ARIA roles role=\"rowheader\" and role=\"columnheader\"."],"a":0,"e":"For a simple table with one row-header column and one column-header row, scope=\"row\" and scope=\"col\" is the recommended technique; id/headers is for complex tables.","s":"bank","c":1,"k":72},{"id":"b10-41","u":10,"q":"You are implementing a complex custom dropdown menu that is built with \u003cdiv> and \u003cspan> elements for styling, not a native \u003cselect>. To make it fully accessible, you need to ensure it can be operated with a keyboard and that screen readers understand its state (expanded/collapsed). Which combination of ARIA attributes is most critical?","o":["role=\"list\" and aria-sort","role=\"menu\", aria-haspopup=\"true\", aria-expanded, and managing focus with JavaScript.","role=\"navigation\" and aria-label","aria-live=\"polite\" and aria-required"],"a":1,"e":"A custom dropdown needs a role, aria-haspopup, aria-expanded (open/closed state) and keyboard focus handling.","s":"bank","k":76},{"id":"b10-42","u":10,"q":"Which of the following best describes usability in web design?","o":["Making the website load faster","Ensuring the website can be used easily and intuitively by visitors","Adding animations and graphics to improve appearance","Writing clean HTML code"],"a":1,"e":"Usability = easy and intuitive to use.","s":"bank","k":76},{"id":"b10-43","u":10,"q":"Accessibility in web design refers to:","o":["Designing websites that only work on desktop devices","Making websites more colorful and engaging","Ensuring websites can be accessed and used by people with disabilities","Reducing the number of images for faster loading"],"a":2,"e":"Accessibility = people with disabilities can use the site.","s":"bank","k":80},{"id":"b10-44","u":10,"q":"Responsiveness in web design ensures that:","o":["The website changes colors based on user interaction","The website adapts and looks good on all screen sizes and devices","The website contains responsive customer support","The website automatically updates its content daily"],"a":1,"e":"Responsive = adapts to every screen size.","s":"bank","k":76},{"id":"b10-45","u":10,"q":"Which language is most commonly used for client-side scripting to enhance interactivity?","o":["PHP","JavaScript","Python","SQL"],"a":1,"e":"JavaScript runs in the browser (client-side). PHP runs on the server.","s":"bank","k":76},{"id":"b10-46","u":10,"q":"Which of the following is a main purpose of web scripting?","o":["Storing data in a physical file","Adding interactivity and dynamic behavior to web pages","Designing the structure of HTML elements","Changing website hosting servers"],"a":1,"e":"Scripting adds interactivity and dynamic behaviour.","s":"bank","k":76},{"id":"b10-47","u":10,"q":"Which approach helps create user-friendly and visually appealing web pages?","o":["Using bright colors and many fonts","Maintaining consistent layout, clear navigation, and readable text","Using long text blocks without headings","Ignoring mobile optimization"],"a":1,"e":"Consistent layout, clear navigation and readable text make pages user-friendly.","s":"bank","k":72},{"id":"b10-48","u":10,"q":"Which factor best measures a website’s performance?","o":["How attractive its design is","The number of pages it contains","The time it takes to load and respond to user actions","The size of its logo image"],"a":2,"e":"Performance is measured by load and response times.","s":"bank"},{"id":"b10-49","u":10,"q":"Which criterion is most related to maintainability of a website?","o":["The website can be easily updated and modified without breaking functionality","The website uses advanced animations","The website is hosted on a secure server","The website includes multiple ads"],"a":0,"e":"Maintainable = easy to update without breaking things.","s":"bank"},{"id":"b10-50","u":10,"q":"Which of the following is not a key principle of effective web design?","o":["Usability","Accessibility","Responsiveness","Complexity"],"a":3,"e":"Complexity works against good design; usability, accessibility and responsiveness are principles.","s":"bank","k":76},{"id":"b10-51","u":10,"q":"Why is usability important in web design?","o":["It makes the website more colorful","It helps users navigate and complete tasks easily","It reduces the number of web pages","It increases file size for better quality"],"a":1,"e":"Usability helps users navigate and finish tasks easily.","s":"bank","k":76},{"id":"b10-52","u":10,"q":"Which statement best describes accessibility in web design?","o":["Allowing users to edit the source code","Designing websites for all users, including those with disabilities","Limiting the website to desktop view only","Increasing download time for large content"],"a":1,"e":"Accessibility means designing for all users, including those with disabilities.","s":"bank","k":80},{"id":"b10-53","u":10,"q":"Responsive web design means:","o":["The site responds with a message when you click","The layout adjusts to different screen sizes and devices","The background color changes based on time","The site refreshes automatically every hour"],"a":1,"e":"Responsive design adjusts the layout to screen size and device.","s":"bank","k":76},{"id":"b10-54","u":10,"q":"Why is JavaScript important for web pages?","o":["It stores data in a database","It controls the operating system","It adds interactivity and dynamic content","It creates the structure of the page"],"a":2,"e":"JavaScript adds interactivity and dynamic content; HTML gives structure.","s":"bank","k":76},{"id":"b10-55","u":10,"q":"Which of the following statements about browsers is true?","o":["All browsers interpret HTML and CSS exactly the same","Some features may work differently depending on the browser","Browsers cannot run JavaScript","Web pages look identical on all browsers"],"a":1,"e":"Browsers differ in how they support some features, so pages must be tested in each.","s":"bank","k":76},{"id":"b10-56","u":10,"q":"Which browser feature mainly affects how scripts are executed?","o":["Window size","Browser’s JavaScript engine","Installed fonts","Network speed"],"a":1,"e":"Each browser's JavaScript engine (V8, SpiderMonkey…) executes scripts.","s":"bank","k":76},{"id":"b10-57","u":10,"q":"Why is screen resolution important in web design?","o":["It affects how much content fits on the screen","It determines the user’s internet speed","It controls browser security","It prevents hacking"],"a":0,"e":"Resolution decides how much content fits on the screen.","s":"bank","k":78},{"id":"b10-58","u":10,"q":"Which CSS unit helps make designs responsive across different screen resolutions?","o":["px","cm","% or vw/vh","pt"],"a":2,"e":"Relative units (% or vw/vh) scale with the screen.","s":"bank","k":78},{"id":"b10-59","u":10,"q":"What happens if a website is not responsive?","o":["It loads faster","It looks distorted or difficult to use on mobile devices","It becomes more secure","It automatically changes colors"],"a":1,"e":"A non-responsive site looks distorted or is hard to use on phones.","s":"bank","k":76},{"id":"b10-60","u":10,"q":"What is the best way to test responsiveness?","o":["Resize the browser window or use device emulators","Change the text color","Disable JavaScript","Clear cache"],"a":0,"e":"Resize the window or use device emulators (DevTools) to test responsiveness.","s":"bank","k":76},{"id":"b10-61","u":10,"q":"Which design approach helps websites adjust automatically to any device size?","o":["Static layout","Fixed-width layout","Fluid or flexible layout","Manual resizing"],"a":2,"e":"Fluid/flexible layouts use relative widths that adjust to any screen.","s":"bank"},{"id":"b10-62","u":10,"q":"A web page that appears too small on a phone likely has:","o":["Too many images","No viewport meta tag","Too much text","Broken links"],"a":1,"e":"Without the viewport meta tag, phones show a zoomed-out desktop page.","s":"bank","k":78},{"id":"b10-63","u":10,"q":"A trainee is building a college homepage and wants the main title to appear as the largest heading. Which tag should be used?","o":["\u003chead>","\u003ch1>","\u003ch6>","\u003cheader>"],"a":1,"e":"\u003ch1> is the top-level, largest heading. \u003chead> is metadata, not a heading.","s":
